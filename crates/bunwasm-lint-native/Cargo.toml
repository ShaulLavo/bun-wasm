[package]
name = "bunwasm-lint-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bun's Yarr and number-format bindings, Unicode normalization and zstd linkage for the native lint/format drivers"

[dependencies]
zstd-sys = { version = "2", default-features = false }
icu_normalizer = { version = "=2.4.0", features = ["compiled_data", "utf16_iter"] }

[build-dependencies]
serde_json = "1"
