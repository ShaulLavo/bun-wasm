[package]
name = "bunwasm-spidermonkey"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Experimental SpiderMonkey VM-only G2 shim"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
encoding_c = "=0.9.8"
encoding_c_mem = "=0.2.6"
icu_normalizer = { version = "=2.4.0", features = ["compiled_data", "utf16_iter"] }
smallvec = "1.15"
write16 = { version = "1.0", features = ["smallvec"] }

[build-dependencies]
cc = "1"

[[example]]
name = "smoke"
required-features = ["standalone"]

[[example]]
name = "side"
required-features = ["standalone"]
crate-type = ["staticlib"]

[features]
standalone = []

# Enables write16's SmallVec sink implementation used by the copied normalizer.
[package.metadata.cargo-machete]
ignored = ["write16"]
