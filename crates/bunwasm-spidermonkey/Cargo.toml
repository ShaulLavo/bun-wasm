[package]
name = "bunwasm-spidermonkey"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Experimental SpiderMonkey JSAPI shim"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
encoding_c = "=0.9.8"
encoding_c_mem = "=0.2.6"
icu_casemap = { version = "=2.4.0", features = ["compiled_data"] }
icu_collections = { version = "=2.4.0", features = ["alloc"] }
icu_normalizer = { version = "=2.4.0", features = ["compiled_data", "utf16_iter"] }
icu_properties = { version = "=2.4.0", features = ["compiled_data"] }
smallvec = "1.15"
write16 = { version = "1.0", features = ["smallvec"] }

[build-dependencies]
cc = "1"

[[example]]
name = "smoke"
required-features = ["standalone"]

[[example]]
name = "side"
required-features = ["standalone"]
crate-type = ["staticlib"]

[[example]]
name = "unicode-special-case"
required-features = ["unicode-generator"]

[features]
standalone = []
unicode-controls = []
unicode-generator = []

# Enables write16's SmallVec sink implementation used by the copied normalizer.
[package.metadata.cargo-machete]
ignored = ["write16"]
