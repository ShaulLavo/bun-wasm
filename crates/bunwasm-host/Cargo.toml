[package]
name = "bunwasm-host"
description = "bun-wasm: native launcher for bun.wasm on wasmtime, with the bun_wasm networking host ABI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bun-wasm"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
anyhow = "1"
notify = "=8.2.0"
libc = "0.2"
tokio = { version = "1", features = ["io-util", "rt-multi-thread"] }
brotli-decompressor = "5"
flate2 = "1"
zstd = { version = "=0.13.3", default-features = false, features = ["no_asm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false }
hyper = { version = "1", default-features = false, features = ["http1", "client"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
wasm-encoder = "=0.240.0"
wasmparser = "=0.240.0"
wasmtime = { version = "39.0.1", default-features = false, features = ["cranelift", "cache", "parallel-compilation", "runtime", "std", "demangle", "addr2line", "gc", "gc-drc", "threads"] }
wasmtime-wasi = { version = "39.0.1", default-features = false, features = ["p1"] }
