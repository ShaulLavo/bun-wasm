[package]
name = "bunwasm-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bun-compatible JS runtime for wasm32-wasip1 with a linked engine program"

[features]
default = ["engine-split"]
# The linked engine program supplies the VM; the core owns process and data services.
engine-split = ["dep:bunwasm-nested", "dep:wasmi", "dep:wasmparser"]
# The host's own JS engine (browser/Node): see docs/engine-browser.md.
engine-host = []

[dependencies]
bunwasm-nested = { path = "../bunwasm-nested", optional = true }
wasmparser = { version = "=0.228.0", optional = true }
serde = { version = "1", features = ["derive"] }
bunwasm-crypto-sys = { path = "../bunwasm-crypto-sys" }
bun_dotenv = { path = "../../vendor/bun/src/dotenv" }
bun_glob = { path = "../../vendor/bun/src/glob" }
bun_semver = { path = "../../vendor/bun/src/semver" }
bun_text_diff = { path = "../../vendor/bun/src/text_diff" }
bstr = { version = "1", default-features = false, features = ["alloc"] }
const_format = "0.2"
bunwasm-semver = { path = "../bunwasm-semver" }
bun_sys = { path = "../../vendor/bun/src/sys" }
bun_node_path = { path = "../../vendor/bun/src/node_path" }
bytemuck = "1"
bun_core = { path = "../../vendor/bun/src/bun_core" }
bun_paths = { path = "../../vendor/bun/src/paths" }
bun_wyhash = { path = "../../vendor/bun/src/wyhash" }
bun_zstd = { path = "../../vendor/bun/src/zstd" }
zstd-sys = { version = "=2.0.16", default-features = false, features = ["no_asm"] }
url = "2"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
md5 = { package = "md-5", version = "0.10" }
md4 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
ripemd = "0.1"
hmac = "0.12"
getrandom = "0.3"
icu_collator = "2.4.0"
icu_locale_core = "2.4.0"
icu_locale_fallback = "2.4.0"
icu_provider = "2.4.0"
encoding_rs = "0.8"
bun_brotli_sys = { path = "../../vendor/bun/src/brotli_sys" }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
libc = "0.2"
lol_html = { path = "../../vendor/bun/vendor/lolhtml" }
# Bun.password: Bun's own argon2 and bcrypt choices (docs/bun-patches/bun-password.md).
argon2 = { package = "rust-argon2", path = "../../vendor/bun/vendor/rust-argon2", default-features = false }
bcrypt = "=0.19.0"
base64 = "0.22"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64", "xxh3"] }

tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
wasmi = { version = "0.46.0", default-features = false, features = ["std"], optional = true }

aes = "0.8"
aes-kw = { version = "0.2", features = ["alloc"] }
ghash = "0.5"
subtle = "2"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ctr = "0.9"
pbkdf2 = "0.12"
hkdf = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
pkcs8 = { version = "0.10", features = ["alloc"] }
spki = { version = "0.7", features = ["alloc"] }


[dev-dependencies]
bunwasm-glue = { path = "../bunwasm-glue" }
bunwasm-posix = { path = "../bunwasm-posix" }
rquickjs = { version = "0.13", default-features = false, features = ["std", "loader", "array-buffer"] }

[build-dependencies]
cc = "1"
