[package]
name = "bunwasm-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bun-compatible JS runtime for wasm32-wasip1, on QuickJS-ng or JavaScriptCore behind an Engine trait"

[features]
default = ["engine-split"]
# The JS engine (exactly one): QuickJS-ng, or Bun's JavaScriptCore.
engine-split = []
engine-jsc = ["dep:bunwasm-jsc"]
# The host's own JS engine (browser/Node): see docs/engine-browser.md.
engine-host = []

[dependencies]
bunwasm-crypto-sys = { path = "../bunwasm-crypto-sys" }
bun_glob = { path = "../../vendor/bun/src/glob" }
bun_semver = { path = "../../vendor/bun/src/semver" }
bunwasm-semver = { path = "../bunwasm-semver" }
bun_sys = { path = "../../vendor/bun/src/sys" }
bun_node_path = { path = "../../vendor/bun/src/node_path" }
bytemuck = "1"
bun_core = { path = "../../vendor/bun/src/bun_core" }
bun_paths = { path = "../../vendor/bun/src/paths" }
bunwasm-jsc = { path = "../bunwasm-jsc", optional = true }
bun_wyhash = { path = "../../vendor/bun/src/wyhash" }
bun_zstd = { path = "../../vendor/bun/src/zstd" }
zstd-sys = { version = "=2.0.16", default-features = false, features = ["no_asm"] }
url = "2"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
md5 = { package = "md-5", version = "0.10" }
hmac = "0.12"
getrandom = "0.3"
encoding_rs = "0.8"
bun_brotli_sys = { path = "../../vendor/bun/src/brotli_sys" }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
libc = "0.2"
lol_html = { path = "../../vendor/bun/vendor/lolhtml" }

tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
wasmi = { version = "0.46.0", default-features = false, features = ["std"] }

aes = "0.8"
aes-kw = { version = "0.2", features = ["alloc"] }
ghash = "0.5"
subtle = "2"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ctr = "0.9"
pbkdf2 = "0.12"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "jwk"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh", "jwk"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
pkcs8 = { version = "0.10", features = ["alloc"] }
spki = { version = "0.7", features = ["alloc"] }
signature = "2"


[dev-dependencies]
bunwasm-glue = { path = "../bunwasm-glue" }
bunwasm-posix = { path = "../bunwasm-posix" }

[build-dependencies]
cc = "1"
