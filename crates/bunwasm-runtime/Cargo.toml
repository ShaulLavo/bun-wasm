[package]
name = "bunwasm-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bun-compatible JS runtime for wasm32-wasip1, on QuickJS-ng or JavaScriptCore behind an Engine trait"

[features]
default = ["engine-quickjs"]
# The JS engine (exactly one): QuickJS-ng, or Bun's JavaScriptCore.
engine-quickjs = ["dep:rquickjs"]
engine-jsc = ["dep:bunwasm-jsc"]
# The host's own JS engine (browser/Node): see docs/engine-browser.md.
engine-host = []

[dependencies]
bun_glob = { path = "../../vendor/bun/src/glob" }
bun_semver = { path = "../../vendor/bun/src/semver" }
bunwasm-semver = { path = "../bunwasm-semver" }
bun_sys = { path = "../../vendor/bun/src/sys" }
bunwasm-jsc = { path = "../bunwasm-jsc", optional = true }
rquickjs = { version = "0.13", default-features = false, features = ["std", "loader", "array-buffer"], optional = true }
bun_wyhash = { path = "../../vendor/bun/src/wyhash" }
url = "2"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
getrandom = "0.3"
miniz_oxide = "0.8"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }

tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
bunwasm-glue = { path = "../bunwasm-glue" }
bunwasm-posix = { path = "../bunwasm-posix" }
