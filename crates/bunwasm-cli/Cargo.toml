[package]
name = "bunwasm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `bun` binary for wasm32-wasip1"

[[bin]]
name = "bun"
path = "src/main.rs"

[features]
default = ["engine-split", "bun-transpiler", "bun-build"]
# The command core is engine-independent; QuickJS or JavaScriptCore is linked
# as the selected side program by its producer.
engine-split = ["bunwasm-runtime/engine-split"]
# The host's JS engine (bun-browser.wasm, scripts/build-bun-browser.sh).
engine-host = ["bunwasm-runtime/engine-host", "bun-transpiler"]
# Bun's real transpiler (crates/bunwasm-transpiler) for .ts/.tsx/.jsx/.toml.
# Without it only plain JavaScript runs.
bun-transpiler = ["dep:bunwasm-transpiler", "dep:bunwasm-glue"]
# `bun build`: Bun's bundler (crates/bunwasm-build).
bun-build = ["dep:bunwasm-build", "dep:bunwasm-glue"]

[dependencies]
bunwasm-runtime = { path = "../bunwasm-runtime", default-features = false }
bunwasm-transpiler = { path = "../bunwasm-transpiler", optional = true }
bunwasm-build = { path = "../bunwasm-build", optional = true }


[target.'cfg(target_os = "wasi")'.dependencies]
bunwasm-glue = { path = "../bunwasm-glue", optional = true }
