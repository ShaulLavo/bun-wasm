<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14151a" />
    <title>Bun in your browser · bun.wasm</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥟</text></svg>" />
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1><span class="logo" aria-hidden="true">🥟</span> bun<span class="dim">.wasm</span></h1>
        <span id="status" role="status" aria-live="polite"></span>
        <a class="nav" href="../" title="React sandbox with hot reload">Sandbox</a>
        <select id="engine" aria-label="JavaScript engine" title="JavaScript engine (reloads the page)">
          <option value="browser">Browser (native)</option>
          <option value="quickjs">QuickJS (9 MB)</option>
          <option value="jsc">JSC (43 MB)</option>
        </select>
        <button id="run" type="button" title="Save and run (Ctrl/Cmd-Enter)">▶ Run</button>
      </header>
      <main>
        <section class="pane editor-pane" aria-label="Editor">
          <div class="tabbar">
            <div id="tabs" role="tablist"></div>
            <select id="file-select" aria-label="File"></select>
            <button id="new-file" type="button" title="New file" aria-label="New file">+</button>
          </div>
          <div id="editor"></div>
        </section>
        <section class="pane terminal-pane" aria-label="Terminal">
          <div class="bar">
            <span>Terminal</span>
            <button id="copy-terminal" type="button" title="Copy terminal output, including scrollback" aria-live="polite">Copy</button>
          </div>
          <div id="terminal"></div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
