[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.0.15"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
opt-level = 1

[patch.crates-io]
# wasip1 gets the POSIX types and stubs the vendored Bun crates expect.
libc = { path = "third_party/libc" }
# QuickJS-ng with call-site columns that match JavaScriptCore (see the
# `bun-wasm:` comments in third_party/rquickjs-sys/quickjs/quickjs.c).
rquickjs-sys = { path = "third_party/rquickjs-sys" }
