name: Save grown release cache
description: Save only when downloads added assets to the restored inventory
runs:
  using: composite
  steps:
    - id: inventory
      shell: bash
      run: |
        fingerprint=$(find "$CI_RELEASE_CACHE" -type f -printf '%P %s\n' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
        if [[ "$fingerprint" != "$CI_RELEASE_CACHE_INITIAL" ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
    - uses: actions/cache/save@v4
      if: steps.inventory.outputs.changed == 'true'
      with:
        path: ${{ env.CI_RELEASE_CACHE }}
        key: ${{ env.CI_RELEASE_CACHE_KEY }}-${{ steps.inventory.outputs.fingerprint }}
