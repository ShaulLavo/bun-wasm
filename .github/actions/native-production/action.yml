name: Current source guest production
description: Build ordinary guests, launcher, shell, tools, and browser-guest site
inputs:
  full:
    description: Build native launcher and export full native artifacts
    required: true
  jsc:
    description: Selected JSC guest consumer
    required: true
  host-tools:
    description: Effective pinned host tools
    required: true
  native-inputs:
    description: Effective native toolchain and verified sysroot
    required: true
  jsc-inputs:
    description: Effective JSC prebuild inputs
    required: true
  object-key:
    description: Original compiler object writer key
    required: true
  cargo-matched:
    description: Original Cargo restore result
    required: true
runs:
  using: composite
  steps:
    - name: Preserve unchanged build-script input timestamps
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: bun scripts/quality-input-times.ts
    - uses: actions/cache/restore@v4
      if: inputs.jsc == 'true'
      id: jsc-cargo-cache
      with:
        path: ${{ runner.temp }}/jsc/engine
        key: jsc-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.host-tools }}-${{ inputs.native-inputs }}-${{ inputs.jsc-inputs }}-${{ hashFiles('.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'scripts/sync-*.sh', 'scripts/check-cmake-cache.cmake', 'scripts/src/engine-init.c', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cpp', '!crates/bunwasm-cli/build.rs', '!crates/bunwasm-cli/entry-split.c', '!third_party/rquickjs-sys/quickjs/quickjs.c') }}-${{ hashFiles('scripts/build-bun-jsc.sh', 'scripts/build-engine-jsc.sh', 'scripts/build-bun-core.sh', 'scripts/build-engine-quickjs.sh', 'scripts/build.sh', 'scripts/quickjs-core-exports.txt', 'scripts/src/engine-explicit-init.ts', 'scripts/src/engine-init.c', 'scripts/guest-core-receipt.ts', 'scripts/guest-engine-receipt.ts', 'scripts/guest-build-receipt.ts', 'scripts/jsc-embedding.ts', 'tests/linker/**', 'Cargo.*', 'crates/**', 'third_party/rquickjs-sys/quickjs/quickjs.c', 'env.sh', 'scripts/quality*.ts', '.github/actions/native-*/action.yml') }}
        restore-keys: |
          jsc-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.host-tools }}-${{ inputs.native-inputs }}-${{ inputs.jsc-inputs }}-${{ hashFiles('.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'scripts/sync-*.sh', 'scripts/check-cmake-cache.cmake', 'scripts/src/engine-init.c', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cpp', '!crates/bunwasm-cli/build.rs', '!crates/bunwasm-cli/entry-split.c', '!third_party/rquickjs-sys/quickjs/quickjs.c') }}-
    - name: Identify the shell's WASI link inputs
      id: shell-wasi-inputs
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        clang=("$WASI_SDK_PATH/bin/clang" --target=wasm32-wasip1 "--sysroot=$BUN_WASM_SYSROOT")
        linker=$("${clang[@]}" --print-prog-name=wasm-ld)
        builtins=$("${clang[@]}" --print-libgcc-file-name)
        inputs=$({
          sha256sum "$linker" "$builtins" "$WASI_SDK_PATH/bin/clang.cfg" || exit 1
          cd "$BUN_WASM_SYSROOT" || exit 1
          find -L include lib/wasm32-wasip1 -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum --
        } | sha256sum | cut -d' ' -f1)
        echo "hash=$inputs" >> "$GITHUB_OUTPUT"
    - name: Restore the bash-web shell guest build
      uses: actions/cache/restore@v4
      id: shell-cache
      with:
        path: ${{ runner.temp }}/bash-web-shell-build
        # Cargo does not see the verified sysroot or C toolchain. The Waffle env
        # guest is staged from the current dependencies and is outside this cache.
        key: bash-web-shell-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.host-tools }}-${{ inputs.native-inputs }}-${{ steps.shell-wasi-inputs.outputs.hash }}-${{ hashFiles('scripts/build-bash-web-shell.sh', '.cargo/**', 'rust-toolchain.toml', 'third_party/**', 'env.sh', 'scripts/build-wasi-sysroot.ts') }}
    - name: Install the Web host dependencies
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --cwd web --frozen-lockfile
    - name: Install ordinary SpiderMonkey producer tools
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        sudo bash "$GITHUB_WORKSPACE/.github/scripts/apt-main-archive.sh"
        sudo apt-get update
        sudo apt-get install -y llvm autoconf2.13 python3-dev python3-venv python3-packaging python3-setuptools libffi-dev zlib1g-dev
    - uses: actions/cache/restore@v4
      id: ordinary-cbindgen-cache
      with:
        path: ${{ env.CARGO_HOME }}/bin/cbindgen
        key: cbindgen-0.29.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
    - name: Prepare ordinary pinned cbindgen
      env:
        CBINDGEN_CACHE_HIT: ${{ steps.ordinary-cbindgen-cache.outputs.cache-hit }}
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        if [[ "$CBINDGEN_CACHE_HIT" != true ]]; then
          CARGO_TARGET_DIR="$RUNNER_TEMP/ordinary-cbindgen-target" cargo install --locked --version 0.29.4 cbindgen
        fi
        "$CARGO_HOME/bin/cbindgen" --version | grep -Fx 'cbindgen 0.29.4'
    - name: Identify ordinary SpiderMonkey native generation
      id: ordinary-spidermonkey-inputs
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        echo "SPIDERMONKEY_BUILD_DIR=$RUNNER_TEMP/spidermonkey/ordinary" >> "$GITHUB_ENV"
        echo "SPIDERMONKEY_NATIVE_DIR=$RUNNER_TEMP/spidermonkey/ordinary-native" >> "$GITHUB_ENV"
        echo "SPIDERMONKEY_ENGINE_BUILD_DIR=$RUNNER_TEMP/ordinary-side" >> "$GITHUB_ENV"
        echo "SPIDERMONKEY_PAIR_DIR=$RUNNER_TEMP/ordinary-pair" >> "$GITHUB_ENV"
        echo "SPIDERMONKEY_WASM=$RUNNER_TEMP/ordinary-pair/bun-spidermonkey.wasm" >> "$GITHUB_ENV"
        echo "hash=$(bun scripts/spidermonkey-ordinary-ci.ts identity)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      id: ordinary-spidermonkey-cache
      with:
        path: ${{ runner.temp }}/spidermonkey/ordinary
        key: spidermonkey-ordinary-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ordinary-spidermonkey-inputs.outputs.hash }}
    - name: Build or verify the ordinary SpiderMonkey library
      id: ordinary-spidermonkey-native
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        bun scripts/spidermonkey-ordinary-ci.ts native
        echo "ordinary SpiderMonkey exact cache hit=${{ steps.ordinary-spidermonkey-cache.outputs.cache-hit }}; matched=${{ steps.ordinary-spidermonkey-cache.outputs.cache-matched-key }}"
    - uses: actions/cache/restore@v4
      id: ordinary-spidermonkey-cargo
      with:
        # Only Cargo objects persist. Completed side/pair outputs must be fresh.
        path: ${{ runner.temp }}/ordinary-side-cargo
        key: spidermonkey-ordinary-side-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ordinary-spidermonkey-native.outputs.generation }}-${{ hashFiles('Cargo.*', '.cargo/**', 'rust-toolchain.toml', 'crates/**', 'scripts/build-engine-spidermonkey.sh', 'scripts/build-bun-spidermonkey.sh', 'scripts/spidermonkey-side-*.ts', 'scripts/src/engine-init.c') }}
        restore-keys: |
          spidermonkey-ordinary-side-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ordinary-spidermonkey-native.outputs.generation }}-
    - name: Build the common engine core once
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        export BUN_CORE_BUILD_DIR="$CARGO_TARGET_DIR/split-common"
        CARGO_BUILD_JOBS=4 bash scripts/build-bun-core.sh
    # Each side reuses the completed common core and owns its target and outputs.
    # JSC builds at low priority beside QuickJS and host-engine work.
    - name: Start the JSC Cargo guest build
      id: jsc-guest-start
      if: inputs.jsc == 'true'
      env:
        JOBS: "2"
        CAGE: ""
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        bun scripts/ci-jsc-worker.ts start "$RUNNER_TEMP/jsc-guest" 3600 nice -n 19 bash scripts/with-build-cache.sh bash -c 'start=$SECONDS; source env.sh && export BUN_CORE_BUILD_DIR="$CARGO_TARGET_DIR/split-common" && bash scripts/build-bun-jsc.sh; status=$?; echo "JSC guest build took $((SECONDS - start))s"; exit "$status"'
    - name: Build native fixtures after the cache checkpoint
      env:
        JOBS: "3"
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        export WASI_SDK="$WASI_SDK_PATH"
        if [[ "${{ inputs.full }}" == true ]]; then cargo build --release --locked -j 3 -p bunwasm-host; fi
        trap 'exit 130' INT
        trap 'exit 143' TERM
        export BUN_CORE_BUILD_DIR="$CARGO_TARGET_DIR/split-common"
        CARGO_BUILD_JOBS=3 bash scripts/build.sh
    - name: Build the ordinary SpiderMonkey side using the completed core
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        export BUN_CORE_BUILD_DIR="$CARGO_TARGET_DIR/split-common"
        export SPIDERMONKEY_CARGO_TARGET_DIR="$RUNNER_TEMP/ordinary-side-cargo/${{ steps.ordinary-spidermonkey-native.outputs.generation }}"
        CARGO_BUILD_JOBS=3 bash scripts/build-bun-spidermonkey.sh
        if llvm-nm "$SPIDERMONKEY_CARGO_TARGET_DIR/wasm32-wasip1/release/build/bunwasm-spidermonkey/"*/out/libspidermonkey_shim.a | grep -q 'bsm_control_'; then
          echo 'Production SpiderMonkey adapter contains control symbols' >&2
          exit 1
        fi
    - name: Package the native profile launcher
      if: inputs.full == 'true'
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        mkdir -p "$RUNNER_TEMP/native-profile-launcher"
        cp "$CARGO_TARGET_DIR/release/bun-wasm" "$RUNNER_TEMP/native-profile-launcher/bun-wasm"
        git rev-parse HEAD > "$RUNNER_TEMP/native-profile-launcher/source.txt"
    - name: Build the standard Browser guest once
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        BROWSER_CARGO_TARGET_DIR="$CARGO_TARGET_DIR" JOBS=3 bash scripts/build-bun-browser.sh
    - name: Build pinned shell guests
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        export WASI_SDK="$WASI_SDK_PATH"
        guest_environment=$(bun scripts/guest-build-receipt.ts environment)
        eval "$guest_environment"
        CARGO_TARGET_DIR="$RUNNER_TEMP/bash-web-shell-build" JOBS=2 bash scripts/build-bash-web-shell.sh
    - name: Build the JSC Cargo guest
      if: inputs.jsc == 'true'
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        bun scripts/ci-jsc-worker.ts wait "$RUNNER_TEMP/jsc-guest"
    - name: Stop the JSC Cargo guest build
      if: ${{ always() && contains(fromJSON('["success", "failure", "cancelled"]'), steps.jsc-guest-start.outcome) }}
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        bun scripts/ci-jsc-worker.ts stop "$RUNNER_TEMP/jsc-guest"
    - name: Save the JSC Cargo cache once per input revision
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.jsc == 'true' && steps.jsc-cargo-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/jsc/engine
        key: jsc-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.host-tools }}-${{ inputs.native-inputs }}-${{ inputs.jsc-inputs }}-${{ hashFiles('.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'scripts/sync-*.sh', 'scripts/check-cmake-cache.cmake', 'scripts/src/engine-init.c', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cpp', '!crates/bunwasm-cli/build.rs', '!crates/bunwasm-cli/entry-split.c', '!third_party/rquickjs-sys/quickjs/quickjs.c') }}-${{ hashFiles('scripts/build-bun-jsc.sh', 'scripts/build-engine-jsc.sh', 'scripts/build-bun-core.sh', 'scripts/build-engine-quickjs.sh', 'scripts/build.sh', 'scripts/quickjs-core-exports.txt', 'scripts/src/engine-explicit-init.ts', 'scripts/src/engine-init.c', 'scripts/guest-core-receipt.ts', 'scripts/guest-engine-receipt.ts', 'scripts/guest-build-receipt.ts', 'scripts/jsc-embedding.ts', 'tests/linker/**', 'Cargo.*', 'crates/**', 'third_party/rquickjs-sys/quickjs/quickjs.c', 'env.sh', 'scripts/quality*.ts', '.github/actions/native-*/action.yml') }}
    - name: Verify JSC embedding source and native backing
      if: inputs.full == 'true' && inputs.jsc == 'true'
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: bun scripts/jsc-embedding.ts verify dist/bun-jsc.wasm
    - name: Export the validated ordinary JSC pair
      if: inputs.full == 'true' && inputs.jsc == 'true'
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        bun scripts/ci-ordinary-jsc-program.ts export "$RUNNER_TEMP/ordinary-jsc-program"
    - name: Export the live-gated ordinary SpiderMonkey pair
      if: inputs.full == 'true'
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        bun scripts/spidermonkey-ordinary-ci.ts export "$RUNNER_TEMP/ordinary-spidermonkey-program"
    - name: Build the single tools fixture in the existing native target
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        TOOLS_CARGO_TARGET_DIR="$CARGO_TARGET_DIR" JOBS=4 bash scripts/build-bun-tools.sh
    - name: Package ordinary shell and SpiderMonkey native inputs
      if: inputs.full == 'true'
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        stage="$RUNNER_TEMP/ordinary-native-bundle-stage"
        mkdir -p "$stage/dist" "$stage/spidermonkey-native" "$stage/ordinary-side" "$stage/spidermonkey-panic"
        cp dist/bash-web-shell.wasm dist/bash-web-env.wasm dist/bash-web-guests.json "$stage/dist/"
        cp -a "$SPIDERMONKEY_NATIVE_DIR"/. "$stage/spidermonkey-native/"
        cp "$SPIDERMONKEY_ENGINE_BUILD_DIR/engine.wasm" "$SPIDERMONKEY_ENGINE_BUILD_DIR/engine-init.o" "$SPIDERMONKEY_ENGINE_BUILD_DIR/engine-link.map" "$stage/ordinary-side/"
        sm_rel="ordinary-side-cargo/${{ steps.ordinary-spidermonkey-native.outputs.generation }}/wasm32-wasip1/release"
        sm_release="$RUNNER_TEMP/$sm_rel"
        printf '%s\n' "$sm_rel" > "$stage/spidermonkey-panic/relpath.txt"
        cp "$sm_release/libbunwasm_engine_spidermonkey.a" "$stage/spidermonkey-panic/libbunwasm_engine_spidermonkey.a"
        (cd "$sm_release" && find build -type f \( -name '*.rmeta' -o -name '*.rlib' \) -print0 | tar --posix --null -T - -cf - | tar --posix -C "$stage/spidermonkey-panic" -xf -)
        find "$stage/spidermonkey-panic/build" -type f -name 'libstd-*.rmeta' | grep -q .
        git rev-parse HEAD > "$stage/source.txt"
        mkdir -p "$RUNNER_TEMP/ordinary-native-bundle"
        tar --posix -C "$stage" -cf - . | zstd -T0 -q -o "$RUNNER_TEMP/ordinary-native-bundle/bundle.tar.zst"
        rm -rf -- "$stage"
    - name: Blocking Web guest cases (QuickJS and host engine)
      if: inputs.full != 'true'
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        bun scripts/test-web-guests.ts quickjs browser 2>&1 | tee dist/web-guests-quickjs-browser.log
    # The playground site the browser-guest checks serve, bundled once from the verified guest
    # (and the bash-web shell) linked above.
    - name: Build the browser-guest site once
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        bun scripts/ci-install.ts --cwd sandbox --frozen-lockfile --ignore-scripts
        bun scripts/browser-guest-site.ts build "$RUNNER_TEMP/browser-guest-site"
        bun scripts/browser-guest-coverage.ts "$RUNNER_TEMP/browser-guest-site" "$BUN_WASM_BROWSER_COVERAGE_SELECTION"
    - name: Blocking Web guest case (JSC)
      if: inputs.full != 'true' && inputs.jsc == 'true'
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        bun scripts/test-web-guests.ts jsc 2>&1 | tee dist/web-guests-jsc.log
    - name: Export the validated standard Browser and tools guests
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: |
        source env.sh
        bun scripts/ci-browser-program.ts export "$RUNNER_TEMP/browser-program"
    - name: Save verified ordinary SpiderMonkey native generation
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ordinary-spidermonkey-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/spidermonkey/ordinary
        key: ${{ steps.ordinary-spidermonkey-cache.outputs.cache-primary-key }}
    - name: Save ordinary SpiderMonkey side Cargo objects
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ordinary-spidermonkey-cargo.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/ordinary-side-cargo
        key: ${{ steps.ordinary-spidermonkey-cargo.outputs.cache-primary-key }}
    - name: Save ordinary pinned cbindgen
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ordinary-cbindgen-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CARGO_HOME }}/bin/cbindgen
        key: ${{ steps.ordinary-cbindgen-cache.outputs.cache-primary-key }}
    - name: Remove ordinary cbindgen build scratch
      if: always()
      shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
      run: rm -rf -- "$RUNNER_TEMP/ordinary-cbindgen-target"
    - name: Save the completed bash-web shell guest build
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shell-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/bash-web-shell-build
        key: ${{ steps.shell-cache.outputs.cache-primary-key }}
    # PR-scoped archives cannot be shared with other PRs and evict main's warm builds.
    - name: Save the refined native Cargo cache once per input revision
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.cargo-matched == ''
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ env.CARGO_HOME }}/registry
          ${{ env.CARGO_HOME }}/git
          ${{ env.CARGO_HOME }}/bin/cargo-machete
          ${{ env.CARGO_TARGET_DIR }}
        key: native-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.host-tools }}-${{ inputs.native-inputs }}-${{ hashFiles('.cargo/**', 'rust-toolchain.toml', 'patches/bun/**', 'third_party/**', 'scripts/sync-*.sh', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cc', 'crates/**/*.cpp', 'crates/**/*.hpp', '!crates/bunwasm-cli/build.rs', '!crates/bunwasm-cli/entry-split.c', '!third_party/rquickjs-sys/quickjs/quickjs.c') }}-${{ hashFiles('Cargo.*', 'crates/**', 'third_party/rquickjs-sys/quickjs/quickjs.c', 'tests/fixtures/runtime-proc-spawn-requests.json', 'scripts/quality*.ts', 'scripts/tls-probe*.ts', 'checks/native-probe-*.json', 'tests/native/tls-probe.cpp', 'scripts/build-bun-tools.sh', 'scripts/build-bun-browser.sh', 'scripts/build-bun-core.sh', 'scripts/src/program-profile.ts', 'scripts/guest-core-receipt.ts', 'scripts/guest-source-manifest.ts', 'scripts/waffle-release-inputs.*', '.github/workflows/ci.yml', '.github/actions/native-*/action.yml', 'env.sh', 'scripts/build-wasi-sysroot.ts') }}
    - uses: ./.github/actions/save-rust-build-cache
      with:
        key: ${{ inputs.object-key }}
    - uses: ./.github/actions/save-release-downloads
