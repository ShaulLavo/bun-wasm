name: Release download cache
description: Cache public release bytes by their complete original URL
runs:
  using: composite
  steps:
    - shell: bash
      run: echo "CI_RELEASE_CACHE=$RUNNER_TEMP/github-release-assets" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/github-release-assets
        key: release-assets-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/bun.lock', 'scripts/waffle-release-inputs.json', 'scripts/ci-*.ts', '.github/workflows/ci.yml', '.github/actions/rust-build-cache/action.yml') }}
        restore-keys: |
          release-assets-v1-${{ runner.os }}-${{ runner.arch }}-
