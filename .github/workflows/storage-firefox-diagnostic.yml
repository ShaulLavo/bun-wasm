name: Firefox storage diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      STORAGE_SUBJECT: ${{ github.workspace }}/subject
    steps:
      - name: Create failure directory before prerequisites
        run: |
          report="$RUNNER_TEMP/storage-firefox-report"
          mkdir -p "$report"
          ps -eo pid,ppid,pgid,args > "$report/processes-before.txt"
          df -h > "$report/disk-before.txt"
          echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/storage-firefox-bun-cache" >> "$GITHUB_ENV"
          echo "BUN_WASM_BROWSER_REPORT_DIR=$report" >> "$GITHUB_ENV"
          echo "BUN_WASM_BROWSER_SITE=$RUNNER_TEMP/storage-firefox-site" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/storage-firefox-browsers" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 5b7283918362394bf3dfec746261b9fb5b060caf
          path: subject
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
      - name: Install root, web, and exact subject dependencies
        run: |
          bun scripts/ci-install.ts --frozen-lockfile --linker=isolated --ignore-scripts
          bun scripts/ci-install.ts --cwd web --frozen-lockfile --linker=isolated --ignore-scripts
          bun scripts/ci-install.ts --cwd subject --frozen-lockfile --linker=isolated --ignore-scripts
          bun scripts/ci-install.ts --cwd subject/web --frozen-lockfile --linker=isolated --ignore-scripts
      - uses: ./.github/actions/browser-deps
        with:
          browsers: firefox
      - name: Install Firefox
        working-directory: web
        run: bunx playwright install firefox
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43530616509
          name: browser-guest-site
          path: ${{ runner.temp }}/storage-firefox-site
      - name: Qualify observation and run unchanged preservation once
        env:
          DIAGNOSTIC_HEAD: ${{ github.sha }}
          TMPDIR: ${{ runner.temp }}
          BUN_WASM_TEST_TMP: ${{ runner.temp }}
        run: |
          diagnostic_group=0
          trap 'if [ "$diagnostic_group" -gt 0 ]; then kill -- -"$diagnostic_group" 2>/dev/null || true; fi' EXIT
          source env.sh
          setsid timeout --signal=TERM --kill-after=20s 900 bun scripts/diagnostics/storage-firefox.ts > "$BUN_WASM_BROWSER_REPORT_DIR/run.log" 2>&1 &
          diagnostic_group=$!
          wait "$diagnostic_group"
      - name: Clean task-created setup and execution files
        if: always()
        run: |
          cleanup_failed=0
          while read -r helper; do
            [[ -n "$helper" ]] || continue
            [[ "$(readlink "/proc/$helper/cwd" 2>/dev/null || true)" == "$GITHUB_WORKSPACE/web" ]] || continue
            if awk -v pid="$helper" '$1 == pid { found = 1 } END { exit !found }' "$BUN_WASM_BROWSER_REPORT_DIR/processes-before.txt"; then continue; fi
            timeout 60 tail --pid="$helper" -f /dev/null || cleanup_failed=1
          done < <(pgrep -f '^bun scripts/ci-browser-deps.ts firefox$' || true)
          rm -rf -- "$BUN_WASM_BROWSER_SITE" "$RUNNER_TEMP/storage-firefox-bun-cache" "$PLAYWRIGHT_BROWSERS_PATH" "$GITHUB_WORKSPACE/subject" "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/web/node_modules"
          ps -eo pid,ppid,pgid,args > "$BUN_WASM_BROWSER_REPORT_DIR/processes-after.txt"
          exit "$cleanup_failed"
      - name: Retain diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-firefox-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-firefox-report
          retention-days: 7
          if-no-files-found: error
