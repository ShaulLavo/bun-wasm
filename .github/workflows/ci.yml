          NATIVE_HOST_TOOLS_HASH: ${{ steps.host-tools.outputs.hash }}
          NATIVE_INPUTS_HASH: ${{ steps.native-inputs.outputs.hash }}
        run: |
          source env.sh
          bun scripts/tls-probe-ci.ts link
      - name: Preserve TLS link failure diagnostics
        if: ${{ failure() && steps.tls-artifact.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: tls-link-failure-${{ github.run_attempt }}
          path: |
            target/tls-probe/prepared.json
            target/tls-probe/cargo/*.json
            target/tls-probe/output/*.json
            target/tls-probe/output/*.jsonl
            target/tls-probe/output/*.map
            target/tls-probe/output/*.wasm
            target/tls-probe/output/tls-probe-native
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Save the native quality checkpoint
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native-producers.outputs.native-ready == 'true' && steps.tls-artifact.outputs.tls-sha256 != '' && steps.native-cargo-cache.outputs.cache-matched-key == '' && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/bin/cargo-machete
            ${{ env.CARGO_TARGET_DIR }}
          key: native-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-tools.outputs.hash }}-${{ steps.native-inputs.outputs.hash }}-${{ hashFiles('Cargo.*', '.cargo/**', 'rust-toolchain.toml', 'patches/bun/**', 'third_party/**', 'env.sh', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'scripts/check-wasi-cmake-cache.sh', 'scripts/ci-binaryen.ts') }}-${{ hashFiles('crates/**', 'tests/fixtures/runtime-proc-spawn-requests.json', 'scripts/quality*.ts', 'scripts/tls-probe*.ts', 'checks/native-probe-*.json', 'tests/native/tls-probe.cpp') }}-${{ hashFiles('scripts/build-bun-tools.sh', 'scripts/build-bun-browser.sh', 'scripts/src/program-profile.ts', '.github/workflows/ci.yml', 'scripts/build-wasi-sysroot.ts') }}
      - name: Package the verified native quality checkpoint
        id: native-artifact
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        env:
          NATIVE_QUALITY_PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          NATIVE_HOST_TOOLS_HASH: ${{ steps.host-tools.outputs.hash }}
          NATIVE_INPUTS_HASH: ${{ steps.native-inputs.outputs.hash }}
          JSC_PREBUILD_MANIFEST_SHA256: ${{ needs.jsc-prebuild.outputs.manifest-sha256 }}
        run: |
          source env.sh
          native_sysroot_sha256=$(sha256sum "$BUN_WASM_SYSROOT/bun-wasm-sysroot.json" | cut -d' ' -f1)
          export NATIVE_SYSROOT_SHA256="$native_sysroot_sha256"
          bun scripts/ci-native-handoff.ts pack "$RUNNER_TEMP/native-quality-artifact"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: native-quality-${{ steps.native-artifact.outputs.producer-attempt }}
          path: ${{ runner.temp }}/native-quality-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: ./.github/actions/save-rust-build-cache
        with:
          key: ${{ steps.rust-objects.outputs.cache-primary-key }}
      - uses: ./.github/actions/save-release-downloads

  rust:
    name: Rust workspace tests (QuickJS host)
    needs: [quality, jsc-prebuild, native-quality]
    # Not skipped when the prebuild job fails or is skipped: the guard step fails instead.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && needs.quality.result == 'success' && needs.quality.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      QUALITY_RUST_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      GIT_AUTHOR_NAME: bun-wasm CI
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_NAME: bun-wasm CI
      GIT_COMMITTER_EMAIL: ci@localhost
    steps:
      - name: Require the JSC prebuild job's output
        env:
          JSC_PREBUILD_RESULT: ${{ needs.jsc-prebuild.result }}
          NATIVE_QUALITY_RESULT: ${{ needs.native-quality.result }}
        run: |
          if [[ "$JSC_PREBUILD_RESULT" != success || "$NATIVE_QUALITY_RESULT" != success ]]; then
            echo "error: native checks require successful JSC and native quality producers." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Configure portable quality toolchain homes
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "WASM_TOOLS=$RUNNER_TEMP/wasm-tools" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: ./.github/actions/rust-build-cache
        id: rust-objects
      - uses: actions/cache/restore@v4
        id: rustup-cache
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: rust-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      # Install everything rust-toolchain.toml lists, so the saved toolchain is complete.
      # Otherwise rustup re-downloads rust-src on first use, and its new timestamps
      # rebuild std for the QuickJS engine's -Zbuild-std target every run.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, rustfmt, clippy
          targets: wasm32-wasip1, wasm32-wasip1-threads, wasm32-unknown-unknown
      - name: Save completed rustup-cache setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rustup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: ${{ steps.rustup-cache.outputs.cache-primary-key }}
      - name: Install native build tools
        run: |
          if command -v cmake && command -v ninja && command -v nasm && command -v clang && command -v pkg-config &&
             command -v ruby && command -v gperf && command -v bison &&
             ldconfig -p | grep -E 'libclang(-[0-9]+)?\.so' > /dev/null; then exit 0; fi
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt; fi
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then test -s /etc/apt/apt-mirrors.txt; fi
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm clang libclang-dev pkg-config ruby gperf bison
      # The JSC stamp and sysroot receipt fingerprint CMake and Ninja, and jobs of one run can
      # land on different runner images. Every producer and consumer uses the same pinned bytes.
      - uses: actions/cache/restore@v4
        id: build-tools-cache
        with:
          path: |
            ${{ env.WASM_TOOLS }}/cmake-4.4.5-linux-x86_64.tar.gz
            ${{ env.WASM_TOOLS }}/ninja-1.13.2-linux.zip
          key: build-tools-cmake-4.4.5-ninja-1.13.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-build-tools.ts') }}
      - name: Install pinned CMake and Ninja
        run: bun scripts/ci-build-tools.ts
      - name: Save completed build-tools-cache setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WASM_TOOLS }}/cmake-4.4.5-linux-x86_64.tar.gz
            ${{ env.WASM_TOOLS }}/ninja-1.13.2-linux.zip
          key: ${{ steps.build-tools-cache.outputs.cache-primary-key }}
      # Image updates change many unrelated packages. Build caches follow the host
      # tools these builds run; each layer's own input hash covers its toolchain.
      - name: Identify host build tools
        id: host-tools
        run: |
          report="$RUNNER_TEMP/host-tools.txt"
          {
            for tool in cc c++ clang cmake ninja make nasm pkg-config ruby perl python3 gperf bison; do
              command -v "$tool"
              "$tool" --version | sed -n '1,2p'
            done
            ldd --version | sed -n '1p'
            ldconfig -p | grep -E 'libclang(-[0-9]+)?\.so' | sort
          } > "$report"
          cat "$report"
          echo "hash=$(sha256sum "$report" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: sdk
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: wasi-sdk-34.0-stock-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned WASI SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/wasi-sdk-34.tar.gz"
          trap 'rm -f "$archive"' EXIT
          bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz "$archive"
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $archive" | sha256sum --check
          mkdir -p "$WASM_TOOLS/wasi-sdk"
          tar -xzf "$archive" --strip-components=1 -C "$WASM_TOOLS/wasi-sdk"
      - name: Save completed sdk setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: ${{ steps.sdk.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: binaryen-cache
        with:
          path: ${{ env.WASM_TOOLS }}/binaryen-version_133-x86_64-linux.tar.gz
          key: binaryen-133-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-binaryen.ts') }}
      - name: Install pinned Binaryen
        run: bun scripts/ci-binaryen.ts
      - name: Save completed binaryen-cache setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.binaryen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/binaryen-version_133-x86_64-linux.tar.gz
          key: ${{ steps.binaryen-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: wasm-tools-cache
        with:
          path: ${{ env.WASM_TOOLS }}/wasm-tools-1.262.0-x86_64-linux.tar.gz
          key: wasm-tools-1.262.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned wasm-tools
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p "$WASM_TOOLS"
          archive="$WASM_TOOLS/wasm-tools-1.262.0-x86_64-linux.tar.gz"
          stage=$(mktemp -d "$WASM_TOOLS/.wasm-tools-XXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          input="$archive"
          if [[ ! -f "$input" ]]; then
            input="$stage/archive.tar.gz"
            bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
              https://github.com/bytecodealliance/wasm-tools/releases/download/v1.262.0/wasm-tools-1.262.0-x86_64-linux.tar.gz "$input"
          fi
          echo "655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65  $input" | sha256sum --check
          if [[ "$input" != "$archive" ]]; then mv "$input" "$archive"; fi
          tar -xzf "$archive" --strip-components=1 -C "$stage"
          test "$("$stage/wasm-tools" --version)" = "wasm-tools 1.262.0 (e22db44da 2026-10-13)"
          mkdir -p "$WASM_TOOLS/wasm-tools-bin"
          mv "$stage/wasm-tools" "$WASM_TOOLS/wasm-tools-bin/wasm-tools"
          echo "$WASM_TOOLS/wasm-tools-bin" >> "$GITHUB_PATH"
      - name: Save completed wasm-tools setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.wasm-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/wasm-tools-1.262.0-x86_64-linux.tar.gz
          key: ${{ steps.wasm-tools-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: wasmtime-cache
        with:
          path: ${{ env.WASM_TOOLS }}/wasmtime-v49.0.3-x86_64-linux.tar.xz
          key: wasmtime-49.0.3-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Wasmtime
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p "$WASM_TOOLS"
          archive="$WASM_TOOLS/wasmtime-v49.0.3-x86_64-linux.tar.xz"
          stage=$(mktemp -d "$WASM_TOOLS/.wasmtime-XXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          input="$archive"
          if [[ ! -f "$input" ]]; then
            input="$stage/archive.tar.xz"
            bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
              https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.3/wasmtime-v49.0.3-x86_64-linux.tar.xz "$input"
          fi
          echo "4001225413f208345b980525f31c4080e1873808b38d0ddc7918497340667fbb  $input" | sha256sum --check
          if [[ "$input" != "$archive" ]]; then mv "$input" "$archive"; fi
          tar -xJf "$archive" --strip-components=1 -C "$stage"
          test "$("$stage/wasmtime" --version)" = "wasmtime 49.0.3 (f96eabaa1 2026-10-14)"
          "$stage/wasmtime" run --help > "$stage/run-help"
          grep -q -- '--dir' "$stage/run-help"
          mkdir -p "$WASM_TOOLS/wasmtime"
          mv "$stage/wasmtime" "$WASM_TOOLS/wasmtime/wasmtime"
          echo "$WASM_TOOLS/wasmtime" >> "$GITHUB_PATH"
      - name: Save completed wasmtime-cache setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.wasmtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/wasmtime-v49.0.3-x86_64-linux.tar.xz
          key: ${{ steps.wasmtime-cache.outputs.cache-primary-key }}
      - name: Check transpiler example command prerequisites
        run: bash scripts/test-transpiler-example.sh --check-tools
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --ignore-scripts
      - name: Configure private JSC build paths
        run: |
          echo "JSC_BUILD_DIR=$RUNNER_TEMP/jsc/prebuild" >> "$GITHUB_ENV"
          echo "JSC_ENGINE_BUILD_DIR=$RUNNER_TEMP/jsc/engine" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: jsc-prebuild.tar
          path: ${{ runner.temp }}/jsc-prebuild-transfer
      - name: Import the verified JSC prebuild and sysroot
        env:
          JOBS: "2"
          CAGE: ""
          JSC_PREBUILD_MANIFEST_SHA256: ${{ needs.jsc-prebuild.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          source env.sh
          # Members stream from the downloaded transfer straight into the final trees; no second unpacked copy.
          transfer="$RUNNER_TEMP/jsc-prebuild-transfer/jsc-prebuild.tar"
          manifest="$RUNNER_TEMP/jsc-prebuild-manifest"
          # Only the manifest this run's prebuild job reported, for this commit and these paths.
          [[ "$JSC_PREBUILD_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(tar --posix -tf "$transfer")" == $'prebuild.tar.zst\nsysroot.tar.zst\njsc-prebuild.log\nmanifest' ]]
          [[ ! -e "$manifest" ]]
          tar --posix -xOf "$transfer" manifest > "$manifest"
          echo "$JSC_PREBUILD_MANIFEST_SHA256  $manifest" | sha256sum --check --strict
          expected=$(printf 'run=%s\nsha=%s\njsc-build-dir=%s\nsysroot=%s' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$JSC_BUILD_DIR" "$BUN_WASM_SYSROOT")
          [[ "$(head -n 4 "$manifest")" == "$expected" ]]
          [[ "$(tail -n +5 "$manifest" | cut -d' ' -f3)" == $'prebuild.tar.zst\nsysroot.tar.zst' ]]
          prebuild_digest=$(tail -n +5 "$manifest" | awk '$2 == "prebuild.tar.zst" { print $1 }')
          sysroot_digest=$(tail -n +5 "$manifest" | awk '$2 == "sysroot.tar.zst" { print $1 }')
          [[ "$(tar --posix -xOf "$transfer" prebuild.tar.zst | sha256sum | cut -d' ' -f1)" == "$prebuild_digest" ]]
          [[ "$(tar --posix -xOf "$transfer" sysroot.tar.zst | sha256sum | cut -d' ' -f1)" == "$sysroot_digest" ]]
          # Never overlay another tree.
          [[ ! -e "$JSC_BUILD_DIR" && ! -e "$BUN_WASM_SYSROOT" ]]
          mkdir -p "$(dirname "$JSC_BUILD_DIR")" "$(dirname "$BUN_WASM_SYSROOT")"
          tar --posix -xOf "$transfer" prebuild.tar.zst | zstd -dc | tar -C "$(dirname "$JSC_BUILD_DIR")" -xf -
          tar --posix -xOf "$transfer" sysroot.tar.zst | zstd -dc | tar -C "$(dirname "$BUN_WASM_SYSROOT")" -xf -
          tar --posix -xOf "$transfer" jsc-prebuild.log > "$RUNNER_TEMP/jsc-prebuild.log"
          rm -r -- "$manifest" "$RUNNER_TEMP/jsc-prebuild-transfer"
          source jsc/common.sh
          check_jsc_inputs_stamp
      - name: Build patched WASI sysroot
        run: |
          source env.sh
          time bun scripts/build-wasi-sysroot.ts
      - name: Identify effective native build environment
        id: native-inputs
        run: |
          source env.sh
          inputs=$({
            for variable in CC CXX AR RANLIB LD CFLAGS CXXFLAGS CPPFLAGS LDFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH LIBRARY_PATH SDKROOT RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_TARGET_WASM32_WASIP1_RUSTFLAGS; do
              printf '%s=%s\n' "$variable" "${!variable-}"
            done
            for compiler in "${CC:-cc}" "${CXX:-c++}"; do
              read -r -a command <<< "$compiler"
              command -v "${command[0]}" || exit 1
              "${command[@]}" --version || exit 1
            done
            rustc --version --verbose || exit 1
            cargo --version || exit 1
            cmake --version || exit 1
            ninja --version || exit 1
            sha256sum "$BUN_WASM_SYSROOT/bun-wasm-sysroot.json" || exit 1
          } | sha256sum | cut -d' ' -f1)
          echo "hash=$inputs" >> "$GITHUB_OUTPUT"
      # Root bun.lock is intentionally absent from native identities: native consumption is
      # guarded by the sysroot/JSC receipts, effective tools, and native source hashes below.
      # These three audited Cargo sources change exact keys, not dependency compatibility.
      # All other native inputs remain hard guards; the new partition needs one cold seed.
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: native-quality-${{ needs.native-quality.outputs.producer-attempt }}
          path: ${{ runner.temp }}/native-quality-artifact
          digest-mismatch: error
      - name: Import the verified native quality checkpoint
        id: native-import
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        env:
          NATIVE_QUALITY_MANIFEST_SHA256: ${{ needs.native-quality.outputs.manifest-sha256 }}
          NATIVE_QUALITY_PRODUCER_ATTEMPT: ${{ needs.native-quality.outputs.producer-attempt }}
          NATIVE_HOST_TOOLS_HASH: ${{ steps.host-tools.outputs.hash }}
          NATIVE_INPUTS_HASH: ${{ steps.native-inputs.outputs.hash }}
          JSC_PREBUILD_MANIFEST_SHA256: ${{ needs.jsc-prebuild.outputs.manifest-sha256 }}
        run: |
          source env.sh
          native_sysroot_sha256=$(sha256sum "$BUN_WASM_SYSROOT/bun-wasm-sysroot.json" | cut -d' ' -f1)
          export NATIVE_SYSROOT_SHA256="$native_sysroot_sha256"
          bun scripts/ci-native-handoff.ts unpack "$RUNNER_TEMP/native-quality-artifact"
          rm -r -- "$RUNNER_TEMP/native-quality-artifact"
      - name: Run the blocking TLS native probe from the authenticated checkpoint
        env:
          TLS_PRODUCER_ATTEMPT: ${{ needs.native-quality.outputs.producer-attempt }}
          BUNWASM_TLS_PROBE_SHA256: ${{ needs.native-quality.outputs.tls-sha256 }}
          NATIVE_HOST_TOOLS_HASH: ${{ steps.host-tools.outputs.hash }}
          NATIVE_INPUTS_HASH: ${{ steps.native-inputs.outputs.hash }}
        run: |
          source env.sh
          export BUNWASM_TLS_PROBE_OUTPUT="$CARGO_TARGET_DIR/tls-probe/output"
          bun scripts/test-checks.ts native-probe
      - name: Carry the original native cache restore result
        id: native-cargo-cache
        env:
          CACHE_HIT: ${{ needs.native-quality.outputs.cargo-hit }}
          CACHE_MATCHED: ${{ needs.native-quality.outputs.cargo-matched }}
        run: printf 'cache-hit=%s\ncache-matched-key=%s\n' "$CACHE_HIT" "$CACHE_MATCHED" >> "$GITHUB_OUTPUT"
      - name: Carry the original legacy cache restore result
        id: native-cache
        env:
          CACHE_HIT: ${{ needs.native-quality.outputs.legacy-hit }}
        run: printf 'cache-hit=%s\n' "$CACHE_HIT" >> "$GITHUB_OUTPUT"
      - name: Preserve unchanged build-script input timestamps
        run: bun scripts/quality-input-times.ts
      - name: Identify JSC prebuild inputs
        id: jsc-inputs
        env:
          JOBS: "2"
          CAGE: ""
        run: |
          source jsc/common.sh
          copy_jsc_config_inputs
          inputs=$(jsc_inputs_hash)
          echo "hash=$inputs" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: needs.quality.outputs.jsc == 'true'
        id: jsc-cargo-cache
        with:
          path: ${{ runner.temp }}/jsc/engine
          key: jsc-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-tools.outputs.hash }}-${{ steps.native-inputs.outputs.hash }}-${{ steps.jsc-inputs.outputs.hash }}-${{ hashFiles('.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'scripts/sync-*.sh', 'scripts/check-cmake-cache.cmake', 'scripts/src/engine-init.c', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cpp', '!crates/bunwasm-cli/build.rs', '!crates/bunwasm-cli/entry-split.c', '!third_party/rquickjs-sys/quickjs/quickjs.c') }}-${{ hashFiles('scripts/build-bun-jsc.sh', 'scripts/build-engine-jsc.sh', 'scripts/build-bun-core.sh', 'scripts/build-engine-quickjs.sh', 'scripts/build.sh', 'scripts/quickjs-core-exports.txt', 'scripts/src/engine-explicit-init.ts', 'scripts/src/engine-init.c', 'scripts/guest-core-receipt.ts', 'scripts/guest-engine-receipt.ts', 'scripts/guest-build-receipt.ts', 'scripts/jsc-embedding.ts', 'tests/linker/**', 'Cargo.*', 'crates/**', 'third_party/rquickjs-sys/quickjs/quickjs.c', 'env.sh', 'scripts/quality*.ts') }}
          restore-keys: |
            jsc-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-tools.outputs.hash }}-${{ steps.native-inputs.outputs.hash }}-${{ steps.jsc-inputs.outputs.hash }}-${{ hashFiles('.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'scripts/sync-*.sh', 'scripts/check-cmake-cache.cmake', 'scripts/src/engine-init.c', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cpp', '!crates/bunwasm-cli/build.rs', '!crates/bunwasm-cli/entry-split.c', '!third_party/rquickjs-sys/quickjs/quickjs.c') }}-
      - name: Restore the bash-web shell guest build
        uses: actions/cache/restore@v4
        id: shell-cache
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}/bash-web-source
            ${{ env.CARGO_TARGET_DIR }}/bash-web-shell
          # Cargo does not see sysroot or C toolchain changes, so every build input is in the key.
          key: bash-web-shell-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-tools.outputs.hash }}-${{ hashFiles('scripts/build-bash-web-shell.sh', '.cargo/**', 'rust-toolchain.toml', 'third_party/**', 'env.sh', 'scripts/build-wasi-sysroot.ts', 'bun.lock') }}
      - name: Install the Web host dependencies
        run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --cwd web --frozen-lockfile
      - name: Install ordinary SpiderMonkey producer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm autoconf2.13 python3-dev python3-venv python3-packaging python3-setuptools libffi-dev zlib1g-dev
      - uses: actions/cache/restore@v4
        id: ordinary-cbindgen-cache
        with:
          path: ${{ env.CARGO_HOME }}/bin/cbindgen
          key: cbindgen-0.29.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Prepare ordinary pinned cbindgen
        env:
          CBINDGEN_CACHE_HIT: ${{ steps.ordinary-cbindgen-cache.outputs.cache-hit }}
        run: |
          source env.sh
          if [[ "$CBINDGEN_CACHE_HIT" != true ]]; then
            CARGO_TARGET_DIR="$RUNNER_TEMP/ordinary-cbindgen-target" cargo install --locked --version 0.29.4 cbindgen
          fi
          "$CARGO_HOME/bin/cbindgen" --version | grep -Fx 'cbindgen 0.29.4'
      - name: Identify ordinary SpiderMonkey native generation
        id: ordinary-spidermonkey-inputs
        run: |
          source env.sh
          echo "SPIDERMONKEY_BUILD_DIR=$RUNNER_TEMP/spidermonkey/ordinary" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_NATIVE_DIR=$RUNNER_TEMP/spidermonkey/ordinary-native" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_ENGINE_BUILD_DIR=$RUNNER_TEMP/ordinary-side" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_PAIR_DIR=$RUNNER_TEMP/ordinary-pair" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_WASM=$RUNNER_TEMP/ordinary-pair/bun-spidermonkey.wasm" >> "$GITHUB_ENV"
          echo "hash=$(bun scripts/spidermonkey-ordinary-ci.ts identity)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: ordinary-spidermonkey-cache
        with:
          path: ${{ runner.temp }}/spidermonkey/ordinary
          key: spidermonkey-ordinary-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ordinary-spidermonkey-inputs.outputs.hash }}
      - name: Build or verify the ordinary SpiderMonkey library
        id: ordinary-spidermonkey-native
        run: |
          source env.sh
          bun scripts/spidermonkey-ordinary-ci.ts native
          echo "ordinary SpiderMonkey exact cache hit=${{ steps.ordinary-spidermonkey-cache.outputs.cache-hit }}; matched=${{ steps.ordinary-spidermonkey-cache.outputs.cache-matched-key }}"
      - uses: actions/cache/restore@v4
        id: ordinary-spidermonkey-cargo
        with:
          # Only Cargo objects persist. Completed side/pair outputs must be fresh.
          path: ${{ runner.temp }}/ordinary-side-cargo
          key: spidermonkey-ordinary-side-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ordinary-spidermonkey-native.outputs.generation }}-${{ hashFiles('Cargo.*', '.cargo/**', 'rust-toolchain.toml', 'crates/**', 'scripts/build-engine-spidermonkey.sh', 'scripts/build-bun-spidermonkey.sh', 'scripts/spidermonkey-side-*.ts', 'scripts/src/engine-init.c') }}
          restore-keys: |
            spidermonkey-ordinary-side-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ordinary-spidermonkey-native.outputs.generation }}-
      - name: Build the common engine core once
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          source env.sh
          export BUN_CORE_BUILD_DIR="$CARGO_TARGET_DIR/split-common"
          CARGO_BUILD_JOBS=2 bash scripts/build-bun-core.sh
      # Each side reuses the completed common core and owns its target and outputs.
      # JSC builds at low priority beside QuickJS and host-engine work; timed checks
      # start only after the background producer finishes.
      - name: Start the JSC Cargo guest build
        id: jsc-guest-start
        if: needs.quality.outputs.jsc == 'true'
        env:
          JOBS: "2"
          CAGE: ""
        run: |
          bun scripts/ci-jsc-worker.ts start "$RUNNER_TEMP/jsc-guest" 3600 nice -n 19 bash scripts/with-build-cache.sh bash -c 'start=$SECONDS; source env.sh && export BUN_CORE_BUILD_DIR="$CARGO_TARGET_DIR/split-common" && bash scripts/build-bun-jsc.sh; status=$?; echo "JSC guest build took $((SECONDS - start))s"; exit "$status"'
      - name: Build native fixtures after the cache checkpoint
        env:
          JOBS: "2"
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          source env.sh
          export WASI_SDK="$WASI_SDK_PATH"
          cargo build --release --locked -j 2 -p bunwasm-host
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export BUN_CORE_BUILD_DIR="$CARGO_TARGET_DIR/split-common"
          CARGO_BUILD_JOBS=2 bash scripts/build.sh
      - name: Build the ordinary SpiderMonkey side using the completed core
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          source env.sh
          export BUN_CORE_BUILD_DIR="$CARGO_TARGET_DIR/split-common"
          export SPIDERMONKEY_CARGO_TARGET_DIR="$RUNNER_TEMP/ordinary-side-cargo/${{ steps.ordinary-spidermonkey-native.outputs.generation }}"
          CARGO_BUILD_JOBS=2 bash scripts/build-bun-spidermonkey.sh
          if llvm-nm "$SPIDERMONKEY_CARGO_TARGET_DIR/wasm32-wasip1/release/build/bunwasm-spidermonkey/"*/out/libspidermonkey_shim.a | grep -q 'bsm_control_'; then
            echo 'Production SpiderMonkey adapter contains control symbols' >&2
            exit 1
          fi
      - name: Package the native profile launcher
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/native-profile-launcher"
          cp "$CARGO_TARGET_DIR/release/bun-wasm" "$RUNNER_TEMP/native-profile-launcher/bun-wasm"
          git rev-parse HEAD > "$RUNNER_TEMP/native-profile-launcher/source.txt"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: needs.quality.outputs.shared-native == 'true'
        with:
          name: native-profile-launcher
          path: ${{ runner.temp }}/native-profile-launcher/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
          compression-level: 0
      - name: Build the standard Browser guest once
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          source env.sh
          BROWSER_CARGO_TARGET_DIR="$CARGO_TARGET_DIR" JOBS=2 bash scripts/build-bun-browser.sh

      - name: Build the JSC Cargo guest
        if: needs.quality.outputs.jsc == 'true'
        run: |
          bun scripts/ci-jsc-worker.ts wait "$RUNNER_TEMP/jsc-guest"
      - name: Stop the JSC Cargo guest build
        if: ${{ always() && contains(fromJSON('["success", "failure", "cancelled"]'), steps.jsc-guest-start.outcome) }}
        run: |
          bun scripts/ci-jsc-worker.ts stop "$RUNNER_TEMP/jsc-guest"
      - name: Save the JSC Cargo cache once per input revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.outputs.jsc == 'true' && steps.jsc-cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/jsc/engine
          key: jsc-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-tools.outputs.hash }}-${{ steps.native-inputs.outputs.hash }}-${{ steps.jsc-inputs.outputs.hash }}-${{ hashFiles('.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'scripts/sync-*.sh', 'scripts/check-cmake-cache.cmake', 'scripts/src/engine-init.c', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cpp', '!crates/bunwasm-cli/build.rs', '!crates/bunwasm-cli/entry-split.c', '!third_party/rquickjs-sys/quickjs/quickjs.c') }}-${{ hashFiles('scripts/build-bun-jsc.sh', 'scripts/build-engine-jsc.sh', 'scripts/build-bun-core.sh', 'scripts/build-engine-quickjs.sh', 'scripts/build.sh', 'scripts/quickjs-core-exports.txt', 'scripts/src/engine-explicit-init.ts', 'scripts/src/engine-init.c', 'scripts/guest-core-receipt.ts', 'scripts/guest-engine-receipt.ts', 'scripts/guest-build-receipt.ts', 'scripts/jsc-embedding.ts', 'tests/linker/**', 'Cargo.*', 'crates/**', 'third_party/rquickjs-sys/quickjs/quickjs.c', 'env.sh', 'scripts/quality*.ts') }}

      - name: Blocking JSC embedding and allocation checks
        if: needs.quality.outputs.jsc == 'true'
        run: bun scripts/jsc-embedding.ts test dist/bun-jsc.wasm
      - name: Blocking native fixture checks
        env:
          INSTALL_ENGINES: ${{ needs.quality.outputs.jsc == 'true' && 'quickjs,jsc,browser' || 'quickjs,browser' }}
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          source env.sh
          export WASI_SDK="$WASI_SDK_PATH"
          guest_environment=$(bun scripts/guest-build-receipt.ts environment)
          eval "$guest_environment"
          JOBS=2 bash scripts/build-bash-web-shell.sh
          export BUN_WASM_LAUNCHER="$CARGO_TARGET_DIR/release/bun-wasm"
          export BUN_WASM_SHELL="$GITHUB_WORKSPACE/dist/bash-web-shell.wasm"
          export BUN_WASM_ENV_UTILITY="$GITHUB_WORKSPACE/dist/bash-web-env.wasm"
          bun scripts/test-checks.ts native
          BUN_WASM_LAUNCHER="$CARGO_TARGET_DIR/release/bun-wasm" bun tests/install/package-options.ts
          BUN_WASM_LAUNCHER="$CARGO_TARGET_DIR/release/bun-wasm" bun tests/install/root-overrides.ts

      - name: Export the validated ordinary JSC pair
        if: needs.quality.outputs.jsc == 'true'
        run: |
          source env.sh
          bun scripts/ci-ordinary-jsc-program.ts export "$RUNNER_TEMP/ordinary-jsc-program"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: needs.quality.outputs.jsc == 'true'
        with:
          name: ordinary-jsc-program
          path: ${{ runner.temp }}/ordinary-jsc-program/
          if-no-files-found: error
          retention-days: 1

      - name: Export the live-gated ordinary SpiderMonkey pair
        run: |
          source env.sh
          bun scripts/spidermonkey-ordinary-ci.ts export "$RUNNER_TEMP/ordinary-spidermonkey-program"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: ordinary-spidermonkey-program
          path: ${{ runner.temp }}/ordinary-spidermonkey-program/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save verified ordinary SpiderMonkey native generation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ordinary-spidermonkey-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/spidermonkey/ordinary
          key: ${{ steps.ordinary-spidermonkey-cache.outputs.cache-primary-key }}
      - name: Save ordinary SpiderMonkey side Cargo objects
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ordinary-spidermonkey-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ordinary-side-cargo
          key: ${{ steps.ordinary-spidermonkey-cargo.outputs.cache-primary-key }}
      - name: Save ordinary pinned cbindgen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ordinary-cbindgen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CARGO_HOME }}/bin/cbindgen
          key: ${{ steps.ordinary-cbindgen-cache.outputs.cache-primary-key }}
      - name: Remove ordinary cbindgen build scratch
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ordinary-cbindgen-target"

      - name: Save the completed bash-web shell guest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shell-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}/bash-web-source
            ${{ env.CARGO_TARGET_DIR }}/bash-web-shell
          key: ${{ steps.shell-cache.outputs.cache-primary-key }}
      - name: Build the single tools fixture in the existing native target
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          source env.sh
          TOOLS_CARGO_TARGET_DIR="$CARGO_TARGET_DIR" JOBS=2 bash scripts/build-bun-tools.sh
      # PR-scoped archives cannot be shared with other PRs and evict main's warm builds.
      - name: Save the refined native Cargo cache once per input revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native-cargo-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/bin/cargo-machete
            ${{ env.CARGO_TARGET_DIR }}
          key: native-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-tools.outputs.hash }}-${{ steps.native-inputs.outputs.hash }}-${{ hashFiles('.cargo/**', 'rust-toolchain.toml', 'patches/bun/**', 'third_party/**', 'scripts/sync-*.sh', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cc', 'crates/**/*.cpp', 'crates/**/*.hpp', '!crates/bunwasm-cli/build.rs', '!crates/bunwasm-cli/entry-split.c', '!third_party/rquickjs-sys/quickjs/quickjs.c') }}-${{ hashFiles('Cargo.*', 'crates/**', 'third_party/rquickjs-sys/quickjs/quickjs.c', 'tests/fixtures/runtime-proc-spawn-requests.json', 'scripts/quality*.ts', 'scripts/tls-probe*.ts', 'checks/native-probe-*.json', 'tests/native/tls-probe.cpp', 'scripts/build-bun-tools.sh', 'scripts/build-bun-browser.sh', 'scripts/build-bun-core.sh', 'scripts/src/program-profile.ts', 'scripts/guest-core-receipt.ts', 'scripts/guest-source-manifest.ts', 'scripts/waffle-release-inputs.*', '.github/workflows/ci.yml', 'env.sh', 'scripts/build-wasi-sysroot.ts') }}

      - name: Blocking Web guest cases (QuickJS and host engine)
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        run: |
          source env.sh
          bun scripts/test-web-guests.ts quickjs browser 2>&1 | tee dist/web-guests-quickjs-browser.log
      # The playground site the browser-guest checks serve, bundled once from the verified guest
      # (and the bash-web shell) linked above; each Processes browser leg verifies and serves it.
      - name: Build the browser-guest site once
        run: |
          bun scripts/ci-install.ts --cwd sandbox --frozen-lockfile --ignore-scripts
          bun scripts/browser-guest-site.ts build "$RUNNER_TEMP/browser-guest-site"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-guest-site
          path: ${{ runner.temp }}/browser-guest-site
          if-no-files-found: error
          retention-days: 1
      - name: Blocking Web guest case (JSC)
        if: needs.quality.outputs.jsc == 'true'
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        run: |
          source env.sh
          bun scripts/test-web-guests.ts jsc 2>&1 | tee dist/web-guests-jsc.log
      - name: Export the validated standard Browser and tools guests
        run: |
          source env.sh
          bun scripts/ci-browser-program.ts export "$RUNNER_TEMP/browser-program"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-program
          path: ${{ runner.temp }}/browser-program/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: always()
        with:
          name: web-guest-fixture-receipts
          path: |
            dist/*.wasm.build.json
            dist/*.wasm.engine.json
            dist/*.wasm.embedding.json
            dist/web-guests-*.log
            ${{ runner.temp }}/jsc-prebuild.log
            ${{ runner.temp }}/jsc/engine/engine-link.map
          if-no-files-found: error
          retention-days: 1
      - uses: ./.github/actions/save-rust-build-cache
        with:
          key: ${{ steps.rust-objects.outputs.cache-primary-key }}
      - uses: ./.github/actions/save-release-downloads

  package:
    needs: quality
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Browser adapter package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile
      - run: bun run check
      - run: bun run test
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Test vectored reads and browser dependency resolution
        run: bun scripts/test-checks.ts package-extra
      - uses: ./.github/actions/save-release-downloads

  shared-prebuild:
    name: Shared PIC sysroot and JSC prebuild
    needs: quality
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.quality.outputs.shared == 'true' || needs.quality.outputs.shared-native == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    # The ordinary JSC producer budgets 45 minutes for cold C++ and its hand-off.
    timeout-minutes: 45
    env:
      WASI_LIBC_JOBS: "2"
    outputs:
      manifest-sha256: ${{ steps.shared-artifact.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure private shared sysroot paths
        run: |
          echo "WASM_TOOLS=$RUNNER_TEMP/wasm-tools" >> "$GITHUB_ENV"
          echo "BUN_WASM_SHARED_SYSROOT=$RUNNER_TEMP/bun-wasm-shared-sysroot" >> "$GITHUB_ENV"
          echo "BUN_WASM_SYSROOT=$RUNNER_TEMP/bun-wasm-shared-sysroot" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --ignore-scripts
      - name: Install sysroot build tools
        run: |
          if command -v cmake && command -v ninja; then exit 0; fi
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Install pinned shared build tools
        run: bun scripts/ci-build-tools.ts
      - uses: actions/cache/restore@v4
        id: shared-sdk
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: wasi-sdk-34.0-stock-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned WASI SDK
        if: steps.shared-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wasi-sdk-34.tar.gz"
          trap 'rm -f -- "$archive"' EXIT
          bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz "$archive"
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $archive" | sha256sum --check
          mkdir -p "$WASM_TOOLS/wasi-sdk"
          tar -xzf "$archive" --strip-components=1 -C "$WASM_TOOLS/wasi-sdk"
      - name: Save completed shared-sdk setup
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-sdk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: ${{ steps.shared-sdk.outputs.cache-primary-key }}
      - name: Identify shared profile inputs
        id: shared-inputs
        run: |
          source env.sh
          inputs=$(bun scripts/build-wasi-sysroot.ts --shared-pic --inputs)
          echo "hash=$inputs" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: shared-sysroot-cache
        with:
          path: ${{ env.BUN_WASM_SHARED_SYSROOT }}
          key: wasi-shared-pic-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.shared-inputs.outputs.hash }}-${{ hashFiles('scripts/build-wasi-sysroot.ts', 'scripts/build-shared-wasi-libc.sh', 'patches/wasi-libc/group-grow.patch', 'patches/wasi-libc/.gitattributes') }}
      - name: Build or verify shared profile
        run: |
          source env.sh
          bun scripts/build-wasi-sysroot.ts --shared-pic
      - name: Save shared profile cache
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-sysroot-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUN_WASM_SHARED_SYSROOT }}
          key: ${{ steps.shared-sysroot-cache.outputs.cache-primary-key }}
      - name: Install the shared JSC producer tools
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          if command -v ruby && command -v gperf && command -v bison; then exit 0; fi
          sudo apt-get update
          sudo apt-get install -y ruby gperf bison
      - uses: actions/cache/restore@v4
        if: needs.quality.outputs.shared-native == 'true'
        id: shared-binaryen
        with:
          path: ${{ env.WASM_TOOLS }}/binaryen-version_133-x86_64-linux.tar.gz
          key: binaryen-133-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-binaryen.ts') }}
      - name: Prepare shared-profile Binaryen
        if: needs.quality.outputs.shared-native == 'true'
        run: bun scripts/ci-binaryen.ts
      - name: Identify the shared JSC prebuild inputs
        if: needs.quality.outputs.shared-native == 'true'
        id: shared-jsc-inputs
        env:
          JSC_PROFILE: shared-group
          JOBS: "2"
          CAGE: ""
        run: |
          echo "JSC_BUILD_DIR=$RUNNER_TEMP/jsc/shared" >> "$GITHUB_ENV"
          export JSC_BUILD_DIR="$RUNNER_TEMP/jsc/shared"
          source jsc/common.sh
          copy_jsc_config_inputs
          inputs=$(jsc_inputs_hash)
          echo "hash=$inputs" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: needs.quality.outputs.shared-native == 'true'
        id: shared-jsc-cache
        with:
          path: ${{ runner.temp }}/jsc/shared
          key: shared-jsc-prebuild-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.shared-jsc-inputs.outputs.hash }}
      - name: Build or verify the shared JSC prebuild
        if: needs.quality.outputs.shared-native == 'true'
        env:
          JSC_PROFILE: shared-group
          JOBS: "2"
          CAGE: ""
          CI_SHARED_JSC_HIT: ${{ steps.shared-jsc-cache.outputs.cache-hit }}
        run: |
          source env.sh
          if [[ "$CI_SHARED_JSC_HIT" != true ]]; then
            JSC_PROFILE=shared-group bash scripts/build-jsc.sh
          fi
          source jsc/common.sh
          check_jsc_inputs_stamp
      - name: Save the shared JSC prebuild
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.outputs.shared-native == 'true' && steps.shared-jsc-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/jsc/shared
          key: ${{ steps.shared-jsc-cache.outputs.cache-primary-key }}
      - name: Package the verified shared prebuild and sysroot
        id: shared-artifact
        env:
          SHARED_NATIVE: ${{ needs.quality.outputs.shared-native }}
        run: |
          source env.sh
          bundle="$RUNNER_TEMP/shared-prebuild-artifact"
          mkdir "$bundle"
          members=(sysroot.tar.zst)
          tar --posix -C "$(dirname "$BUN_WASM_SYSROOT")" -cf - "$(basename "$BUN_WASM_SYSROOT")" | zstd -T0 -q -o "$bundle/sysroot.tar.zst"
          if [[ "$SHARED_NATIVE" == true ]]; then
            bun scripts/ci-jsc-artifact.ts "$JSC_BUILD_DIR" shared-group "$bundle/prebuild.tar.zst"
            members+=(prebuild.tar.zst)
          fi
          {
            printf 'run=%s\nsha=%s\nshared-native=%s\nsysroot=%s\njsc-build-dir=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SHARED_NATIVE" "$BUN_WASM_SYSROOT" "$RUNNER_TEMP/jsc/shared"
            (cd "$bundle" && sha256sum "${members[@]}")
          } > "$bundle/manifest"
          tar --posix -C "$bundle" -cf "$RUNNER_TEMP/shared-prebuild.tar" "${members[@]}" manifest
          echo "manifest-sha256=$(sha256sum "$bundle/manifest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/shared-prebuild.tar
          if-no-files-found: error
          retention-days: 1
          archive: false
      - uses: ./.github/actions/save-release-downloads

  shared-spidermonkey-prebuild:
    name: Shared SpiderMonkey library prebuild
    needs: [quality, shared-prebuild]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.quality.outputs.shared-native == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    outputs:
      manifest-sha256: ${{ steps.shared-sm-artifact.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure private shared sysroot paths
        run: |
          echo "WASM_TOOLS=$RUNNER_TEMP/wasm-tools" >> "$GITHUB_ENV"
          echo "BUN_WASM_SHARED_SYSROOT=$RUNNER_TEMP/bun-wasm-shared-sysroot" >> "$GITHUB_ENV"
          echo "BUN_WASM_SYSROOT=$RUNNER_TEMP/bun-wasm-shared-sysroot" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --ignore-scripts
      - name: Install pinned shared build tools
        run: bun scripts/ci-build-tools.ts
      - uses: actions/cache/restore@v4
        id: shared-sdk
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: wasi-sdk-34.0-stock-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned WASI SDK
        if: steps.shared-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wasi-sdk-34.tar.gz"
          trap 'rm -f -- "$archive"' EXIT
          bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz "$archive"
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $archive" | sha256sum --check
          mkdir -p "$WASM_TOOLS/wasi-sdk"
          tar -xzf "$archive" --strip-components=1 -C "$WASM_TOOLS/wasi-sdk"
      - name: Save completed shared-sdk setup
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-sdk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: ${{ steps.shared-sdk.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        if: needs.quality.outputs.shared-native == 'true'
        id: shared-rustup-cache
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: rust-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, rustfmt, clippy
          targets: wasm32-wasip1, wasm32-wasip1-threads, wasm32-unknown-unknown
      - name: Configure private shared JSC build path
        run: echo "JSC_BUILD_DIR=$RUNNER_TEMP/jsc/shared" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: shared-prebuild.tar
          path: ${{ runner.temp }}/shared-prebuild-transfer
      - name: Import only the verified shared sysroot for SpiderMonkey
        env:
          SHARED_NATIVE: ${{ needs.quality.outputs.shared-native }}
          SHARED_PREBUILD_MANIFEST_SHA256: ${{ needs.shared-prebuild.outputs.manifest-sha256 }}
          JSC_PROFILE: shared-group
          JOBS: "2"
          CAGE: ""
        run: |
          source env.sh
          transfer="$RUNNER_TEMP/shared-prebuild-transfer/shared-prebuild.tar"
          manifest="$RUNNER_TEMP/shared-prebuild-manifest"
          members=(sysroot.tar.zst)
          if [[ "$SHARED_NATIVE" == true ]]; then members+=(prebuild.tar.zst); fi
          [[ "$SHARED_PREBUILD_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(tar --posix -tf "$transfer")" == "$(printf '%s\n' "${members[@]}" manifest)" ]]
          [[ ! -e "$manifest" ]]
          tar --posix -xOf "$transfer" manifest > "$manifest"
          echo "$SHARED_PREBUILD_MANIFEST_SHA256  $manifest" | sha256sum --check --strict
          expected=$(printf 'run=%s\nsha=%s\nshared-native=%s\nsysroot=%s\njsc-build-dir=%s' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SHARED_NATIVE" "$BUN_WASM_SYSROOT" "$JSC_BUILD_DIR")
          [[ "$(head -n 5 "$manifest")" == "$expected" ]]
          [[ "$(tail -n +6 "$manifest" | cut -d' ' -f3)" == "$(printf '%s\n' "${members[@]}")" ]]
          for member in "${members[@]}"; do
            digest=$(tail -n +6 "$manifest" | awk -v member="$member" '$2 == member { print $1 }')
            [[ "$(tar --posix -xOf "$transfer" "$member" | sha256sum | cut -d' ' -f1)" == "$digest" ]]
          done
          [[ ! -e "$BUN_WASM_SYSROOT" ]]
          mkdir -p "$(dirname "$BUN_WASM_SYSROOT")" "$(dirname "$JSC_BUILD_DIR")"
          tar --posix -xOf "$transfer" sysroot.tar.zst | zstd -dc | tar -C "$(dirname "$BUN_WASM_SYSROOT")" -xf -
          test -s "$BUN_WASM_SYSROOT/bun-wasm-sysroot.json"
          test -s "$BUN_WASM_SYSROOT/lib/wasm32-wasip1/libc.a"
          bun scripts/build-wasi-sysroot.ts --shared-pic
          rm -r -- "$manifest" "$RUNNER_TEMP/shared-prebuild-transfer"
      - name: Install the SpiderMonkey producer tools
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm autoconf2.13 pkg-config python3-dev python3-venv python3-packaging python3-setuptools libffi-dev zlib1g-dev
      - uses: actions/cache/restore@v4
        if: needs.quality.outputs.shared-native == 'true'
        id: shared-cbindgen-cache
        with:
          path: ${{ env.CARGO_HOME }}/bin/cbindgen
          key: cbindgen-0.29.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Prepare pinned cbindgen
        if: needs.quality.outputs.shared-native == 'true'
        env:
          CBINDGEN_CACHE_HIT: ${{ steps.shared-cbindgen-cache.outputs.cache-hit }}
        run: |
          source env.sh
          if [[ "$CBINDGEN_CACHE_HIT" != true ]]; then
            CARGO_TARGET_DIR="$CARGO_TARGET_DIR/shared-native/cbindgen-target" cargo install --locked --version 0.29.4 cbindgen
          fi
          "$CARGO_HOME/bin/cbindgen" --version | grep -Fx 'cbindgen 0.29.4'
      - name: Save pinned cbindgen
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.outputs.shared-native == 'true' && steps.shared-cbindgen-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CARGO_HOME }}/bin/cbindgen
          key: ${{ steps.shared-cbindgen-cache.outputs.cache-primary-key }}
      - name: Identify shared SpiderMonkey native inputs
        if: needs.quality.outputs.shared-native == 'true'
        id: shared-spidermonkey-inputs
        run: |
          source env.sh
          echo "SPIDERMONKEY_BUILD_DIR=$RUNNER_TEMP/spidermonkey/shared" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_NATIVE_DIR=$RUNNER_TEMP/spidermonkey/shared/native" >> "$GITHUB_ENV"
          inputs=$({
            printf 'profile=shared-group\n'
            sha256sum "$BUN_WASM_SYSROOT/bun-wasm-sysroot.json" "$BUN_WASM_SYSROOT/lib/wasm32-wasip1/libc.a" "$WASI_SDK_PATH/bin/clang++" "$CARGO_HOME/bin/cbindgen" /usr/bin/clang /usr/bin/clang++
            for tool in rustc cargo clang clang++ llvm-readobj python3 autoconf2.13 make perl; do
              sha256sum "$(command -v "$tool")"
            done
            dpkg-query -W
            /usr/bin/clang --version
            /usr/bin/clang++ --version
            rustc -vV
            llvm-readobj --version
            python3 --version
            autoconf2.13 --version
          } | sha256sum | cut -d' ' -f1)
          echo "hash=$inputs" >> "$GITHUB_OUTPUT"
          echo "recipes=$(bun scripts/ci-spidermonkey-prebuild.ts recipes)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: needs.quality.outputs.shared-native == 'true'
        id: shared-spidermonkey-cache
        with:
          path: ${{ runner.temp }}/spidermonkey/shared
          key: spidermonkey-shared-group-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.shared-spidermonkey-inputs.outputs.hash }}-${{ steps.shared-spidermonkey-inputs.outputs.recipes }}
      - name: Produce or verify the shared SpiderMonkey library once
        if: needs.quality.outputs.shared-native == 'true'
        env:
          JOBS: "2"
          CAGE: ""
        run: |
          source env.sh
          source_tree="$SPIDERMONKEY_BUILD_DIR/firefox"
          if [[ ! -d "$source_tree/.git" ]]; then
            git init -q "$source_tree"
            git -C "$source_tree" remote add origin https://github.com/mozilla-firefox/firefox.git
          fi
          # Fetch's sparse closure needs lazy blobs on a fresh runner, not only a retained tree.
          git -C "$source_tree" config remote.origin.promisor true
          git -C "$source_tree" config remote.origin.partialclonefilter blob:none
          # The recipe stages fresh headers; only its incremental objects and patched source persist.
          rm -rf -- "$SPIDERMONKEY_BUILD_DIR/native"
          # Mach checks vendored packages against its invoking Python's packages.
          # Exclude runner tools and any packages left by a restored environment.
          python3 -m venv --clear --without-pip "$RUNNER_TEMP/spidermonkey-python"
          export PATH="$RUNNER_TEMP/spidermonkey-python/bin:$PATH"
          bash spidermonkey/build-shared-group.sh
      - name: Bind the verified SpiderMonkey transfer to this run and source
        id: shared-sm-artifact
        env:
          SM_NATIVE_INPUTS: ${{ steps.shared-spidermonkey-inputs.outputs.hash }}
        run: |
          source env.sh
          manifest=$(bun scripts/ci-spidermonkey-prebuild.ts write "$SPIDERMONKEY_BUILD_DIR" "$SM_NATIVE_INPUTS")
          echo "manifest-sha256=$manifest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: shared-spidermonkey-prebuild
          path: |
            ${{ env.SPIDERMONKEY_BUILD_DIR }}/native/
            ${{ env.SPIDERMONKEY_BUILD_DIR }}/receipt/
            ${{ env.SPIDERMONKEY_BUILD_DIR }}/prebuild.json
          if-no-files-found: error
          retention-days: 1
      - name: Save the verified shared SpiderMonkey source and native work
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.outputs.shared-native == 'true' && steps.shared-spidermonkey-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/spidermonkey/shared
          key: ${{ steps.shared-spidermonkey-cache.outputs.cache-primary-key }}
      - name: Shared SpiderMonkey cache result
        if: needs.quality.outputs.shared-native == 'true'
        run: echo "shared SpiderMonkey exact cache hit=${{ steps.shared-spidermonkey-cache.outputs.cache-hit }}; matched=${{ steps.shared-spidermonkey-cache.outputs.cache-matched-key }}"
      - uses: ./.github/actions/save-release-downloads

  shared-sysroot:
    name: Shared PIC sysroot proof
    needs: [quality, rust, shared-prebuild, shared-spidermonkey-prebuild]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() && needs.quality.result == 'success' && (needs.quality.outputs.shared == 'true' || needs.quality.outputs.shared-native == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 30
    env:
      WASI_LIBC_JOBS: "2"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
    steps:
      - name: Reserve time for shared producer diagnostics
        if: needs.quality.outputs.shared-native == 'true'
        run: echo "SHARED_PRODUCER_DEADLINE_MS=$(( $(date +%s) * 1000 + 27 * 60 * 1000 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Require the shared prebuild producer
        env:
          SHARED_PREBUILD_RESULT: ${{ needs.shared-prebuild.result }}
        run: test "$SHARED_PREBUILD_RESULT" = success
      - name: Require the shared native launcher producer
        if: needs.quality.outputs.shared-native == 'true'
        env:
          PROFILE_LAUNCHER_RESULT: ${{ needs.rust.result }}
        run: |
          test "$PROFILE_LAUNCHER_RESULT" = success
      - name: Require the shared SpiderMonkey library producer
        if: needs.quality.outputs.shared-native == 'true'
        env:
          SM_PREBUILD_RESULT: ${{ needs.shared-spidermonkey-prebuild.result }}
        run: test "$SM_PREBUILD_RESULT" = success
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        if: needs.quality.outputs.shared-native == 'true'
        with:
          name: native-profile-launcher
          path: ${{ runner.temp }}/native-profile-launcher
      - name: Verify the native launcher source
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          test "$(cat "$RUNNER_TEMP/native-profile-launcher/source.txt")" = "$GITHUB_SHA"
          chmod +x "$RUNNER_TEMP/native-profile-launcher/bun-wasm"
      - name: Reuse the production playground for shared profile checks
        if: needs.quality.outputs.shared-native == 'true'
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-guest-site
          path: ${{ runner.temp }}/shared-playground-site
      - name: Select the existing playground site for shared profile checks
        if: needs.quality.outputs.shared-native == 'true'
        run: echo "BUN_WASM_BROWSER_SITE=$RUNNER_TEMP/shared-playground-site" >> "$GITHUB_ENV"
      - name: Configure private shared sysroot paths
        run: |
          echo "WASM_TOOLS=$RUNNER_TEMP/wasm-tools" >> "$GITHUB_ENV"
          echo "BUN_WASM_SHARED_SYSROOT=$RUNNER_TEMP/bun-wasm-shared-sysroot" >> "$GITHUB_ENV"
          echo "BUN_WASM_SYSROOT=$RUNNER_TEMP/bun-wasm-shared-sysroot" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --ignore-scripts
      - name: Install sysroot build tools
        run: |
          if command -v cmake && command -v ninja; then exit 0; fi
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Install pinned shared build tools
        run: bun scripts/ci-build-tools.ts
      - uses: actions/cache/restore@v4
        id: shared-sdk
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: wasi-sdk-34.0-stock-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned WASI SDK
        if: steps.shared-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wasi-sdk-34.tar.gz"
          trap 'rm -f -- "$archive"' EXIT
          bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz "$archive"
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $archive" | sha256sum --check
          mkdir -p "$WASM_TOOLS/wasi-sdk"
          tar -xzf "$archive" --strip-components=1 -C "$WASM_TOOLS/wasi-sdk"
      - name: Save completed shared-sdk setup
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-sdk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: ${{ steps.shared-sdk.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: shared-wasm-tools
        with:
          path: ${{ env.WASM_TOOLS }}/wasm-tools-1.262.0-x86_64-linux.tar.gz
          key: wasm-tools-1.262.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned wasm-tools
        run: |
          set -euo pipefail
          archive="$WASM_TOOLS/wasm-tools-1.262.0-x86_64-linux.tar.gz"
          stage=$(mktemp -d "$WASM_TOOLS/.wasm-tools-XXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          if [[ ! -f "$archive" ]]; then
            bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
              https://github.com/bytecodealliance/wasm-tools/releases/download/v1.262.0/wasm-tools-1.262.0-x86_64-linux.tar.gz "$archive"
          fi
          echo "655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65  $archive" | sha256sum --check
          tar -xzf "$archive" --strip-components=1 -C "$stage"
          test "$("$stage/wasm-tools" --version)" = "wasm-tools 1.262.0 (e22db44da 2026-10-13)"
          mkdir -p "$WASM_TOOLS/wasm-tools-bin"
          cp "$stage/wasm-tools" "$WASM_TOOLS/wasm-tools-bin/wasm-tools"
          echo "$WASM_TOOLS/wasm-tools-bin" >> "$GITHUB_PATH"
      - name: Save completed shared-wasm-tools setup
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-wasm-tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/wasm-tools-1.262.0-x86_64-linux.tar.gz
          key: ${{ steps.shared-wasm-tools.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: shared-wasmtime
        with:
          path: ${{ env.WASM_TOOLS }}/wasmtime-v49.0.3-x86_64-linux.tar.xz
          key: wasmtime-49.0.3-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Wasmtime
        run: |
          set -euo pipefail
          archive="$WASM_TOOLS/wasmtime-v49.0.3-x86_64-linux.tar.xz"
          stage=$(mktemp -d "$WASM_TOOLS/.wasmtime-XXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          if [[ ! -f "$archive" ]]; then
            bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
              https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.3/wasmtime-v49.0.3-x86_64-linux.tar.xz "$archive"
          fi
          echo "4001225413f208345b980525f31c4080e1873808b38d0ddc7918497340667fbb  $archive" | sha256sum --check
          tar -xJf "$archive" --strip-components=1 -C "$stage"
          test "$("$stage/wasmtime" --version)" = "wasmtime 49.0.3 (f96eabaa1 2026-10-14)"
          mkdir -p "$WASM_TOOLS/wasmtime"
          cp "$stage/wasmtime" "$WASM_TOOLS/wasmtime/wasmtime"
          echo "$WASM_TOOLS/wasmtime" >> "$GITHUB_PATH"
      - name: Save completed shared-wasmtime setup
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-wasmtime.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/wasmtime-v49.0.3-x86_64-linux.tar.xz
          key: ${{ steps.shared-wasmtime.outputs.cache-primary-key }}
      - name: Identify shared profile inputs
        id: shared-inputs
        run: |
          source env.sh
          inputs=$(bun scripts/build-wasi-sysroot.ts --shared-pic --inputs)
          echo "hash=$inputs" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: needs.quality.outputs.shared-native == 'true'
        id: shared-binaryen
        with:
          path: ${{ env.WASM_TOOLS }}/binaryen-version_133-x86_64-linux.tar.gz
          key: binaryen-133-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-binaryen.ts') }}
      - name: Prepare shared-profile Binaryen
        if: needs.quality.outputs.shared-native == 'true'
        run: bun scripts/ci-binaryen.ts
      - name: Configure private shared JSC build path
        run: echo "JSC_BUILD_DIR=$RUNNER_TEMP/jsc/shared" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: shared-prebuild.tar
          path: ${{ runner.temp }}/shared-prebuild-transfer
      - name: Import the verified shared prebuild and sysroot
        env:
          SHARED_NATIVE: ${{ needs.quality.outputs.shared-native }}
          SHARED_PREBUILD_MANIFEST_SHA256: ${{ needs.shared-prebuild.outputs.manifest-sha256 }}
          JSC_PROFILE: shared-group
          JOBS: "2"
          CAGE: ""
        run: |
          source env.sh
          transfer="$RUNNER_TEMP/shared-prebuild-transfer/shared-prebuild.tar"
          manifest="$RUNNER_TEMP/shared-prebuild-manifest"
          members=(sysroot.tar.zst)
          if [[ "$SHARED_NATIVE" == true ]]; then members+=(prebuild.tar.zst); fi
          [[ "$SHARED_PREBUILD_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(tar --posix -tf "$transfer")" == "$(printf '%s\n' "${members[@]}" manifest)" ]]
          [[ ! -e "$manifest" ]]
          tar --posix -xOf "$transfer" manifest > "$manifest"
          echo "$SHARED_PREBUILD_MANIFEST_SHA256  $manifest" | sha256sum --check --strict
          expected=$(printf 'run=%s\nsha=%s\nshared-native=%s\nsysroot=%s\njsc-build-dir=%s' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SHARED_NATIVE" "$BUN_WASM_SYSROOT" "$JSC_BUILD_DIR")
          [[ "$(head -n 5 "$manifest")" == "$expected" ]]
          [[ "$(tail -n +6 "$manifest" | cut -d' ' -f3)" == "$(printf '%s\n' "${members[@]}")" ]]
          for member in "${members[@]}"; do
            digest=$(tail -n +6 "$manifest" | awk -v member="$member" '$2 == member { print $1 }')
            [[ "$(tar --posix -xOf "$transfer" "$member" | sha256sum | cut -d' ' -f1)" == "$digest" ]]
          done
          [[ ! -e "$BUN_WASM_SYSROOT" && ! -e "$JSC_BUILD_DIR" ]]
          mkdir -p "$(dirname "$BUN_WASM_SYSROOT")" "$(dirname "$JSC_BUILD_DIR")"
          tar --posix -xOf "$transfer" sysroot.tar.zst | zstd -dc | tar -C "$(dirname "$BUN_WASM_SYSROOT")" -xf -
          test -s "$BUN_WASM_SYSROOT/bun-wasm-sysroot.json"
          test -s "$BUN_WASM_SYSROOT/lib/wasm32-wasip1/libc.a"
          bun scripts/build-wasi-sysroot.ts --shared-pic
          if [[ "$SHARED_NATIVE" == true ]]; then
            tar --posix -xOf "$transfer" prebuild.tar.zst | zstd -dc | tar -C "$(dirname "$JSC_BUILD_DIR")" -xf -
            source jsc/common.sh
            check_jsc_inputs_stamp
          fi
          rm -r -- "$manifest" "$RUNNER_TEMP/shared-prebuild-transfer"
      - name: Run two-member real-libc proof
        run: |
          source env.sh
          bash scripts/test-shared-sysroot.sh "$RUNNER_TEMP/shared-sysroot-proof"

      - uses: actions/cache/restore@v4
        if: needs.quality.outputs.shared-native == 'true'
        id: shared-rustup-cache
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: rust-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: dtolnay/rust-toolchain@nightly
        if: needs.quality.outputs.shared-native == 'true'
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, rustfmt, clippy
          targets: wasm32-wasip1, wasm32-wasip1-threads, wasm32-unknown-unknown
      - uses: ./.github/actions/rust-build-cache
        id: rust-objects
        if: needs.quality.outputs.shared-native == 'true'
      - uses: actions/cache/restore@v4
        if: needs.quality.outputs.shared-native == 'true'
        id: shared-native-cache
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}/shared-native
          key: shared-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/ci-build-tools.ts', 'scripts/sync-*.sh', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake') }}-${{ steps.shared-inputs.outputs.hash }}-${{ hashFiles('Cargo.toml', '.cargo/**', 'crates/**', 'third_party/**', 'patches/**', 'scripts/build-native-profile.ts', 'scripts/producer-diagnostics.ts', 'scripts/build-bun-core.sh', 'scripts/build-engine-quickjs.sh', 'scripts/build-engine-spidermonkey-shared.sh', 'scripts/spidermonkey-side-core-receipt.ts', 'spidermonkey/**', 'scripts/guest-*.ts', 'scripts/src/program-profile.ts', 'scripts/src/engine-*.ts', 'scripts/src/engine-init.c', 'env.sh') }}
          restore-keys: |
            shared-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/ci-build-tools.ts', 'scripts/sync-*.sh', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake') }}-${{ steps.shared-inputs.outputs.hash }}-
      - name: Shared profile cache result
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/shared-spidermonkey-producer"
          echo "shared native exact cache hit=${{ steps.shared-native-cache.outputs.cache-hit }}; matched=${{ steps.shared-native-cache.outputs.cache-matched-key }}" | tee "$RUNNER_TEMP/shared-spidermonkey-producer/cache-result.log"
      - name: Prepare the shared native source dependencies
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          source env.sh
          bash scripts/sync-bun.sh
          bash scripts/sync-crypto.sh
          cargo fetch --locked
          guest_environment=$(bun scripts/guest-build-receipt.ts environment)
          eval "$guest_environment"
          sysroot=$("$RUSTC" --print sysroot)
          "$GUEST_CARGO" fetch --locked --manifest-path "$sysroot/lib/rustlib/src/rust/library/Cargo.toml" --target wasm32-wasip1
      - name: Produce the shared native profile once
        id: shared-quickjs-producer
        if: needs.quality.outputs.shared-native == 'true'
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          source env.sh
          bun scripts/build-native-profile.ts shared-group "$CARGO_TARGET_DIR/shared-native"
      - name: Retain the matched shared QuickJS program for qualification
        if: ${{ always() && steps.shared-quickjs-producer.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: shared-quickjs-program
          path: ${{ env.CARGO_TARGET_DIR }}/shared-native/program/
          if-no-files-found: error
          retention-days: 1
      - name: Produce the shared JSC profile once
        id: shared-jsc-producer
        if: needs.quality.outputs.shared-native == 'true'
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        env:
          JSC_PROFILE: shared-group
          JOBS: "2"
          CAGE: ""
        run: |
          source env.sh
          bun scripts/build-native-profile.ts shared-group "$CARGO_TARGET_DIR/shared-native" jsc
      - name: Retain the matched shared JSC program for qualification
        if: ${{ always() && steps.shared-jsc-producer.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: shared-jsc-program
          path: ${{ env.CARGO_TARGET_DIR }}/shared-native/program-jsc/
          if-no-files-found: error
          retention-days: 1
      - name: Configure the shared SpiderMonkey consumer inputs
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          echo "SPIDERMONKEY_BUILD_DIR=$RUNNER_TEMP/spidermonkey/shared" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_NATIVE_DIR=$RUNNER_TEMP/spidermonkey/shared/native" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_LIBCXX_DIR=$JSC_BUILD_DIR/libcxx/lib" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        if: needs.quality.outputs.shared-native == 'true'
        with:
          name: shared-spidermonkey-prebuild
          path: ${{ runner.temp }}/spidermonkey/shared
      - name: Verify the shared SpiderMonkey producer transfer
        if: needs.quality.outputs.shared-native == 'true'
        env:
          SM_PREBUILD_MANIFEST_SHA256: ${{ needs.shared-spidermonkey-prebuild.outputs.manifest-sha256 }}
        run: |
          source env.sh
          bun scripts/ci-spidermonkey-prebuild.ts verify "$SPIDERMONKEY_BUILD_DIR" "$SM_PREBUILD_MANIFEST_SHA256"
      - name: Produce the shared SpiderMonkey profile once
        id: shared-spidermonkey-producer
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          source env.sh
          bun scripts/producer-diagnostics.ts run "$RUNNER_TEMP/shared-spidermonkey-producer" "$SHARED_PRODUCER_DEADLINE_MS" \
            bash scripts/with-build-cache.sh bun scripts/build-native-profile.ts shared-group "$CARGO_TARGET_DIR/shared-native" spidermonkey
      - name: Retain shared SpiderMonkey producer diagnostics
        if: ${{ always() && steps.shared-spidermonkey-producer.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: shared-spidermonkey-producer-diagnostics
          path: ${{ runner.temp }}/shared-spidermonkey-producer/
          if-no-files-found: warn
          retention-days: 1
      - name: Retain the matched shared SpiderMonkey program for qualification
        if: ${{ always() && steps.shared-spidermonkey-producer.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: shared-spidermonkey-program
          path: |
            ${{ env.CARGO_TARGET_DIR }}/shared-native/program-spidermonkey/
            ${{ env.CARGO_TARGET_DIR }}/shared-native/spidermonkey/inputs.json
            ${{ env.CARGO_TARGET_DIR }}/shared-native/spidermonkey/engine-link.map
            ${{ env.SPIDERMONKEY_BUILD_DIR }}/receipt/
          if-no-files-found: error
          retention-days: 1
      - name: Save the completed shared native profile
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.outputs.shared-native == 'true' && steps.shared-native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}/shared-native
          key: ${{ steps.shared-native-cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/save-rust-build-cache
        if: needs.quality.outputs.shared-native == 'true'
        with:
          key: ${{ steps.rust-objects.outputs.cache-primary-key }}
      - uses: ./.github/actions/save-release-downloads

      - name: Consume the shared native feature checks
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          source env.sh
          export BUN_WASM_PROFILE_PROGRAM="$CARGO_TARGET_DIR/shared-native/program/bun.wasm"
          export BUN_WASM_LAUNCHER="$RUNNER_TEMP/native-profile-launcher/bun-wasm"
          export BUN_WASM_TRACE=1
          bun scripts/test-checks.ts native --profile shared-group
      - name: Consume the shared Browser feature checks
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          source env.sh
          bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --cwd web --frozen-lockfile --ignore-scripts
          (cd web && bun scripts/ci-browser-deps.ts chromium && bunx playwright install chromium)
          export BUN_WASM_PROFILE_PROGRAM="$CARGO_TARGET_DIR/shared-native/program/bun.wasm"
          bun scripts/run-with-timeout.mts 420 bun scripts/test-checks.ts browser-guest --profile shared-group
      - name: Consume the shared JSC feature checks
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          source env.sh
          export BUN_WASM_PROFILE_PROGRAM="$CARGO_TARGET_DIR/shared-native/program-jsc/bun.wasm"
          export BUN_WASM_LAUNCHER="$RUNNER_TEMP/native-profile-launcher/bun-wasm"
          export BUN_WASM_TRACE=1
          bun scripts/test-checks.ts native --profile shared-group
          bun scripts/run-with-timeout.mts 420 bun scripts/test-checks.ts browser-guest --profile shared-group
      - name: Consume the shared SpiderMonkey native feature checks
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          source env.sh
          export BUN_WASM_PROFILE_PROGRAM="$CARGO_TARGET_DIR/shared-native/program-spidermonkey/bun.wasm"
          export BUN_WASM_LAUNCHER="$RUNNER_TEMP/native-profile-launcher/bun-wasm"
          export BUN_WASM_TRACE=1
          bun scripts/test-checks.ts native --profile shared-group
      - name: Consume the shared SpiderMonkey Browser feature checks
        if: needs.quality.outputs.shared-native == 'true'
        run: |
          source env.sh
          export BUN_WASM_PROFILE_PROGRAM="$CARGO_TARGET_DIR/shared-native/program-spidermonkey/bun.wasm"
          bun scripts/run-with-timeout.mts 420 bun scripts/test-checks.ts browser-guest --profile shared-group

  web:
    needs: [quality, web-unit, web-browser]
    if: ${{ always() && needs.quality.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Web host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Require all Web host unit and browser gates
        env:
          WEB_UNIT_RESULT: ${{ needs.web-unit.result }}
          WEB_BROWSER_RESULT: ${{ needs.web-browser.result }}
        run: test "$WEB_UNIT_RESULT" = success && test "$WEB_BROWSER_RESULT" = success
      - uses: ./.github/actions/release-downloads
        with:
          scope: web
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install Web host browser test dependencies
        run: bash ../scripts/test-web-host.sh --setup
      - uses: ./.github/actions/browser-deps
        with:
          browsers: chromium firefox webkit
      - name: Install Chromium, Firefox and WebKit
        run: bunx playwright install chromium firefox webkit
      - name: Web host browser gates
        env:
          EDITOR_SCRATCH_ROOT: ${{ runner.temp }}
        run: bash ../scripts/test-web-host.sh --smoke
      - uses: ./.github/actions/save-release-downloads

  web-unit:
    needs: quality
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Web host unit and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
        with:
          scope: web
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Configure Web compiler toolchain
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=nightly-2026-09-15" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: web-rustup-cache
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: rust-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, rustfmt, clippy
          targets: wasm32-wasip1, wasm32-wasip1-threads, wasm32-unknown-unknown
      - name: Save completed Web compiler setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.web-rustup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: ${{ steps.web-rustup-cache.outputs.cache-primary-key }}
      - name: Web host unit, CLI shim, type and bundle gates
        env:
          C1_WEBKIT_FAILURE_DIRECTORY: ${{ runner.temp }}/c1-webkit-failures
        run: bash ../scripts/test-web-host.sh --unit
      - name: Retain first C1 WebKit admission failure
        if: failure()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: c1-webkit-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c1-webkit-failures
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/save-release-downloads

  web-browser:
    needs: quality
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Web browser (${{ matrix.batch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.quality.outputs.web-browser-shards) }}
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
        with:
          scope: web
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install Web host browser test dependencies
        run: bash ../scripts/test-web-host.sh --setup
      - uses: ./.github/actions/browser-deps
        with:
          browsers: chromium firefox webkit
      - name: Install Chromium, Firefox and WebKit
        run: bunx playwright install chromium firefox webkit
      - name: Run the discovered Web browser shard
        env:
          EDITOR_SCRATCH_ROOT: ${{ runner.temp }}
          WEB_BROWSER_BATCH: ${{ matrix.batch }}
          WEB_BROWSER_TIMEOUT_SECONDS: ${{ matrix.timeoutSeconds }}
        run: bun ../scripts/run-with-timeout.mts "$WEB_BROWSER_TIMEOUT_SECONDS" bun ../scripts/test-checks.ts web-browser --batch "$WEB_BROWSER_BATCH"
      - uses: ./.github/actions/save-release-downloads

  process-bundles:
    needs: quality
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Shared process browser bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --cwd web --frozen-lockfile --linker=isolated
      - name: Build each process fixture once for all browsers
        run: bun web/scripts/ci-process-bundles.ts "$RUNNER_TEMP/process-bundles"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: process-bundles
          path: ${{ runner.temp }}/process-bundles
          retention-days: 1
          if-no-files-found: error
      - uses: ./.github/actions/save-release-downloads

  browser-guest:
    needs: [quality, rust]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.rust.result == 'success' }}
    name: Browser guest (${{ matrix.browser }}, ${{ matrix.batch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        batch: ${{ fromJSON(needs.quality.outputs.browser-guest-batches) }}
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --linker=isolated
      - uses: ./.github/actions/browser-deps
        with:
          browsers: ${{ matrix.browser == 'chromium' && 'chromium firefox' || matrix.browser }}
      - name: Install browser
        run: bunx playwright install ${{ matrix.browser == 'chromium' && 'chromium firefox' || matrix.browser }}
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-guest-site
          path: ${{ runner.temp }}/browser-guest-site
      - name: Browser-guest checks on the verified site
        env:
          BUN_WASM_BROWSER_SITE: ${{ runner.temp }}/browser-guest-site
          BUN_WASM_BROWSER_REPORT_DIR: ${{ runner.temp }}/browser-guest-diagnostics
          BUN_WASM_STORAGE_CI_QUARANTINE: known-20261114
          BUN_WASM_TEST_BROWSERS: ${{ matrix.browser }}
          BUN_WASM_JSC_PRODUCER: ${{ needs.quality.outputs.jsc == 'true' && 'selected' || 'unselected' }}
          TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p "$BUN_WASM_BROWSER_REPORT_DIR"
          bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --cwd .. --frozen-lockfile --ignore-scripts
          bun ../scripts/run-with-timeout.mts 900 bun ../scripts/test-checks.ts browser-guest --batch "${{ matrix.batch }}"
      - name: Retain Browser guest diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-guest-diagnostics-${{ matrix.browser }}-${{ matrix.batch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-guest-diagnostics
          if-no-files-found: ignore
          retention-days: 1
      - uses: ./.github/actions/save-release-downloads

  browser-process:
    needs: [quality, rust, process-bundles, browser-guest]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (always() && !cancelled() && needs.quality.result == 'success' && needs.process-bundles.result == 'success' && (needs.rust.result == 'success' || needs.rust.result == 'skipped')) }}
    name: Processes (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected Browser guest batch
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          GUEST_RESULT: ${{ needs.browser-guest.result }}
        run: |
          if [[ "$RUST_RESULT" == success ]]; then
            test "$GUEST_RESULT" = success
          else
            test "$RUST_RESULT" = skipped
            test "$GUEST_RESULT" = skipped
          fi
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: process-bundles
          path: ${{ runner.temp }}/process-bundles
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --linker=isolated
      - uses: ./.github/actions/browser-deps
        with:
          browsers: ${{ matrix.browser == 'chromium' && 'chromium firefox' || matrix.browser }}
      - name: Install browser
        run: bunx playwright install ${{ matrix.browser == 'chromium' && 'chromium firefox' || matrix.browser }}
      - name: Process supervisor, generic preview1 and interrupt gate (no Rust or dist artifacts)
        env:
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          PROCESS_SMOKE_PORT: "4186"
          TMPDIR: ${{ runner.temp }}
        run: bun ../scripts/run-with-timeout.mts 300 bun tests/browser-process.ts ${{ matrix.browser }}
      - name: Injected third-party interrupt checks (no Rust or dist artifacts)
        env:
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          INTERRUPT_SCRATCH_ROOT: ${{ runner.temp }}
        run: bun ../scripts/run-with-timeout.mts 300 bun tests/browser-interrupt.ts ${{ matrix.browser }}
      - name: Process pipes, CLI ABI and foreground stop (isolated install, no Rust or dist artifacts)
        env:
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          TMPDIR: ${{ runner.temp }}
          BUN_WASM_RUNTIME_PROC_BUNDLE: ${{ runner.temp }}/process-bundles/runtime-proc
        run: bun ../scripts/run-with-timeout.mts 300 bun tests/browser-runtime-proc.ts ${{ matrix.browser }}

      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        if: needs.rust.result == 'success'
        with:
          name: browser-program
          path: dist/browser-program
      - name: Real Bun source cache in one Waffle browser runtime
        if: needs.rust.result == 'success'
        env:
          BUN_WASM_RUNTIME_PROC_ARTIFACT: ${{ github.workspace }}/dist/browser-program/bun-browser.wasm
          BUN_WASM_RUNTIME_PROC_SCENARIO: source-cache
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          BUN_WASM_RUNTIME_PROC_PORT: "4187"
          TMPDIR: ${{ runner.temp }}
        run: |
          source ../env.sh
          bun ../scripts/ci-browser-program.ts verify ../dist/browser-program
          bun ../scripts/run-with-timeout.mts 300 bun tests/bun-runtime-proc-browser.ts ${{ matrix.browser }}
      - name: Native Wasm module and shared-memory worker transfer
        if: needs.rust.result == 'success'
        env:
          BUN_WASM_TRANSFER_ARTIFACT: ${{ github.workspace }}/dist/browser-program/bun-browser.wasm
          TMPDIR: ${{ runner.temp }}
        run: |
          bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --cwd ../tests/fixtures/worker-wasm --frozen-lockfile --ignore-scripts
          bun ../scripts/run-with-timeout.mts 120 bun tests/browser-wasm-transfer.ts ${{ matrix.browser }}
      - uses: ./.github/actions/save-release-downloads

  ci-result:
    name: Code quality
    needs: [quality, jsc-identity, jsc-prebuild, native-quality, rust, package, shared-prebuild, shared-spidermonkey-prebuild, shared-sysroot, web, web-unit, web-browser, process-bundles, browser-guest, browser-process]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - name: Require every selected CI job to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: bun scripts/ci-result.ts

  update-status:
    name: Report automated update statuses
    needs: [quality, jsc-identity, jsc-prebuild, native-quality, rust, package, shared-prebuild, shared-spidermonkey-prebuild, shared-sysroot, web, web-unit, web-browser, process-bundles, browser-guest, browser-process, ci-result]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automation/owned-dependency-updates' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # Dispatch job checks do not satisfy PR requirements. Commit statuses do.
      - name: Report each required result on the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.sha }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          while IFS='|' read -r context job selection; do
            result=$(jq -er --arg job "$job" '.[$job].result' <<< "$RESULTS")
            state=failure
            if [[ "$result" == success ]]; then state=success; fi
            # A classifier-disabled job is an intentional skip, just as in PR CI.
            if [[ "$result" == skipped && -n "$selection" ]] &&
              jq -e --arg selection "$selection" '.quality.result == "success" and .quality.outputs[$selection] == "false"' <<< "$RESULTS" >/dev/null; then
              state=success
            fi
            gh api --method POST "repos/$GH_REPO/statuses/$HEAD" \
              -f context="$context" -f state="$state" -f target_url="$RUN_URL" \
              -f description="Dispatched CI: $result"
          done <<'STATUSES'
          Code quality|ci-result|
          JSC C/C++ prebuild|jsc-prebuild|rust
          Native quality checkpoint|native-quality|rust
          Rust workspace tests (QuickJS host)|rust|rust
          Browser adapter package|package|
          Shared PIC sysroot proof|shared-sysroot|shared
          Web host|web|
          Shared process browser bundles|process-bundles|
          Processes (chromium)|browser-process|
          Processes (firefox)|browser-process|
          Processes (webkit)|browser-process|
          STATUSES
