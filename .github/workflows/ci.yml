name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_HOME: ${{ runner.temp }}/cargo
      RUSTUP_HOME: ${{ runner.temp }}/rustup
      CARGO_TARGET_DIR: ${{ runner.temp }}/quality-target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-15
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install locked JavaScript tools and application dependencies
        run: |
          bun install --frozen-lockfile
          (cd web && bun install --frozen-lockfile)
          (cd sandbox && bun install --frozen-lockfile)
          (cd site && bun install --frozen-lockfile)
      - name: Prepare pinned upstream sources and Rust dependency checker
        run: |
          source env.sh
          bash scripts/sync-bun.sh
          bash scripts/sync-crypto.sh
          cargo install cargo-machete --version 0.9.2 --locked --jobs 1
      - name: Blocking quality gates
        run: |
          source env.sh
          bun run quality

  package:
    name: Browser adapter package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run test
        env:
          TMPDIR: ${{ runner.temp }}

  web:
    name: Web host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Web host unit, type and bundle gates
        run: bash ../scripts/test-web-host.sh --unit
      - name: Install Chromium and WebKit
        run: bunx playwright install --with-deps chromium webkit
      - name: Web host browser gates
        env:
          EDITOR_SCRATCH_ROOT: ${{ runner.temp }}
        run: bash ../scripts/test-web-host.sh --browser

  browser-process:
    name: Processes (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install browser
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Process supervisor, generic preview1 and interrupt gate (no Rust or dist artifacts)
        env:
          PROCESS_SMOKE_PORT: "4186"
          TMPDIR: ${{ runner.temp }}
        run: bun tests/browser-process.ts ${{ matrix.browser }}
      - name: Injected third-party interrupt checks (no Rust or dist artifacts)
        env:
          INTERRUPT_SCRATCH_ROOT: ${{ runner.temp }}
        run: bun tests/browser-interrupt.ts ${{ matrix.browser }}
      - name: Process pipes and runtime_proc guest ABI (no Rust or dist artifacts)
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun tests/browser-runtime-proc.ts ${{ matrix.browser }}
