          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/bin/cargo-machete
            ${{ env.CARGO_TARGET_DIR }}
          key: native-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-tools.outputs.hash }}-${{ steps.native-inputs.outputs.hash }}-${{ hashFiles('.cargo/**', 'rust-toolchain.toml', 'patches/bun/**', 'third_party/**', 'scripts/sync-*.sh', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cc', 'crates/**/*.cpp', 'crates/**/*.hpp', '!crates/bunwasm-cli/build.rs', '!crates/bunwasm-cli/entry-split.c', '!third_party/rquickjs-sys/quickjs/quickjs.c') }}-${{ hashFiles('Cargo.*', 'crates/**', 'third_party/rquickjs-sys/quickjs/quickjs.c', 'tests/fixtures/runtime-proc-spawn-requests.json', 'scripts/quality*.ts', 'scripts/tls-probe*.ts', 'checks/native-probe-*.json', 'tests/native/tls-probe.cpp', 'scripts/build-bun-tools.sh', 'scripts/build-bun-browser.sh', 'scripts/build-bun-core.sh', 'scripts/src/program-profile.ts', 'scripts/guest-core-receipt.ts', 'scripts/guest-source-manifest.ts', 'scripts/waffle-release-inputs.*', '.github/workflows/ci.yml', 'env.sh', 'scripts/build-wasi-sysroot.ts') }}
          restore-keys: |
            native-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-tools.outputs.hash }}-${{ steps.native-inputs.outputs.hash }}-${{ hashFiles('.cargo/**', 'rust-toolchain.toml', 'patches/bun/**', 'third_party/**', 'scripts/sync-*.sh', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cc', 'crates/**/*.cpp', 'crates/**/*.hpp', '!crates/bunwasm-cli/build.rs', '!crates/bunwasm-cli/entry-split.c', '!third_party/rquickjs-sys/quickjs/quickjs.c') }}-
      - uses: actions/cache/restore@v4
        id: native-cache
        if: steps.native-cargo-cache.outputs.cache-matched-key == ''
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/bin/cargo-machete
            ${{ env.CARGO_TARGET_DIR }}
          key: native-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-tools.outputs.hash }}-${{ steps.native-inputs.outputs.hash }}-${{ hashFiles('Cargo.*', '.cargo/**', 'rust-toolchain.toml', 'patches/bun/**', 'third_party/**', 'env.sh', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'scripts/check-wasi-cmake-cache.sh', 'scripts/ci-binaryen.ts') }}-${{ hashFiles('crates/**', 'tests/fixtures/runtime-proc-spawn-requests.json', 'scripts/quality*.ts', 'scripts/tls-probe*.ts', 'checks/native-probe-*.json', 'tests/native/tls-probe.cpp') }}-${{ hashFiles('scripts/build-bun-tools.sh', 'scripts/build-bun-browser.sh', 'scripts/src/program-profile.ts', '.github/workflows/ci.yml', 'scripts/build-wasi-sysroot.ts') }}
          restore-keys: |
            native-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-tools.outputs.hash }}-${{ steps.native-inputs.outputs.hash }}-${{ hashFiles('Cargo.*', '.cargo/**', 'rust-toolchain.toml', 'patches/bun/**', 'third_party/**', 'env.sh', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'scripts/check-wasi-cmake-cache.sh', 'scripts/ci-binaryen.ts') }}-
      - name: Prepare pinned Rust standard-library dependencies
        run: |
          source env.sh
          guest_environment=$(bun scripts/guest-build-receipt.ts environment)
          eval "$guest_environment"
          sysroot=$("$RUSTC" --print sysroot)
          "$GUEST_CARGO" fetch --locked --manifest-path "$sysroot/lib/rustlib/src/rust/library/Cargo.toml" --target wasm32-wasip1
      - name: Install pinned Rust dependency checker
        run: |
          source env.sh
          if ! cargo machete --version 2>/dev/null | command grep -qx '0.9.2'; then
            cargo install cargo-machete --version 0.9.2 --locked --jobs 2
          fi
      - name: Preserve unchanged build-script input timestamps
        run: bun scripts/quality-input-times.ts
      - name: Identify JSC prebuild inputs
        id: jsc-inputs
        env:
          JOBS: "2"
          CAGE: ""
        run: |
          source jsc/common.sh
          copy_jsc_config_inputs
          inputs=$(jsc_inputs_hash)
          echo "hash=$inputs" >> "$GITHUB_OUTPUT"
      - name: Prepare exact TLS Cargo output recording
        env:
          TLS_PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          NATIVE_HOST_TOOLS_HASH: ${{ steps.host-tools.outputs.hash }}
          NATIVE_INPUTS_HASH: ${{ steps.native-inputs.outputs.hash }}
        run: |
          source env.sh
          bun scripts/tls-probe-ci.ts prepare
      - name: Blocking native quality checks
        id: native-producers
        env:
          TLS_PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          NATIVE_HOST_TOOLS_HASH: ${{ steps.host-tools.outputs.hash }}
          NATIVE_INPUTS_HASH: ${{ steps.native-inputs.outputs.hash }}
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          run_native_checks() {
            source env.sh
            export BUNWASM_TLS_CARGO_RECORD_DIR="$CARGO_TARGET_DIR/tls-probe/cargo"
            bun scripts/quality-rust.ts --checks-only
            bun run quality:wasi
            bun test tests/memory-telemetry.test.ts
            # The WASI lint probe rewrites a source file; restore its time before the next build.
            bun scripts/quality-input-times.ts
            source env.sh
            cargo test --locked --release -j 2 -p bunwasm-runtime --no-default-features --features engine-host --lib modules::tests::host_
