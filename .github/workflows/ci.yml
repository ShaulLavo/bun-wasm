name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust workspace tests (QuickJS host)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure portable toolchain homes
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "WASM_TOOLS=$RUNNER_TEMP/wasm-tools" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          git config --global user.name 'bun-wasm CI'
          git config --global user.email 'ci@localhost'
      - name: Install native build tools and pinned Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm clang libclang-dev pkg-config
          rustup show
      - run: bun install --frozen-lockfile
      - name: Prepare pinned upstream sources and configure-time codegen
        run: |
          bash scripts/sync-bun.sh
          bash scripts/sync-crypto.sh
      - name: Test every workspace crate on the host
        # Defaults select QuickJS; JSC's host target links no WASM-only C++ libraries.
        # bunwasm-posix is cfg(wasi), so its WASI-only tests are not host-runnable.
        # The transpile example links a WASI-only upstream executable, not a host test.
        # All workspace tests live in library and binary unit-test targets.
        run: cargo test --workspace --lib --bins --locked --release -j 2
      - name: Install the pinned WASI SDK
        run: |
          mkdir -p "$WASM_TOOLS/wasi-sdk"
          archive="$RUNNER_TEMP/wasi-sdk.tar.gz"
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o "$archive"
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $archive" | sha256sum --check
          tar xzf "$archive" --strip-components=1 -C "$WASM_TOOLS/wasi-sdk"
          rm "$archive"
      - name: Build and run all QuickJS engine fixtures through the native launcher
        run: |
          source env.sh
          export WASI_SDK="$WASI_SDK_PATH"
          bun install --cwd web --frozen-lockfile
          cargo build --release --locked -j 2 -p bunwasm-host
          cargo build --release --locked -j 2 --target wasm32-wasip1 -p bunwasm-cli -p bunwasm-tools
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/wasm32-wasip1/release/"{bun,bun-tools}.wasm dist/
          bash scripts/test.sh --no-build

  package:
    name: Browser adapter package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run test
        env:
          TMPDIR: ${{ runner.temp }}

  web:
    name: Web host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Web host unit, type and bundle gates
        run: bash ../scripts/test-web-host.sh --unit
      - name: Install Chromium and WebKit
        run: bunx playwright install --with-deps chromium webkit
      - name: Web host browser gates
        env:
          EDITOR_SCRATCH_ROOT: ${{ runner.temp }}
        run: bash ../scripts/test-web-host.sh --browser

  browser-process:
    name: Processes (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install browser
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Process supervisor, generic preview1 and interrupt gate (no Rust or dist artifacts)
        env:
          PROCESS_SMOKE_PORT: "4186"
          TMPDIR: ${{ runner.temp }}
        run: bun tests/browser-process.ts ${{ matrix.browser }}
      - name: Injected third-party interrupt checks (no Rust or dist artifacts)
        env:
          INTERRUPT_SCRATCH_ROOT: ${{ runner.temp }}
        run: bun tests/browser-interrupt.ts ${{ matrix.browser }}
      - name: Process pipes and runtime_proc guest ABI (no Rust or dist artifacts)
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun tests/browser-runtime-proc.ts ${{ matrix.browser }}
