name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      jsc: ${{ steps.changes.outputs.jsc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve immutable comparison refs
        id: refs
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-refs.ts >> "$GITHUB_OUTPUT"
      - name: Select native checks from the complete change list
        id: changes
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
        run: bun scripts/ci-changes.ts "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
      - name: Feature PRs preserve current package and workspace versions
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release') && !contains(github.event.pull_request.labels.*.name, 'consumer-pin')
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
        run: bun scripts/feature-versions.ts "$BASE" "$HEAD"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install locked JavaScript tools and application dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          (cd web && bun install --frozen-lockfile)
          (cd sandbox && bun install --frozen-lockfile)
          (cd site && bun install --frozen-lockfile)
      - name: Blocking quality gates
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun run quality --javascript
      - name: Install lightweight CMake preflight tools
        run: |
          if command -v cmake && command -v ninja && command -v g++; then exit 0; fi
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          test -s /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Test CMake cache toolchain preflight
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun scripts/test-checks.ts cmake

  rust:
    name: Rust workspace tests (QuickJS host)
    needs: quality
    if: needs.quality.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      QUALITY_RUST_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      GIT_AUTHOR_NAME: bun-wasm CI
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_NAME: bun-wasm CI
      GIT_COMMITTER_EMAIL: ci@localhost
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable quality toolchain homes
        id: homes
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "WASM_TOOLS=$RUNNER_TEMP/wasm-tools" >> "$GITHUB_ENV"
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: rust-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-15
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - name: Install native build tools
        run: |
          if command -v cmake && command -v ninja && command -v nasm && command -v clang && command -v pkg-config &&
             command -v ruby && command -v gperf && command -v bison &&
             ldconfig -p | grep -E 'libclang(-[0-9]+)?\.so' > /dev/null; then exit 0; fi
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          test -s /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm clang libclang-dev pkg-config ruby gperf bison
      - uses: actions/cache@v4
        id: sdk
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: wasi-sdk-34.0-stock-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned WASI SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/wasi-sdk-34.tar.gz"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --silent --show-error \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
            -o "$archive"
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $archive" | sha256sum --check
          mkdir -p "$WASM_TOOLS/wasi-sdk"
          tar -xzf "$archive" --strip-components=1 -C "$WASM_TOOLS/wasi-sdk"
      - uses: actions/cache@v4
        with:
          path: ${{ env.WASM_TOOLS }}/binaryen-version_133-x86_64-linux.tar.gz
          key: binaryen-133-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-binaryen.ts') }}
      - name: Install pinned Binaryen
        run: bun scripts/ci-binaryen.ts
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: |
            vendor/bun
            vendor/boringssl
          key: native-sources-${{ runner.os }}-${{ hashFiles('scripts/sync-*.sh', 'patches/**') }}
      - name: Prepare pinned upstream sources
        run: |
          source env.sh
          bash scripts/sync-bun.sh
          bash scripts/sync-crypto.sh
      - uses: actions/cache/restore@v4
        id: native-cargo-cache
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/bin/cargo-machete
            ${{ env.CARGO_TARGET_DIR }}
          key: native-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.homes.outputs.image }}-${{ hashFiles('.github/workflows/ci.yml', '.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'env.sh', 'bun.lock', 'scripts/sync-*.sh', 'scripts/build-wasi-sysroot.ts', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cc', 'crates/**/*.cpp', 'crates/**/*.hpp') }}-${{ hashFiles('Cargo.*', 'crates/**', 'tests/fixtures/runtime-proc-spawn-requests.json', 'scripts/quality*.ts', 'scripts/build-bun-tools.sh') }}
          restore-keys: |
            native-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.homes.outputs.image }}-${{ hashFiles('.github/workflows/ci.yml', '.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'env.sh', 'bun.lock', 'scripts/sync-*.sh', 'scripts/build-wasi-sysroot.ts', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cc', 'crates/**/*.cpp', 'crates/**/*.hpp') }}-
      - uses: actions/cache/restore@v4
        id: native-cache
        if: steps.native-cargo-cache.outputs.cache-matched-key == ''
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/bin/cargo-machete
            ${{ env.CARGO_TARGET_DIR }}
          key: native-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.homes.outputs.image }}-${{ hashFiles('Cargo.*', '.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'env.sh', 'bun.lock', 'scripts/build-wasi-sysroot.ts', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'scripts/check-wasi-cmake-cache.sh', 'scripts/ci-binaryen.ts') }}-${{ hashFiles('crates/**', 'tests/fixtures/runtime-proc-spawn-requests.json', 'scripts/quality*.ts') }}-${{ hashFiles('scripts/build-bun-tools.sh', '.github/workflows/ci.yml') }}
          restore-keys: |
            native-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.homes.outputs.image }}-${{ hashFiles('Cargo.*', '.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'env.sh', 'bun.lock', 'scripts/build-wasi-sysroot.ts', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'scripts/check-wasi-cmake-cache.sh', 'scripts/ci-binaryen.ts') }}-
      - name: Install pinned Rust dependency checker
        run: |
          source env.sh
          if ! cargo machete --version 2>/dev/null | command grep -qx '0.9.2'; then
            cargo install cargo-machete --version 0.9.2 --locked --jobs 2
          fi
      - uses: actions/cache@v4
        with:
          path: ${{ env.WASM_TOOLS }}/bun-wasm-sysroot-patched
          key: wasi-sysroot-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.homes.outputs.image }}-${{ hashFiles('scripts/build-wasi-sysroot.ts', 'bun.lock', 'env.sh') }}
      - name: Build patched WASI sysroot
        run: |
          source env.sh
          time bun scripts/build-wasi-sysroot.ts
      - name: Preserve unchanged build-script input timestamps
        run: bun scripts/quality-input-times.ts
      - name: Configure private JSC build paths
        if: needs.quality.outputs.jsc == 'true'
        run: |
          echo "JSC_BUILD_DIR=$RUNNER_TEMP/jsc/prebuild" >> "$GITHUB_ENV"
          echo "JSC_CARGO_TARGET_DIR=$RUNNER_TEMP/jsc/target" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        if: needs.quality.outputs.jsc == 'true'
        id: jsc-prebuild-cache
        with:
          path: ${{ runner.temp }}/jsc/prebuild
          key: jsc-prebuild-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.homes.outputs.image }}-${{ hashFiles('jsc/**', 'scripts/build-jsc.sh', 'scripts/build-wasi-sysroot.ts', 'scripts/check-wasi-cmake-cache.sh', 'scripts/check-cmake-cache.cmake', 'env.sh', 'bun.lock', 'scripts/ci-binaryen.ts') }}
      - uses: actions/cache/restore@v4
        if: needs.quality.outputs.jsc == 'true'
        id: jsc-cargo-cache
        with:
          path: ${{ runner.temp }}/jsc/target
          key: jsc-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.homes.outputs.image }}-${{ hashFiles('jsc/**', 'scripts/build-jsc.sh', 'scripts/build-wasi-sysroot.ts', 'scripts/check-wasi-cmake-cache.sh', 'scripts/check-cmake-cache.cmake', 'env.sh', 'bun.lock', 'scripts/ci-binaryen.ts') }}-${{ hashFiles('scripts/build-bun-jsc.sh', 'scripts/sync-*.sh', 'Cargo.*', '.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'env.sh', 'bun.lock', 'scripts/build-wasi-sysroot.ts', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'crates/**', 'tests/fixtures/runtime-proc-spawn-requests.json', 'scripts/quality*.ts') }}
      - name: Blocking native checks with one owned JSC prebuild
        shell: bash
        env:
          CI_JSC_SELECTED: ${{ needs.quality.outputs.jsc }}
          CI_JSC_PREBUILD_HIT: ${{ steps.jsc-prebuild-cache.outputs.cache-hit }}
        run: |
          run_jsc_prebuild() {
            source env.sh
            export JOBS=2 CAGE=
            if [[ "$CI_JSC_PREBUILD_HIT" == 'true' ]]; then
              source jsc/common.sh
              check_jsc_inputs_stamp
            else
              bash scripts/build-jsc.sh
            fi
          }
          guest_inputs=
          run_native_checks() {
            source env.sh
            bun run quality --native
            source env.sh
            cargo test --locked --release -j 2 -p bunwasm-runtime --no-default-features --features engine-host --lib modules::tests::host_
            source env.sh
            bun scripts/quality-input-times.ts
            export WASI_SDK="$WASI_SDK_PATH"
            bun install --cwd web --frozen-lockfile
            cargo build --release --locked -j 2 -p bunwasm-host
            guest_environment=$(bun scripts/guest-build-receipt.ts environment)
            eval "$guest_environment"
            guest_inputs=$(mktemp "${TMPDIR}/bun-wasm-guest-inputs-XXXXXX")
            bun scripts/guest-build-receipt.ts inputs quickjs > "$guest_inputs"
            "$GUEST_CARGO" build --release --locked -j 2 --target wasm32-wasip1 -p bunwasm-cli
            mkdir -p dist
            cp "$CARGO_TARGET_DIR/wasm32-wasip1/release/bun.wasm" dist/
            bun scripts/guest-build-receipt.ts write dist/bun.wasm "$guest_inputs"
            rm -f -- "$guest_inputs"
            guest_inputs=
            bun scripts/test-checks.ts native
            BUN_WASM_LAUNCHER="$CARGO_TARGET_DIR/release/bun-wasm" bun tests/install/package-options.ts
          }
          jsc_pid=
          jsc_log="$RUNNER_TEMP/jsc-prebuild.log"
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            # $! also covers a signal between the fork and PID assignment.
            jsc_pid=${jsc_pid:-${!:-}}
            if [[ -n "$jsc_pid" ]]; then
              kill -TERM -- "-$jsc_pid" 2>/dev/null || true
              kill -KILL -- "-$jsc_pid" 2>/dev/null || true
              wait "$jsc_pid" 2>/dev/null || true
            fi
            if [[ -n "$guest_inputs" ]]; then rm -f -- "$guest_inputs" || true; fi
            if [[ -f "$jsc_log" ]]; then cat "$jsc_log" || true; fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          if [[ "$CI_JSC_SELECTED" == 'true' ]]; then
            # Only this child owns a process group; its descendants inherit it.
            set -m
            (
              set +m
              trap - EXIT INT TERM
              run_jsc_prebuild
            ) > "$jsc_log" 2>&1 &
            jsc_pid=$!
            set +m
          fi
          run_native_checks
          if [[ -n "$jsc_pid" ]]; then
            wait "$jsc_pid"
          fi
      - name: Blocking JSC embedding and allocation checks
        if: needs.quality.outputs.jsc == 'true'
        env:
          JOBS: "2"
          CAGE: ""
        run: |
          source env.sh
          bash scripts/build-bun-jsc.sh
          bun scripts/jsc-embedding.ts test dist/bun-jsc.wasm
      - uses: actions/upload-artifact@v4
        if: always() && needs.quality.outputs.jsc == 'true'
        with:
          name: jsc-embedding-receipts
          path: |
            dist/bun-jsc.wasm.build.json
            dist/bun-jsc.wasm.embedding.json
          if-no-files-found: error

      - name: Build one host-engine guest for real-browser source cache acceptance
        run: |
          source env.sh
          export WASI_SDK="$WASI_SDK_PATH"
          guest_environment=$(bun scripts/guest-build-receipt.ts environment)
          eval "$guest_environment"
          inputs=$(mktemp "${TMPDIR}/bun-wasm-guest-inputs-XXXXXX")
          trap 'rm -f -- "$inputs"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          bun scripts/guest-build-receipt.ts inputs source-cache-browser > "$inputs"
          "$GUEST_CARGO" build --release --locked -j 2 --target wasm32-wasip1 -p bunwasm-cli --no-default-features --features engine-host,bun-build
          mkdir -p dist/source-cache-browser
          cp "$CARGO_TARGET_DIR/wasm32-wasip1/release/bun.wasm" dist/source-cache-browser/bun-browser.wasm
          bun scripts/guest-build-receipt.ts write dist/source-cache-browser/bun-browser.wasm "$inputs"
          git rev-parse HEAD HEAD^{tree} > dist/source-cache-browser/source.txt
          sha256sum dist/source-cache-browser/bun-browser.wasm >> dist/source-cache-browser/source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-cache-browser-guest
          path: dist/source-cache-browser/
          if-no-files-found: error
          retention-days: 1

      - name: Build the single tools fixture in the existing native target
        run: |
          source env.sh
          TOOLS_CARGO_TARGET_DIR="$CARGO_TARGET_DIR" JOBS=2 bash scripts/build-bun-tools.sh
      - name: Blocking Web guest cases (QuickJS and host engine)
        shell: bash
        run: |
          source env.sh
          ln -s source-cache-browser/bun-browser.wasm dist/bun-browser.wasm
          ln -s source-cache-browser/bun-browser.wasm.build.json dist/bun-browser.wasm.build.json
          bun scripts/test-web-guests.ts quickjs browser 2>&1 | tee dist/web-guests-quickjs-browser.log
      - name: Blocking Web guest case (JSC)
        if: needs.quality.outputs.jsc == 'true'
        shell: bash
        run: |
          source env.sh
          bun scripts/test-web-guests.ts jsc 2>&1 | tee dist/web-guests-jsc.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-guest-fixture-receipts
          path: |
            dist/*.wasm.build.json
            dist/web-guests-*.log
            ${{ runner.temp }}/jsc-prebuild.log
          if-no-files-found: error
          retention-days: 1

      - name: Save the JSC prebuild cache once per input revision
        if: needs.quality.outputs.jsc == 'true' && steps.jsc-prebuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/jsc/prebuild
          key: jsc-prebuild-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.homes.outputs.image }}-${{ hashFiles('jsc/**', 'scripts/build-jsc.sh', 'scripts/build-wasi-sysroot.ts', 'scripts/check-wasi-cmake-cache.sh', 'scripts/check-cmake-cache.cmake', 'env.sh', 'bun.lock', 'scripts/ci-binaryen.ts') }}

      - name: Save the JSC Cargo cache once per input revision
        if: needs.quality.outputs.jsc == 'true' && steps.jsc-cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/jsc/target
          key: jsc-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.homes.outputs.image }}-${{ hashFiles('jsc/**', 'scripts/build-jsc.sh', 'scripts/build-wasi-sysroot.ts', 'scripts/check-wasi-cmake-cache.sh', 'scripts/check-cmake-cache.cmake', 'env.sh', 'bun.lock', 'scripts/ci-binaryen.ts') }}-${{ hashFiles('scripts/build-bun-jsc.sh', 'scripts/sync-*.sh', 'Cargo.*', '.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'env.sh', 'bun.lock', 'scripts/build-wasi-sysroot.ts', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'crates/**', 'tests/fixtures/runtime-proc-spawn-requests.json', 'scripts/quality*.ts') }}

      - name: Save the refined native Cargo cache once per input revision
        if: steps.native-cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/bin/cargo-machete
            ${{ env.CARGO_TARGET_DIR }}
          key: native-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.homes.outputs.image }}-${{ hashFiles('.github/workflows/ci.yml', '.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'env.sh', 'bun.lock', 'scripts/sync-*.sh', 'scripts/build-wasi-sysroot.ts', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'crates/**/build.rs', 'crates/**/*.c', 'crates/**/*.h', 'crates/**/*.cc', 'crates/**/*.cpp', 'crates/**/*.hpp') }}-${{ hashFiles('Cargo.*', 'crates/**', 'tests/fixtures/runtime-proc-spawn-requests.json', 'scripts/quality*.ts', 'scripts/build-bun-tools.sh') }}

      - name: Save the complete native fallback once per input revision
        if: steps.native-cargo-cache.outputs.cache-matched-key == '' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/bin/cargo-machete
            ${{ env.CARGO_TARGET_DIR }}
          key: native-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.homes.outputs.image }}-${{ hashFiles('Cargo.*', '.cargo/**', 'rust-toolchain.toml', 'patches/**', 'third_party/**', 'env.sh', 'bun.lock', 'scripts/build-wasi-sysroot.ts', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'scripts/check-wasi-cmake-cache.sh', 'scripts/ci-binaryen.ts') }}-${{ hashFiles('crates/**', 'tests/fixtures/runtime-proc-spawn-requests.json', 'scripts/quality*.ts') }}-${{ hashFiles('scripts/build-bun-tools.sh', '.github/workflows/ci.yml') }}

  package:
    name: Browser adapter package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Test vectored reads and browser dependency resolution
        run: bun scripts/test-checks.ts package-extra

  web:
    name: Web host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Web host unit, CLI shim, type and bundle gates
        run: bash ../scripts/test-web-host.sh --unit
      - name: Use Ubuntu HTTPS archives for browser dependencies
        run: |
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          test -s /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
      - name: Identify browser setup cache inputs
        id: browser-image
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: ${{ runner.temp }}/browser-apt/*.deb
          key: browser-apt-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.browser-image.outputs.image }}-chromium-webkit-${{ hashFiles('web/bun.lock', 'web/scripts/ci-browser-deps.ts') }}
      - name: Prefetch and install verified browser system packages
        run: bun scripts/ci-browser-deps.ts chromium webkit
      - uses: actions/cache/save@v4
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/browser-apt/*.deb
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Install Chromium and WebKit
        run: bunx playwright install chromium webkit
      - name: Web host browser gates
        env:
          EDITOR_SCRATCH_ROOT: ${{ runner.temp }}
        run: bash ../scripts/test-web-host.sh --browser

  process-bundles:
    name: Shared process browser bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --cwd web --frozen-lockfile --linker=isolated
      - name: Build each process fixture once for all browsers
        run: bun web/scripts/ci-process-bundles.ts "$RUNNER_TEMP/process-bundles"
      - uses: actions/upload-artifact@v4
        with:
          name: process-bundles
          path: ${{ runner.temp }}/process-bundles
          retention-days: 1
          if-no-files-found: error

  browser-process:
    needs: [quality, rust, process-bundles]
    if: ${{ !cancelled() && needs.quality.result == 'success' && needs.process-bundles.result == 'success' && (needs.rust.result == 'success' || needs.rust.result == 'skipped') }}
    name: Processes (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: process-bundles
          path: ${{ runner.temp }}/process-bundles
      - run: bun install --frozen-lockfile --linker=isolated
      - name: Use Ubuntu HTTPS archives for browser dependencies
        run: |
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          test -s /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
      - name: Identify browser setup cache inputs
        id: browser-image
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: ${{ runner.temp }}/browser-apt/*.deb
          key: browser-apt-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.browser-image.outputs.image }}-${{ matrix.browser }}-${{ hashFiles('web/bun.lock', 'web/scripts/ci-browser-deps.ts') }}
      - name: Prefetch and install verified browser system packages
        run: bun scripts/ci-browser-deps.ts ${{ matrix.browser }}
      - uses: actions/cache/save@v4
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/browser-apt/*.deb
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Install browser
        run: bunx playwright install ${{ matrix.browser }}
      - name: Process supervisor, generic preview1 and interrupt gate (no Rust or dist artifacts)
        env:
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          PROCESS_SMOKE_PORT: "4186"
          TMPDIR: ${{ runner.temp }}
        run: bun ../scripts/run-with-timeout.mts 300 bun tests/browser-process.ts ${{ matrix.browser }}
      - name: Injected third-party interrupt checks (no Rust or dist artifacts)
        env:
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          INTERRUPT_SCRATCH_ROOT: ${{ runner.temp }}
        run: bun ../scripts/run-with-timeout.mts 300 bun tests/browser-interrupt.ts ${{ matrix.browser }}
      - name: Process pipes, CLI ABI and foreground stop (isolated install, no Rust or dist artifacts)
        env:
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          TMPDIR: ${{ runner.temp }}
          BUN_WASM_RUNTIME_PROC_BUNDLE: ${{ runner.temp }}/process-bundles/runtime-proc
        run: bun ../scripts/run-with-timeout.mts 300 bun tests/browser-runtime-proc.ts ${{ matrix.browser }}

      - uses: actions/download-artifact@v4
        if: needs.rust.result == 'success'
        with:
          name: source-cache-browser-guest
          path: dist/source-cache-browser
      - name: Real Bun source cache in one Waffle browser runtime
        if: needs.rust.result == 'success'
        env:
          BUN_WASM_RUNTIME_PROC_ARTIFACT: ${{ github.workspace }}/dist/source-cache-browser/bun-browser.wasm
          BUN_WASM_RUNTIME_PROC_SCENARIO: source-cache
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          BUN_WASM_RUNTIME_PROC_PORT: "4187"
          TMPDIR: ${{ runner.temp }}
        run: bun ../scripts/run-with-timeout.mts 300 bun tests/bun-runtime-proc-browser.ts ${{ matrix.browser }}
