name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Runtime type check
        run: node_modules/.bin/tsc -p ../crates/bunwasm-runtime/tsconfig.json
      - name: Runtime emission and native type regressions
        run: bun test ../scripts/runtime-emission.test.ts ../scripts/runtime-types.test.ts
      - name: Unit tests
        run: bun run test
      - name: Type check
        run: bun run check
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser host smoke (no Rust or dist artifacts)
        env:
          SMOKE_PORT: "4179"
        run: |
          listeners=$(ss -H -ltn "sport = :$SMOKE_PORT")
          test -z "$listeners"
          bun run test:browser
