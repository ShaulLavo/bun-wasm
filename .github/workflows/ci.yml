      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        if: needs.selection.outputs.jsc == 'true'
        with:
          name: ordinary-jsc-program
          path: ${{ runner.temp }}/ordinary-jsc-program
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: ordinary-spidermonkey-program
          path: ${{ runner.temp }}/ordinary-spidermonkey-program
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: native-profile-launcher
          path: ${{ runner.temp }}/ordinary-native-launcher
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: ordinary-native-bundle
          path: ${{ runner.temp }}/ordinary-native-bundle
      - name: Verify and stage the ordinary runtime deliveries
        env:
          JSC_SELECTED: ${{ needs.selection.outputs.jsc }}
        run: |
          source env.sh
          case "$JSC_SELECTED" in
            true) bun scripts/ci-ordinary-web-inputs.ts "$RUNNER_TEMP/ordinary-browser-program" true "$RUNNER_TEMP/ordinary-jsc-program" "$RUNNER_TEMP/ordinary-native-launcher" ;;
            false)
              bun scripts/ci-ordinary-web-inputs.ts "$RUNNER_TEMP/ordinary-browser-program" false
              test "$(cat "$RUNNER_TEMP/ordinary-native-launcher/source.txt")" = "$GITHUB_SHA"
              chmod +x "$RUNNER_TEMP/ordinary-native-launcher/bun-wasm"
              ;;
            *) exit 1 ;;
          esac
          bundle_dir="$RUNNER_TEMP/ordinary-native-unpacked"
          mkdir -p "$bundle_dir"
          zstd -dc "$RUNNER_TEMP/ordinary-native-bundle/bundle.tar.zst" | tar --posix -C "$bundle_dir" -xf -
          test "$(cat "$bundle_dir/source.txt")" = "$GITHUB_SHA"
          cp "$bundle_dir/dist/bash-web-shell.wasm" "$bundle_dir/dist/bash-web-env.wasm" "$bundle_dir/dist/bash-web-guests.json" dist/
          sm_pair="$RUNNER_TEMP/ordinary-spidermonkey-program"
          bun scripts/spidermonkey-side-core-receipt.ts verify-pair \
            "$sm_pair/bun-spidermonkey.wasm" "$sm_pair/spidermonkey-engine.wasm" \
            "$sm_pair/bun-spidermonkey.wasm.spidermonkey.json" "$sm_pair/inputs.json"
          sm_build="$RUNNER_TEMP/spidermonkey/ordinary"
          mkdir -p "$sm_build/obj/js/src" "$sm_build/obj/dist"
          ln -s "$bundle_dir/spidermonkey-native/libspidermonkey_bunwasm.a" "$sm_build/libspidermonkey_bunwasm.a"
          ln -s "$bundle_dir/spidermonkey-native/js-confdefs.h" "$sm_build/obj/js/src/js-confdefs.h"
          ln -s "$bundle_dir/spidermonkey-native/include" "$sm_build/obj/dist/include"
          echo "BUN_WASM_LAUNCHER=$RUNNER_TEMP/ordinary-native-launcher/bun-wasm" >> "$GITHUB_ENV"
          echo "BUN_WASM_SHELL=$GITHUB_WORKSPACE/dist/bash-web-shell.wasm" >> "$GITHUB_ENV"
          echo "BUN_WASM_ENV_UTILITY=$GITHUB_WORKSPACE/dist/bash-web-env.wasm" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_WASM=$sm_pair/bun-spidermonkey.wasm" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_NATIVE_DIR=$bundle_dir/spidermonkey-native" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_BUILD_DIR=$sm_build" >> "$GITHUB_ENV"
      - name: Blocking native runtime checks
        env:
          BUN_WASM_RUNTIME_JOBS: "3"
          BUN_WASM_RUNTIME_BATCH: default
          INSTALL_ENGINES: ${{ needs.selection.outputs.jsc == 'true' && 'quickjs,jsc,browser' || 'quickjs,browser' }}
          BUN_WASM_CHECK_ENGINES: ${{ needs.selection.outputs.jsc == 'true' && 'quickjs,jsc,browser,spidermonkey' || 'quickjs,browser,spidermonkey' }}
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          source env.sh
          export WASI_SDK="$WASI_SDK_PATH"
          bun scripts/test-checks.ts native --only runtime
      - name: Blocking JSC embedding and allocation checks
        if: needs.selection.outputs.jsc == 'true'
        run: |
          source env.sh
          bun scripts/jsc-embedding.ts fixtures dist/bun-jsc.wasm 2>&1 | tee dist/jsc-embedding-fixtures.log
      - name: Blocking Web guest cases (QuickJS and host engine)
        run: |
          source env.sh
          bun scripts/test-web-guests.ts quickjs browser 2>&1 | tee dist/web-guests-quickjs-browser.log
      - name: Blocking Web guest case (JSC)
        if: needs.selection.outputs.jsc == 'true'
        run: |
          source env.sh
          bun scripts/test-web-guests.ts jsc 2>&1 | tee dist/web-guests-jsc.log
      - name: Retain ordinary Web guest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: ordinary-web-guest-diagnostics
          path: dist/*.log
          if-no-files-found: ignore
          retention-days: 1

  rust-fixtures:
    name: Native fixture and install tests
    needs: [selection, ordinary-build]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.selection.outputs.rust == 'true' || (github.event_name != 'pull_request' && needs.selection.outputs.rust == 'false' && needs.selection.outputs.browser_guest == 'true')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure fixture paths
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "WASM_TOOLS=$RUNNER_TEMP/wasm-tools" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-downloads
        with:
          scope: rust
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --ignore-scripts
      - uses: actions/cache/restore@v4
        id: wasmtime-cache
        with:
          path: ${{ env.WASM_TOOLS }}/wasmtime-v49.0.3-x86_64-linux.tar.xz
          key: wasmtime-49.0.3-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Wasmtime
        run: |
          mkdir -p "$WASM_TOOLS"
          archive="$WASM_TOOLS/wasmtime-v49.0.3-x86_64-linux.tar.xz"
          stage=$(mktemp -d "$WASM_TOOLS/.wasmtime-XXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          input="$archive"
          if [[ ! -f "$input" ]]; then
            input="$stage/archive.tar.xz"
            bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
              https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.3/wasmtime-v49.0.3-x86_64-linux.tar.xz "$input"
          fi
          echo "4001225413f208345b980525f31c4080e1873808b38d0ddc7918497340667fbb  $input" | sha256sum --check
          if [[ "$input" != "$archive" ]]; then mv "$input" "$archive"; fi
          tar -xJf "$archive" --strip-components=1 -C "$stage"
          test "$("$stage/wasmtime" --version)" = "wasmtime 49.0.3 (f96eabaa1 2026-10-14)"
          mkdir -p "$WASM_TOOLS/wasmtime"
          mv "$stage/wasmtime" "$WASM_TOOLS/wasmtime/wasmtime"
          echo "$WASM_TOOLS/wasmtime" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-program
          path: ${{ runner.temp }}/ordinary-browser-program
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        if: needs.selection.outputs.jsc == 'true'
        with:
          name: ordinary-jsc-program
          path: ${{ runner.temp }}/ordinary-jsc-program
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: ordinary-spidermonkey-program
          path: ${{ runner.temp }}/ordinary-spidermonkey-program
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: native-profile-launcher
          path: ${{ runner.temp }}/ordinary-native-launcher
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: ordinary-native-bundle
          path: ${{ runner.temp }}/ordinary-native-bundle
      - name: Verify and stage fixture binaries
        env:
          JSC_SELECTED: ${{ needs.selection.outputs.jsc }}
        run: |
          source env.sh
          bun scripts/ci-browser-program.ts verify "$RUNNER_TEMP/ordinary-browser-program"
          mkdir -p dist
          cp "$RUNNER_TEMP/ordinary-browser-program"/*.wasm "$RUNNER_TEMP/ordinary-browser-program"/*.json dist/
          if [[ "$JSC_SELECTED" == true ]]; then
            bun scripts/ci-ordinary-jsc-program.ts verify "$RUNNER_TEMP/ordinary-jsc-program"
            cp "$RUNNER_TEMP/ordinary-jsc-program"/*.wasm "$RUNNER_TEMP/ordinary-jsc-program"/*.json dist/
          fi
          test "$(cat "$RUNNER_TEMP/ordinary-native-launcher/source.txt")" = "$GITHUB_SHA"
          chmod +x "$RUNNER_TEMP/ordinary-native-launcher/bun-wasm"
          bundle_dir="$RUNNER_TEMP/ordinary-native-unpacked"
          mkdir -p "$bundle_dir"
          zstd -dc "$RUNNER_TEMP/ordinary-native-bundle/bundle.tar.zst" | tar --posix -C "$bundle_dir" -xf -
          test "$(cat "$bundle_dir/source.txt")" = "$GITHUB_SHA"
          cp "$bundle_dir/dist/bash-web-shell.wasm" "$bundle_dir/dist/bash-web-env.wasm" "$bundle_dir/dist/bash-web-guests.json" dist/
          sm_pair="$RUNNER_TEMP/ordinary-spidermonkey-program"
          bun scripts/spidermonkey-side-core-receipt.ts verify-pair \
            "$sm_pair/bun-spidermonkey.wasm" "$sm_pair/spidermonkey-engine.wasm" \
            "$sm_pair/bun-spidermonkey.wasm.spidermonkey.json" "$sm_pair/inputs.json"
          echo "BUN_WASM_LAUNCHER=$RUNNER_TEMP/ordinary-native-launcher/bun-wasm" >> "$GITHUB_ENV"
          echo "BUN_WASM_SHELL=$GITHUB_WORKSPACE/dist/bash-web-shell.wasm" >> "$GITHUB_ENV"
          echo "BUN_WASM_ENV_UTILITY=$GITHUB_WORKSPACE/dist/bash-web-env.wasm" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_WASM=$sm_pair/bun-spidermonkey.wasm" >> "$GITHUB_ENV"
      - name: Blocking native fixture and install checks
        env:
          INSTALL_ENGINES: ${{ needs.selection.outputs.jsc == 'true' && 'quickjs,jsc,browser' || 'quickjs,browser' }}
          BUN_WASM_CHECK_ENGINES: ${{ needs.selection.outputs.jsc == 'true' && 'quickjs,jsc,browser,spidermonkey' || 'quickjs,browser,spidermonkey' }}
        run: |
          source env.sh
          bun scripts/test-checks.ts native --only fixtures
          bun tests/install/package-options.ts &
          pid_options=$!
          bun tests/install/root-overrides.ts &
          pid_overrides=$!
          status=0
          wait "$pid_options" || status=$?
          wait "$pid_overrides" || status=$?
          exit "$status"

  browser-guest:
    needs: [selection, ordinary-build, web-browser]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.selection.outputs.browser_guest == 'true' }}
    name: Browser guest (${{ matrix.browser }}, ${{ matrix.batch }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.browser-guest-matrix) }}
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        working-directory: web
    steps:
      - name: Start the shared setup clock
        working-directory: ${{ runner.temp }}
        run: echo "BROWSER_GUEST_SETUP_STARTED=$EPOCHSECONDS" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --linker=isolated
      - uses: ./.github/actions/browser-deps
        with:
          browsers: ${{ matrix.browser == 'chromium' && 'chromium firefox' || matrix.browser }}
      - name: Install browser
        run: bunx playwright install ${{ matrix.browser == 'chromium' && 'chromium firefox' || matrix.browser }}
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-guest-site
          path: ${{ runner.temp }}/browser-guest-site
      - name: Run Browser guest batches on the verified site
        env:
          BROWSER_GUEST_BATCHES: ${{ toJSON(matrix.batches) }}
          BUN_WASM_BROWSER_COVERAGE_SELECTION: ${{ needs.selection.outputs.browser-coverage-selection }}
          BUN_WASM_BROWSER_SITE: ${{ runner.temp }}/browser-guest-site
          BUN_WASM_BROWSER_REPORT_DIR: ${{ runner.temp }}/browser-guest-diagnostics
          BUN_WASM_TEST_BROWSERS: ${{ matrix.browser }}
          BUN_WASM_JSC_PRODUCER: ${{ needs.selection.outputs.jsc == 'true' && 'selected' || 'unselected' }}
          # Both producers bundle their ordinary SpiderMonkey pair with the interruption entries.
          BUN_WASM_INTERRUPTION_SPIDERMONKEY: required
          TMPDIR: ${{ runner.temp }}
        run: |
          bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --cwd .. --frozen-lockfile --ignore-scripts
          source ../env.sh
          bun ../scripts/ci-browser-guest-run.ts
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        if: matrix.batch == 'storage'
        with:
          name: process-bundles
          path: ${{ runner.temp }}/process-bundles
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        if: matrix.batch == 'storage'
        with:
          name: browser-program
          path: dist/browser-program
      - name: Real Bun source cache and worker transfer checks
        if: matrix.batch == 'storage'
        env:
          BUN_WASM_RUNTIME_PROC_ARTIFACT: ${{ github.workspace }}/dist/browser-program/bun-browser.wasm
          BUN_WASM_RUNTIME_PROC_SCENARIO: source-cache
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          BUN_WASM_RUNTIME_PROC_PORT: "4187"
          BUN_WASM_TRANSFER_ARTIFACT: ${{ github.workspace }}/dist/browser-program/bun-browser.wasm
          TMPDIR: ${{ runner.temp }}
        run: |
          source ../env.sh
          bun ../scripts/ci-browser-program.ts verify ../dist/browser-program
          bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --cwd ../tests/fixtures/worker-wasm --frozen-lockfile --ignore-scripts
          browsers=(${{ matrix.browser == 'chromium' && 'chromium firefox' || matrix.browser }})
          for b in "${browsers[@]}"; do
            bun ../scripts/run-with-timeout.mts 300 bun tests/bun-runtime-proc-browser.ts "$b"
            bun ../scripts/run-with-timeout.mts 120 bun tests/browser-wasm-transfer.ts "$b"
          done
      - name: Retain Browser guest diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-guest-diagnostics-${{ matrix.browser }}-${{ matrix.batch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-guest-diagnostics
          if-no-files-found: ignore
          retention-days: 1
      - uses: ./.github/actions/save-release-downloads

  shared-consumers:
    name: Shared native and Browser (${{ matrix.group }})
    needs: [selection, ordinary-build, shared-sysroot]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.selection.outputs.shared-native == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [quickjs-jsc, spidermonkey]
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    env:
      SHARED_CHECK_SECONDS: 1800
    steps:
      - name: Start the shared setup clock
        timeout-minutes: 1
        working-directory: ${{ runner.temp }}
        run: echo "SHARED_STARTED=$EPOCHSECONDS" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install shared check dependencies
        run: |
          bun scripts/ci-install.ts --frozen-lockfile --ignore-scripts
          bun scripts/ci-install.ts --cwd web --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-guest-site
          path: ${{ runner.temp }}/shared-playground-site
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          pattern: shared-*-program
          path: ${{ runner.temp }}/shared-program-downloads
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: native-profile-launcher
          path: ${{ runner.temp }}/native-profile-launcher
      - name: Prepare and verify same-source shared proof inputs
        run: |
          source env.sh
          test "$(cat "$RUNNER_TEMP/native-profile-launcher/source.txt")" = "$GITHUB_SHA"
          chmod +x "$RUNNER_TEMP/native-profile-launcher/bun-wasm"
          downloads="$RUNNER_TEMP/shared-program-downloads"
          programs="$RUNNER_TEMP/shared-programs"
          shopt -s globstar nullglob
          spidermonkey=("$downloads/shared-spidermonkey-program"/**/shared-native/program-spidermonkey)
          [[ ${#spidermonkey[@]} == 1 ]]
          mkdir "$programs"
          mv "$downloads/shared-quickjs-program" "$programs/program"
          mv "$downloads/shared-jsc-program" "$programs/program-jsc"
          mv "${spidermonkey[0]}" "$programs/program-spidermonkey"
          bun scripts/ci-shared-proof-inputs.ts prepare "$RUNNER_TEMP/shared-proof-inputs" "$programs" "$RUNNER_TEMP/shared-playground-site"
          bun scripts/ci-shared-proof-inputs.ts verify "$RUNNER_TEMP/shared-proof-inputs"
      - uses: ./.github/actions/browser-deps
        with:
          browsers: chromium
      - name: Install Chromium
        working-directory: web
        run: bunx playwright install chromium
      - name: Consume the discovered shared native and Browser checks
        id: shared-checks
        env:
          SHARED_PROOF_INPUTS_DIR: ${{ runner.temp }}/shared-proof-inputs
          BUN_WASM_LAUNCHER: ${{ runner.temp }}/native-profile-launcher/bun-wasm
        run: |
          source env.sh
          bun scripts/ci-shared-consumer-run.ts "${{ matrix.group }}"
      # Chromium's renderer has crashed here with only "Target crashed" in the log. The kernel
      # log tells a memory kill from a renderer fault.
      - name: Show kernel memory kills and faults after a failure
        if: failure() && steps.shared-checks.outcome != 'success'
        run: |
          free -m
          sudo dmesg --ctime | grep -iE 'out of memory|oom|killed process|segfault|traps:' | tail -n 50 || true

  ci-result:
    name: Code quality
    needs: [selection, quality, web-unit, web-browser, native-quality, ordinary-build, rust, rust-fixtures, shared-sysroot, browser-guest, shared-consumers]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - name: Require every selected CI job to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          BROWSER_GUEST_MATRIX: ${{ needs.selection.outputs.browser-guest-matrix }}
        run: bun scripts/ci-result.ts

  update-status:
    name: Report automated update statuses
    needs: [selection, quality, web-unit, web-browser, native-quality, ordinary-build, rust, rust-fixtures, shared-sysroot, browser-guest, shared-consumers, ci-result]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automation/owned-dependency-updates' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # Dispatch job checks do not satisfy PR requirements. Commit statuses do.
      - name: Report each required result on the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.sha }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          while IFS='|' read -r context job selection; do
            result=$(jq -er --arg job "$job" '.[$job].result' <<< "$RESULTS")
            state=failure
            if [[ "$result" == success ]]; then state=success; fi
            if [[ "$result" == skipped && -n "$selection" ]] &&
              jq -e --arg selection "$selection" '.selection.result == "success" and .selection.outputs[$selection] == "false" and ($selection != "rust" or .selection.outputs.browser_guest == "false")' <<< "$RESULTS" >/dev/null; then
              state=success
            fi
            gh api --method POST "repos/$GH_REPO/statuses/$HEAD" \
              -f context="$context" -f state="$state" -f target_url="$RUN_URL" \
              -f description="Dispatched CI: $result"
          done <<'STATUSES'
          Code quality|ci-result|
          STATUSES
