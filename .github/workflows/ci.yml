name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # TLS producer/consumer receipts bind the exact Node executable, not only its major.
  CI_NODE_VERSION: '26.13.1'
  GITHUB_TOKEN: ${{ github.token }}
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.ci-bun-cache

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'push-main' || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    name: CI selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
      rust: ${{ steps.changes.outputs.rust }}
      browser_guest: ${{ steps.changes.outputs.browser_guest == 'true' || steps.browser-guest-batches.outputs.needed == 'true' }}
      jsc: ${{ steps.changes.outputs.jsc == 'true' || steps.browser-guest-batches.outputs.jsc == 'true' }}
      shared: ${{ steps.changes.outputs.shared }}
      shared-native: ${{ steps.changes.outputs.shared_native }}
      browser-guest-batches: ${{ steps.browser-guest-batches.outputs.batches }}
      browser-coverage-selection: ${{ steps.browser-guest-batches.outputs.selection }}
      web-browser-shards: ${{ steps.web-browser-shards.outputs.matrix }}
    steps:
      - name: Require a ready PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::Mark this PR ready for review to run the required checks.'
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
      - name: Resolve immutable comparison refs
        id: refs
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-refs.ts >> "$GITHUB_OUTPUT"
      - name: Resolve cumulative main coverage v3
        id: main-coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HEAD: ${{ steps.refs.outputs.head }}
        run: bun scripts/ci-main-coverage.ts "$HEAD" >> "$GITHUB_OUTPUT"
      - name: Select native checks from the complete change list
        id: changes
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          MAIN_SELECTION: ${{ steps.main-coverage.outputs.selection }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            test -n "$MAIN_SELECTION"
            printf '%s\n' "$MAIN_SELECTION" >> "$GITHUB_OUTPUT"
          else
            bun scripts/ci-changes.ts "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Discover Browser guest batches from feature manifests
        id: browser-guest-batches
        env:
          BASE: ${{ steps.main-coverage.outputs.browser-base || steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          BROWSER_COVERAGE_SELECTION: ${{ steps.main-coverage.outputs.browser-selection }}
          BROWSER_COVERAGE_FULL: ${{ steps.main-coverage.outputs.browser-full }}
        run: bun scripts/ci-browser-coverage.ts "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
      - name: Discover Web browser shards from feature manifests
        id: web-browser-shards
        run: |
          matrix=$(bun scripts/ci-web-browser-shards.ts)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Feature PRs preserve current package and workspace versions
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'release') && !contains(github.event.pull_request.labels.*.name, 'consumer-pin')
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
        run: bun scripts/feature-versions.ts "$BASE" "$HEAD"
      - uses: ./.github/actions/save-release-downloads

  quality:
    name: Source quality
    needs: selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        id: bun-dependencies
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install locked JavaScript tools and application dependencies
        run: |
          bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --ignore-scripts
          (cd web && bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile)
          (cd sandbox && bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile)
          (cd site && bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile)
      - name: Publish the completed dependency cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bun-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-bun-cache
          key: ${{ steps.bun-dependencies.outputs.cache-primary-key }}
      - name: Prepare preinstalled native control compilers
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun scripts/ci-native-control-compilers.ts
      - name: Blocking quality gates
        env:
          JSCPD_BASE_REF: ${{ needs.selection.outputs.base }}
          TMPDIR: ${{ runner.temp }}
        run: bun run quality --javascript
      - name: Install lightweight CMake preflight tools
        run: |
          if command -v cmake && command -v ninja && command -v g++; then exit 0; fi
          sudo bash .github/scripts/apt-main-archive.sh
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Test CMake cache toolchain preflight
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun scripts/test-checks.ts cmake

      - uses: ./.github/actions/save-release-downloads

  # The JSC C/C++ prebuild has its own job and budget. Every native selection runs it,
  # because the tools fixture links JSC even when the JSC engine gates are off. It owns
  # the run's one sysroot and one prebuild (built, or restored and verified), their
  # caches and the hand-off artifact.

  jsc-identity:
    name: Resolve effective JSC inputs
    needs: selection
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && ((needs.selection.outputs.rust == 'true' || needs.selection.outputs.browser_guest == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      key: ${{ steps.setup.outputs.key }}
      sysroot-sha256: ${{ steps.sysroot.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/jsc-setup
        id: setup
      - name: Package this run's prepared sysroot
        id: sysroot
        shell: bash
        run: |
          source env.sh
          transfer="$RUNNER_TEMP/jsc-identity-sysroot.tar.zst"
          tar --posix -C "$WASM_TOOLS" -cf - bun-wasm-sysroot-patched | zstd -T0 -q -o "$transfer"
          echo "sha256=$(sha256sum "$transfer" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/jsc-identity-sysroot.tar.zst
          if-no-files-found: error
          retention-days: 1
          archive: false
      - uses: ./.github/actions/save-release-downloads

  jsc-prebuild:
    name: JSC C/C++ prebuild
    needs: [selection, jsc-identity]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && ((needs.selection.outputs.rust == 'true' || needs.selection.outputs.browser_guest == 'true')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.jsc-identity.outputs.key }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 45
    outputs:
      manifest-sha256: ${{ steps.prebuild.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: jsc-identity-sysroot.tar.zst
          path: ${{ runner.temp }}
      - uses: ./.github/actions/jsc-setup
        id: setup
        with:
          sysroot: ${{ needs.jsc-identity.outputs.sysroot-sha256 }}
      - uses: ./.github/actions/jsc-prebuild
        id: prebuild
        with:
          key: ${{ steps.setup.outputs.key }}
          prefix: ${{ steps.setup.outputs.prefix }}
          expected-key: ${{ needs.jsc-identity.outputs.key }}
          transfer: 'true'
      - uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/jsc-prebuild.tar
          if-no-files-found: error
          retention-days: 1
          archive: false
      - uses: ./.github/actions/save-release-downloads

  native-quality:
    name: Native quality checkpoint
    needs: [selection, jsc-prebuild]
    # Not skipped when the prebuild job fails or is skipped: the guard step fails instead.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && needs.selection.result == 'success' && (needs.selection.outputs.rust == 'true' || (github.event_name != 'pull_request' && needs.selection.outputs.rust == 'false' && needs.selection.outputs.browser_guest == 'true'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      QUALITY_RUST_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      GIT_AUTHOR_NAME: bun-wasm CI
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_NAME: bun-wasm CI
      GIT_COMMITTER_EMAIL: ci@localhost
    outputs:
      manifest-sha256: ${{ steps.native-artifact.outputs.manifest-sha256 }}
      producer-attempt: ${{ steps.native-artifact.outputs.producer-attempt }}
      tls-sha256: ${{ steps.tls-artifact.outputs.tls-sha256 }}
      cargo-hit: ${{ steps.native-seed.outputs.cargo-hit }}
      cargo-matched: ${{ steps.native-seed.outputs.cargo-matched }}
      legacy-hit: ${{ steps.native-seed.outputs.legacy-hit }}
    steps:
      - name: Require the JSC prebuild job's output
        env:
          JSC_PREBUILD_RESULT: ${{ needs.jsc-prebuild.result }}
        run: |
          if [[ "$JSC_PREBUILD_RESULT" != success ]]; then
            echo "error: the JSC prebuild job finished as '$JSC_PREBUILD_RESULT'; native checks need its verified output." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: jsc-prebuild.tar
          path: ${{ runner.temp }}/jsc-prebuild-transfer
      - uses: ./.github/actions/native-setup
        id: native-setup
        with:
          mode: native
          node-version: ${{ env.CI_NODE_VERSION }}
          jsc-manifest: ${{ needs.jsc-prebuild.outputs.manifest-sha256 }}
      # Root bun.lock is intentionally absent from native identities: native consumption is
      # guarded by the sysroot/JSC receipts, effective tools, and native source hashes below.
      # These three audited Cargo sources change exact keys, not dependency compatibility.
      # All other native inputs remain hard guards; the new partition needs one cold seed.
      - uses: ./.github/actions/native-seed
        id: native-seed
        with:
          host-tools: ${{ steps.native-setup.outputs.host-tools }}
          native-inputs: ${{ steps.native-setup.outputs.native-inputs }}
      - name: Restore pinned Rust dependency checker
        id: machete-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CARGO_HOME }}/bin/cargo-machete
          key: cargo-machete-v1-0.9.2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-setup.outputs.host-tools }}-${{ steps.native-setup.outputs.native-inputs }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**') }}
      - name: Install pinned Rust dependency checker
        run: |
          source env.sh
          if ! cargo machete --version 2>/dev/null | command grep -qx '0.9.2'; then
            cargo install cargo-machete --version 0.9.2 --locked --jobs 2
          fi
          cargo machete --version | command grep -qx '0.9.2'
      - name: Save completed Rust dependency checker setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.machete-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CARGO_HOME }}/bin/cargo-machete
          key: ${{ steps.machete-cache.outputs.cache-primary-key }}
      - name: Preserve unchanged build-script input timestamps
        run: bun scripts/quality-input-times.ts
      - name: Identify JSC prebuild inputs
        id: jsc-inputs
        env:
          JOBS: "2"
          CAGE: ""
        run: |
          source jsc/common.sh
          copy_jsc_config_inputs
          inputs=$(jsc_inputs_hash)
          echo "hash=$inputs" >> "$GITHUB_OUTPUT"
      - name: Prepare exact TLS Cargo output recording
        env:
          TLS_PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          NATIVE_HOST_TOOLS_HASH: ${{ steps.native-setup.outputs.host-tools }}
          NATIVE_INPUTS_HASH: ${{ steps.native-setup.outputs.native-inputs }}
        run: |
          source env.sh
          bun scripts/tls-probe-ci.ts prepare
      - name: Blocking native quality checks
        id: native-producers
        env:
          TLS_PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          NATIVE_HOST_TOOLS_HASH: ${{ steps.native-setup.outputs.host-tools }}
          NATIVE_INPUTS_HASH: ${{ steps.native-setup.outputs.native-inputs }}
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          run_native_checks() {
            source env.sh
            export BUNWASM_TLS_CARGO_RECORD_DIR="$CARGO_TARGET_DIR/tls-probe/cargo"
            bun scripts/quality-rust.ts --checks-only
            bun run quality:wasi
            bun test tests/memory-telemetry.test.ts
            # The WASI lint probe rewrites a source file; restore its time before the next build.
            bun scripts/quality-input-times.ts
            source env.sh
            cargo test --locked --release -j 2 -p bunwasm-runtime --no-default-features --features engine-host --lib modules::tests::host_
          }
          run_native_checks
          echo "native-ready=true" >> "$GITHUB_OUTPUT"
      - name: Link and authenticate the TLS probe from recorded Cargo archives
        id: tls-artifact
        env:
          TLS_PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          NATIVE_HOST_TOOLS_HASH: ${{ steps.native-setup.outputs.host-tools }}
          NATIVE_INPUTS_HASH: ${{ steps.native-setup.outputs.native-inputs }}
        run: |
          source env.sh
          bun scripts/tls-probe-ci.ts link
      - name: Preserve TLS link failure diagnostics
        if: ${{ failure() && steps.tls-artifact.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: tls-link-failure-${{ github.run_attempt }}
          path: |
            target/tls-probe/prepared.json
            target/tls-probe/cargo/*.json
            target/tls-probe/output/*.json
            target/tls-probe/output/*.jsonl
            target/tls-probe/output/*.map
            target/tls-probe/output/*.wasm
            target/tls-probe/output/tls-probe-native
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Save the native quality checkpoint
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native-producers.outputs.native-ready == 'true' && steps.tls-artifact.outputs.tls-sha256 != '' && steps.native-seed.outputs.cargo-matched == '' && steps.native-seed.outputs.legacy-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/bin/cargo-machete
            ${{ env.CARGO_TARGET_DIR }}
          key: native-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-setup.outputs.host-tools }}-${{ steps.native-setup.outputs.native-inputs }}-${{ hashFiles('Cargo.*', '.cargo/**', 'rust-toolchain.toml', 'patches/bun/**', 'third_party/**', 'env.sh', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake', 'scripts/check-wasi-cmake-cache.sh', 'scripts/ci-binaryen.ts') }}-${{ hashFiles('crates/**', 'tests/fixtures/runtime-proc-spawn-requests.json', 'scripts/quality*.ts', 'scripts/tls-probe*.ts', 'checks/native-probe-*.json', 'tests/native/tls-probe.cpp') }}-${{ hashFiles('scripts/build-bun-tools.sh', 'scripts/build-bun-browser.sh', 'scripts/src/program-profile.ts', '.github/workflows/ci.yml', '.github/actions/native-*/action.yml', 'scripts/build-wasi-sysroot.ts') }}
      - name: Package the verified native quality checkpoint
        id: native-artifact
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        env:
          NATIVE_QUALITY_PRODUCER_ATTEMPT: ${{ github.run_attempt }}
          NATIVE_HOST_TOOLS_HASH: ${{ steps.native-setup.outputs.host-tools }}
          NATIVE_INPUTS_HASH: ${{ steps.native-setup.outputs.native-inputs }}
          JSC_PREBUILD_MANIFEST_SHA256: ${{ needs.jsc-prebuild.outputs.manifest-sha256 }}
        run: |
          source env.sh
          native_sysroot_sha256=$(sha256sum "$BUN_WASM_SYSROOT/bun-wasm-sysroot.json" | cut -d' ' -f1)
          export NATIVE_SYSROOT_SHA256="$native_sysroot_sha256"
          bun scripts/ci-native-handoff.ts pack "$RUNNER_TEMP/native-quality-artifact"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: native-quality-${{ steps.native-artifact.outputs.producer-attempt }}
          path: ${{ runner.temp }}/native-quality-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: ./.github/actions/save-rust-build-cache
        with:
          key: ${{ steps.native-setup.outputs.object-key }}
      - uses: ./.github/actions/save-release-downloads

  rust:
    name: Rust workspace tests (QuickJS host)
    needs: [selection, jsc-prebuild, native-quality]
    # Not skipped when the prebuild job fails or is skipped: the guard step fails instead.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && needs.selection.result == 'success' && (needs.selection.outputs.rust == 'true' || (github.event_name != 'pull_request' && needs.selection.outputs.rust == 'false' && needs.selection.outputs.browser_guest == 'true'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      QUALITY_RUST_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      GIT_AUTHOR_NAME: bun-wasm CI
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_NAME: bun-wasm CI
      GIT_COMMITTER_EMAIL: ci@localhost
    steps:
      - name: Require the JSC prebuild job's output
        env:
          JSC_PREBUILD_RESULT: ${{ needs.jsc-prebuild.result }}
          NATIVE_QUALITY_RESULT: ${{ needs.native-quality.result }}
        run: |
          if [[ "$JSC_PREBUILD_RESULT" != success || "$NATIVE_QUALITY_RESULT" != success ]]; then
            echo "error: native checks require successful JSC and native quality producers." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: jsc-prebuild.tar
          path: ${{ runner.temp }}/jsc-prebuild-transfer
      - uses: ./.github/actions/native-setup
        id: native-setup
        with:
          mode: checkpoint
          node-version: ${{ env.CI_NODE_VERSION }}
          jsc-manifest: ${{ needs.jsc-prebuild.outputs.manifest-sha256 }}
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: native-quality-${{ needs.native-quality.outputs.producer-attempt }}
          path: ${{ runner.temp }}/native-quality-artifact
          digest-mismatch: error
      - name: Import the verified native quality checkpoint
        id: native-import
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        env:
          NATIVE_QUALITY_MANIFEST_SHA256: ${{ needs.native-quality.outputs.manifest-sha256 }}
          NATIVE_QUALITY_PRODUCER_ATTEMPT: ${{ needs.native-quality.outputs.producer-attempt }}
          NATIVE_HOST_TOOLS_HASH: ${{ steps.native-setup.outputs.host-tools }}
          NATIVE_INPUTS_HASH: ${{ steps.native-setup.outputs.native-inputs }}
          JSC_PREBUILD_MANIFEST_SHA256: ${{ needs.jsc-prebuild.outputs.manifest-sha256 }}
        run: |
          source env.sh
          native_sysroot_sha256=$(sha256sum "$BUN_WASM_SYSROOT/bun-wasm-sysroot.json" | cut -d' ' -f1)
          export NATIVE_SYSROOT_SHA256="$native_sysroot_sha256"
          bun scripts/ci-native-handoff.ts unpack "$RUNNER_TEMP/native-quality-artifact"
          rm -r -- "$RUNNER_TEMP/native-quality-artifact"
      - name: Run the blocking TLS native probe from the authenticated checkpoint
        env:
          TLS_PRODUCER_ATTEMPT: ${{ needs.native-quality.outputs.producer-attempt }}
          BUNWASM_TLS_PROBE_SHA256: ${{ needs.native-quality.outputs.tls-sha256 }}
          NATIVE_HOST_TOOLS_HASH: ${{ steps.native-setup.outputs.host-tools }}
          NATIVE_INPUTS_HASH: ${{ steps.native-setup.outputs.native-inputs }}
        run: |
          source env.sh
          export BUNWASM_TLS_PROBE_OUTPUT="$CARGO_TARGET_DIR/tls-probe/output"
          bun scripts/test-checks.ts native-probe
      - name: Carry the original native cache restore result
        id: native-cargo-cache
        env:
          CACHE_HIT: ${{ needs.native-quality.outputs.cargo-hit }}
          CACHE_MATCHED: ${{ needs.native-quality.outputs.cargo-matched }}
        run: printf 'cache-hit=%s\ncache-matched-key=%s\n' "$CACHE_HIT" "$CACHE_MATCHED" >> "$GITHUB_OUTPUT"
      - name: Carry the original legacy cache restore result
        id: native-cache
        env:
          CACHE_HIT: ${{ needs.native-quality.outputs.legacy-hit }}
        run: printf 'cache-hit=%s\n' "$CACHE_HIT" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/native-production
        env:
          BUN_WASM_BROWSER_COVERAGE_SELECTION: ${{ needs.selection.outputs.browser-coverage-selection }}
        with:
          full: 'true'
          jsc: ${{ needs.selection.outputs.jsc }}
          shared-native: ${{ needs.selection.outputs.shared-native }}
          host-tools: ${{ steps.native-setup.outputs.host-tools }}
          native-inputs: ${{ steps.native-setup.outputs.native-inputs }}
          object-key: ${{ steps.native-setup.outputs.object-key }}
          cargo-matched: ${{ steps.native-cargo-cache.outputs.cache-matched-key }}
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: needs.selection.outputs.jsc == 'true' || needs.selection.outputs.shared-native == 'true'
        with:
          name: native-profile-launcher
          path: ${{ runner.temp }}/native-profile-launcher/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: needs.selection.outputs.jsc == 'true'
        with:
          name: ordinary-jsc-program
          path: ${{ runner.temp }}/ordinary-jsc-program/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: ordinary-spidermonkey-program
          path: ${{ runner.temp }}/ordinary-spidermonkey-program/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-guest-site
          path: ${{ runner.temp }}/browser-guest-site
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-program
          path: ${{ runner.temp }}/browser-program/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: always()
        with:
          name: web-guest-fixture-receipts
          path: |
            dist/*.wasm.build.json
            dist/*.wasm.engine.json
            dist/*.wasm.embedding.json
            dist/web-guests-*.log
            ${{ runner.temp }}/jsc-prebuild.log
            ${{ runner.temp }}/jsc/engine/engine-link.map
          if-no-files-found: error
          retention-days: 1

  browser-production:
    name: Browser guest production
    needs: [selection, jsc-prebuild]
    # Not skipped when the prebuild job fails or is skipped: the guard step fails instead.
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.rust == 'false' && needs.selection.outputs.browser_guest == 'true' && needs.selection.outputs.shared-native == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      QUALITY_RUST_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      GIT_AUTHOR_NAME: bun-wasm CI
      GIT_AUTHOR_EMAIL: ci@localhost
      GIT_COMMITTER_NAME: bun-wasm CI
      GIT_COMMITTER_EMAIL: ci@localhost
    steps:
      - uses: actions/checkout@v4
      - name: Require the JSC prebuild job's output
        env:
          JSC_PREBUILD_RESULT: ${{ needs.jsc-prebuild.result }}
        run: test "$JSC_PREBUILD_RESULT" = success
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: jsc-prebuild.tar
          path: ${{ runner.temp }}/jsc-prebuild-transfer
      - uses: ./.github/actions/native-setup
        id: native-setup
        with:
          mode: seed
          cache-scope: rust
          node-version: ${{ env.CI_NODE_VERSION }}
          jsc-manifest: ${{ needs.jsc-prebuild.outputs.manifest-sha256 }}
      - uses: ./.github/actions/native-seed
        id: native-seed
        with:
          host-tools: ${{ steps.native-setup.outputs.host-tools }}
          native-inputs: ${{ steps.native-setup.outputs.native-inputs }}
      - uses: ./.github/actions/native-production
        env:
          BUN_WASM_BROWSER_COVERAGE_SELECTION: ${{ needs.selection.outputs.browser-coverage-selection }}
        with:
          full: 'false'
          jsc: ${{ needs.selection.outputs.jsc }}
          shared-native: 'false'
          host-tools: ${{ steps.native-setup.outputs.host-tools }}
          native-inputs: ${{ steps.native-setup.outputs.native-inputs }}
          object-key: ${{ steps.native-setup.outputs.object-key }}
          cargo-matched: ${{ steps.native-seed.outputs.cargo-matched }}
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-guest-site
          path: ${{ runner.temp }}/browser-guest-site
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-program
          path: ${{ runner.temp }}/browser-program/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        if: always()
        with:
          name: web-guest-fixture-receipts
          path: |
            dist/*.wasm.build.json
            dist/*.wasm.engine.json
            dist/*.wasm.embedding.json
            dist/web-guests-*.log
            ${{ runner.temp }}/jsc-prebuild.log
            ${{ runner.temp }}/jsc/engine/engine-link.map
          if-no-files-found: error
          retention-days: 1

  package:
    needs: selection
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Browser adapter package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile
      - run: bun run check
      - run: bun run test
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Test vectored reads and browser dependency resolution
        run: bun scripts/test-checks.ts package-extra
      - uses: ./.github/actions/save-release-downloads

  ordinary-web-guests:
    name: Ordinary Web guest checks
    needs: [selection, rust]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.selection.result == 'success' && (needs.selection.outputs.rust == 'true' || (github.event_name != 'pull_request' && needs.selection.outputs.browser_guest == 'true')) && needs.rust.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Require the selected full producer
        env:
          FULL_SELECTED: ${{ (needs.selection.outputs.rust == 'true' || (github.event_name != 'pull_request' && needs.selection.outputs.browser_guest == 'true')) }}
          RUST_SELECTED: ${{ needs.selection.outputs.rust }}
          BROWSER_SELECTED: ${{ needs.selection.outputs.browser_guest }}
          JSC_SELECTED: ${{ needs.selection.outputs.jsc }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          case "$GITHUB_EVENT_NAME" in pull_request|push|workflow_dispatch) ;; *) exit 1 ;; esac
          case "$RUST_SELECTED/$BROWSER_SELECTED" in true/true|false/true) ;; *) exit 1 ;; esac
          test "$FULL_SELECTED" = true
          test "$RUST_RESULT" = success
          case "$JSC_SELECTED" in true|false) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v4
      - name: Configure consumer scratch
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun scripts/ci-install.ts --frozen-lockfile --ignore-scripts
      - run: bun scripts/ci-install.ts --cwd web --frozen-lockfile
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-program
          path: ${{ runner.temp }}/ordinary-browser-program
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        if: needs.selection.outputs.jsc == 'true'
        with:
          name: ordinary-jsc-program
          path: ${{ runner.temp }}/ordinary-jsc-program
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        if: needs.selection.outputs.jsc == 'true'
        with:
          name: native-profile-launcher
          path: ${{ runner.temp }}/ordinary-native-launcher
      - name: Verify and stage the original ordinary deliveries
        env:
          JSC_SELECTED: ${{ needs.selection.outputs.jsc }}
        run: |
          case "$JSC_SELECTED" in
            true)
              bun scripts/ci-ordinary-web-inputs.ts "$RUNNER_TEMP/ordinary-browser-program" true "$RUNNER_TEMP/ordinary-jsc-program" "$RUNNER_TEMP/ordinary-native-launcher"
              echo "BUN_WASM_LAUNCHER=$RUNNER_TEMP/ordinary-native-launcher/bun-wasm" >> "$GITHUB_ENV"
              ;;
            false) bun scripts/ci-ordinary-web-inputs.ts "$RUNNER_TEMP/ordinary-browser-program" false ;;
            *) exit 1 ;;
          esac
      - name: Blocking JSC embedding and allocation checks
        if: needs.selection.outputs.jsc == 'true'
        run: |
          source env.sh
          bun scripts/jsc-embedding.ts fixtures dist/bun-jsc.wasm 2>&1 | tee dist/jsc-embedding-fixtures.log
      - name: Blocking Web guest cases (QuickJS and host engine)
        run: |
          source env.sh
          bun scripts/test-web-guests.ts quickjs browser 2>&1 | tee dist/web-guests-quickjs-browser.log
      - name: Blocking Web guest case (JSC)
        if: needs.selection.outputs.jsc == 'true'
        run: |
          source env.sh
          bun scripts/test-web-guests.ts jsc 2>&1 | tee dist/web-guests-jsc.log
      - name: Retain ordinary Web guest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: ordinary-web-guest-diagnostics
          path: dist/*.log
          if-no-files-found: ignore
          retention-days: 1

  shared-jsc-identity:
    name: Resolve effective shared JSC inputs
    needs: selection
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.selection.outputs.shared == 'true' || needs.selection.outputs.shared-native == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WASI_LIBC_JOBS: "2"
    outputs:
      key: ${{ steps.setup.outputs.key }}
      sysroot-sha256: ${{ steps.sysroot.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/shared-jsc-setup
        id: setup
        with:
          shared-native: ${{ needs.selection.outputs.shared-native }}
      - name: Package this run's prepared shared sysroot
        id: sysroot
        shell: bash
        run: |
          source env.sh
          transfer="$RUNNER_TEMP/shared-jsc-identity-sysroot.tar.zst"
          tar --posix -C "$RUNNER_TEMP" -cf - bun-wasm-shared-sysroot | zstd -T0 -q -o "$transfer"
          echo "sha256=$(sha256sum "$transfer" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/shared-jsc-identity-sysroot.tar.zst
          if-no-files-found: error
          retention-days: 1
          archive: false
      - uses: ./.github/actions/save-release-downloads

  shared-prebuild:
    name: Shared PIC sysroot and JSC prebuild
    needs: [selection, shared-jsc-identity]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.selection.outputs.shared == 'true' || needs.selection.outputs.shared-native == 'true') }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.shared-jsc-identity.outputs.key }}
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    # The ordinary JSC producer budgets 45 minutes for cold C++ and its hand-off.
    timeout-minutes: 45
    env:
      WASI_LIBC_JOBS: "2"
    outputs:
      manifest-sha256: ${{ steps.shared-artifact.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: shared-jsc-identity-sysroot.tar.zst
          path: ${{ runner.temp }}
      - uses: ./.github/actions/shared-jsc-setup
        id: setup
        with:
          shared-native: ${{ needs.selection.outputs.shared-native }}
          sysroot: ${{ needs.shared-jsc-identity.outputs.sysroot-sha256 }}
      - uses: ./.github/actions/shared-jsc-prebuild
        if: needs.selection.outputs.shared-native == 'true'
        with:
          key: ${{ steps.setup.outputs.key }}
          expected-key: ${{ needs.shared-jsc-identity.outputs.key }}
      - name: Package the verified shared prebuild and sysroot
        id: shared-artifact
        env:
          SHARED_NATIVE: ${{ needs.selection.outputs.shared-native }}
        run: |
          source env.sh
          bundle="$RUNNER_TEMP/shared-prebuild-artifact"
          mkdir "$bundle"
          members=(sysroot.tar.zst)
          tar --posix -C "$(dirname "$BUN_WASM_SYSROOT")" -cf - "$(basename "$BUN_WASM_SYSROOT")" | zstd -T0 -q -o "$bundle/sysroot.tar.zst"
          if [[ "$SHARED_NATIVE" == true ]]; then
            bun scripts/ci-jsc-artifact.ts "$JSC_BUILD_DIR" shared-group "$bundle/prebuild.tar.zst"
            members+=(prebuild.tar.zst)
          fi
          {
            printf 'run=%s\nsha=%s\nshared-native=%s\nsysroot=%s\njsc-build-dir=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SHARED_NATIVE" "$BUN_WASM_SYSROOT" "$RUNNER_TEMP/jsc/shared"
            (cd "$bundle" && sha256sum "${members[@]}")
          } > "$bundle/manifest"
          tar --posix -C "$bundle" -cf "$RUNNER_TEMP/shared-prebuild.tar" "${members[@]}" manifest
          echo "manifest-sha256=$(sha256sum "$bundle/manifest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/shared-prebuild.tar
          if-no-files-found: error
          retention-days: 1
          archive: false
      - uses: ./.github/actions/save-release-downloads

  shared-spidermonkey-prebuild:
    name: Shared SpiderMonkey library prebuild
    needs: [selection, shared-prebuild]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.selection.outputs.shared-native == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    outputs:
      manifest-sha256: ${{ steps.shared-sm-artifact.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure private shared sysroot paths
        run: |
          echo "WASM_TOOLS=$RUNNER_TEMP/wasm-tools" >> "$GITHUB_ENV"
          echo "BUN_WASM_SHARED_SYSROOT=$RUNNER_TEMP/bun-wasm-shared-sysroot" >> "$GITHUB_ENV"
          echo "BUN_WASM_SYSROOT=$RUNNER_TEMP/bun-wasm-shared-sysroot" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --ignore-scripts
      - name: Install pinned shared build tools
        run: bun scripts/ci-build-tools.ts
      - uses: actions/cache/restore@v4
        id: shared-sdk
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: wasi-sdk-34.0-stock-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned WASI SDK
        if: steps.shared-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wasi-sdk-34.tar.gz"
          trap 'rm -f -- "$archive"' EXIT
          bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz "$archive"
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $archive" | sha256sum --check
          mkdir -p "$WASM_TOOLS/wasi-sdk"
          tar -xzf "$archive" --strip-components=1 -C "$WASM_TOOLS/wasi-sdk"
      - name: Save completed shared-sdk setup
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-sdk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: ${{ steps.shared-sdk.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        if: needs.selection.outputs.shared-native == 'true'
        id: shared-rustup-cache
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: rust-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, rustfmt, clippy
          targets: wasm32-wasip1, wasm32-wasip1-threads, wasm32-unknown-unknown
      - name: Configure private shared JSC build path
        run: echo "JSC_BUILD_DIR=$RUNNER_TEMP/jsc/shared" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: shared-prebuild.tar
          path: ${{ runner.temp }}/shared-prebuild-transfer
      - name: Import only the verified shared sysroot for SpiderMonkey
        env:
          SHARED_NATIVE: ${{ needs.selection.outputs.shared-native }}
          SHARED_PREBUILD_MANIFEST_SHA256: ${{ needs.shared-prebuild.outputs.manifest-sha256 }}
          JSC_PROFILE: shared-group
          JOBS: "2"
          CAGE: ""
        run: |
          source env.sh
          transfer="$RUNNER_TEMP/shared-prebuild-transfer/shared-prebuild.tar"
          manifest="$RUNNER_TEMP/shared-prebuild-manifest"
          members=(sysroot.tar.zst)
          if [[ "$SHARED_NATIVE" == true ]]; then members+=(prebuild.tar.zst); fi
          [[ "$SHARED_PREBUILD_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(tar --posix -tf "$transfer")" == "$(printf '%s\n' "${members[@]}" manifest)" ]]
          [[ ! -e "$manifest" ]]
          tar --posix -xOf "$transfer" manifest > "$manifest"
          echo "$SHARED_PREBUILD_MANIFEST_SHA256  $manifest" | sha256sum --check --strict
          expected=$(printf 'run=%s\nsha=%s\nshared-native=%s\nsysroot=%s\njsc-build-dir=%s' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SHARED_NATIVE" "$BUN_WASM_SYSROOT" "$JSC_BUILD_DIR")
          [[ "$(head -n 5 "$manifest")" == "$expected" ]]
          [[ "$(tail -n +6 "$manifest" | cut -d' ' -f3)" == "$(printf '%s\n' "${members[@]}")" ]]
          for member in "${members[@]}"; do
            digest=$(tail -n +6 "$manifest" | awk -v member="$member" '$2 == member { print $1 }')
            [[ "$(tar --posix -xOf "$transfer" "$member" | sha256sum | cut -d' ' -f1)" == "$digest" ]]
          done
          [[ ! -e "$BUN_WASM_SYSROOT" ]]
          mkdir -p "$(dirname "$BUN_WASM_SYSROOT")" "$(dirname "$JSC_BUILD_DIR")"
          tar --posix -xOf "$transfer" sysroot.tar.zst | zstd -dc | tar -C "$(dirname "$BUN_WASM_SYSROOT")" -xf -
          test -s "$BUN_WASM_SYSROOT/bun-wasm-sysroot.json"
          test -s "$BUN_WASM_SYSROOT/lib/wasm32-wasip1/libc.a"
          bun scripts/build-wasi-sysroot.ts --shared-pic
          rm -r -- "$manifest" "$RUNNER_TEMP/shared-prebuild-transfer"
      - name: Install the SpiderMonkey producer tools
        if: needs.selection.outputs.shared-native == 'true'
        run: |
          sudo bash .github/scripts/apt-main-archive.sh
          sudo apt-get update
          sudo apt-get install -y clang llvm autoconf2.13 pkg-config python3-dev python3-venv python3-packaging python3-setuptools libffi-dev zlib1g-dev
      - uses: actions/cache/restore@v4
        if: needs.selection.outputs.shared-native == 'true'
        id: shared-cbindgen-cache
        with:
          path: ${{ env.CARGO_HOME }}/bin/cbindgen
          key: cbindgen-0.29.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Prepare pinned cbindgen
        if: needs.selection.outputs.shared-native == 'true'
        env:
          CBINDGEN_CACHE_HIT: ${{ steps.shared-cbindgen-cache.outputs.cache-hit }}
        run: |
          source env.sh
          if [[ "$CBINDGEN_CACHE_HIT" != true ]]; then
            CARGO_TARGET_DIR="$CARGO_TARGET_DIR/shared-native/cbindgen-target" cargo install --locked --version 0.29.4 cbindgen
          fi
          "$CARGO_HOME/bin/cbindgen" --version | grep -Fx 'cbindgen 0.29.4'
      - name: Save pinned cbindgen
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.selection.outputs.shared-native == 'true' && steps.shared-cbindgen-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CARGO_HOME }}/bin/cbindgen
          key: ${{ steps.shared-cbindgen-cache.outputs.cache-primary-key }}
      - name: Identify shared SpiderMonkey native inputs
        if: needs.selection.outputs.shared-native == 'true'
        id: shared-spidermonkey-inputs
        run: |
          source env.sh
          echo "SPIDERMONKEY_BUILD_DIR=$RUNNER_TEMP/spidermonkey/shared" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_NATIVE_DIR=$RUNNER_TEMP/spidermonkey/shared/native" >> "$GITHUB_ENV"
          inputs=$({
            printf 'profile=shared-group\n'
            sha256sum "$BUN_WASM_SYSROOT/bun-wasm-sysroot.json" "$BUN_WASM_SYSROOT/lib/wasm32-wasip1/libc.a" "$WASI_SDK_PATH/bin/clang++" "$CARGO_HOME/bin/cbindgen" /usr/bin/clang /usr/bin/clang++
            for tool in rustc cargo clang clang++ llvm-readobj python3 autoconf2.13 make perl; do
              sha256sum "$(command -v "$tool")"
            done
            dpkg-query -W
            /usr/bin/clang --version
            /usr/bin/clang++ --version
            rustc -vV
            llvm-readobj --version
            python3 --version
            autoconf2.13 --version
          } | sha256sum | cut -d' ' -f1)
          echo "hash=$inputs" >> "$GITHUB_OUTPUT"
          echo "recipes=$(bun scripts/ci-spidermonkey-prebuild.ts recipes)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: needs.selection.outputs.shared-native == 'true'
        id: shared-spidermonkey-cache
        with:
          path: ${{ runner.temp }}/spidermonkey/shared
          key: spidermonkey-shared-group-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.shared-spidermonkey-inputs.outputs.hash }}-${{ steps.shared-spidermonkey-inputs.outputs.recipes }}
      - name: Produce or verify the shared SpiderMonkey library once
        if: needs.selection.outputs.shared-native == 'true'
        env:
          JOBS: "2"
          CAGE: ""
        run: |
          source env.sh
          source_tree="$SPIDERMONKEY_BUILD_DIR/firefox"
          if [[ ! -d "$source_tree/.git" ]]; then
            git init -q "$source_tree"
            git -C "$source_tree" remote add origin https://github.com/mozilla-firefox/firefox.git
          fi
          # Fetch's sparse closure needs lazy blobs on a fresh runner, not only a retained tree.
          git -C "$source_tree" config remote.origin.promisor true
          git -C "$source_tree" config remote.origin.partialclonefilter blob:none
          # The recipe stages fresh headers; only its incremental objects and patched source persist.
          rm -rf -- "$SPIDERMONKEY_BUILD_DIR/native"
          # Mach checks vendored packages against its invoking Python's packages.
          # Exclude runner tools and any packages left by a restored environment.
          python3 -m venv --clear --without-pip "$RUNNER_TEMP/spidermonkey-python"
          export PATH="$RUNNER_TEMP/spidermonkey-python/bin:$PATH"
          bash spidermonkey/build-shared-group.sh
      - name: Bind the verified SpiderMonkey transfer to this run and source
        id: shared-sm-artifact
        env:
          SM_NATIVE_INPUTS: ${{ steps.shared-spidermonkey-inputs.outputs.hash }}
        run: |
          source env.sh
          manifest=$(bun scripts/ci-spidermonkey-prebuild.ts write "$SPIDERMONKEY_BUILD_DIR" "$SM_NATIVE_INPUTS")
          echo "manifest-sha256=$manifest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: shared-spidermonkey-prebuild
          path: |
            ${{ env.SPIDERMONKEY_BUILD_DIR }}/native/
            ${{ env.SPIDERMONKEY_BUILD_DIR }}/receipt/
            ${{ env.SPIDERMONKEY_BUILD_DIR }}/prebuild.json
          if-no-files-found: error
          retention-days: 1
      - name: Save the verified shared SpiderMonkey source and native work
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.selection.outputs.shared-native == 'true' && steps.shared-spidermonkey-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/spidermonkey/shared
          key: ${{ steps.shared-spidermonkey-cache.outputs.cache-primary-key }}
      - name: Shared SpiderMonkey cache result
        if: needs.selection.outputs.shared-native == 'true'
        run: echo "shared SpiderMonkey exact cache hit=${{ steps.shared-spidermonkey-cache.outputs.cache-hit }}; matched=${{ steps.shared-spidermonkey-cache.outputs.cache-matched-key }}"
      - uses: ./.github/actions/save-release-downloads

  shared-sysroot:
    name: Shared PIC program producer
    needs: [selection, ordinary-web-guests, rust, shared-prebuild, shared-spidermonkey-prebuild]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() && needs.selection.result == 'success' && (((needs.selection.outputs.rust == 'true' || (github.event_name != 'pull_request' && needs.selection.outputs.browser_guest == 'true')) && needs.rust.result == 'success' && needs.ordinary-web-guests.result == 'success') || ((needs.selection.outputs.rust == 'false' && (github.event_name == 'pull_request' || needs.selection.outputs.browser_guest == 'false')) && needs.rust.result == 'skipped' && needs.ordinary-web-guests.result == 'skipped')) && (needs.selection.outputs.shared == 'true' || needs.selection.outputs.shared-native == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 30
    env:
      WASI_LIBC_JOBS: "2"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
    steps:
      - name: Reserve time for shared producer diagnostics
        if: needs.selection.outputs.shared-native == 'true'
        run: echo "SHARED_PRODUCER_DEADLINE_MS=$(( $(date +%s) * 1000 + 27 * 60 * 1000 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Require the shared prebuild producer
        env:
          SHARED_PREBUILD_RESULT: ${{ needs.shared-prebuild.result }}
        run: test "$SHARED_PREBUILD_RESULT" = success
      - name: Require the shared native launcher producer
        if: needs.selection.outputs.shared-native == 'true'
        env:
          ORDINARY_WEB_RESULT: ${{ needs.ordinary-web-guests.result }}
          PROFILE_LAUNCHER_RESULT: ${{ needs.rust.result }}
        run: |
          test "$PROFILE_LAUNCHER_RESULT" = success
          test "$ORDINARY_WEB_RESULT" = success
      - name: Require the shared SpiderMonkey library producer
        if: needs.selection.outputs.shared-native == 'true'
        env:
          SM_PREBUILD_RESULT: ${{ needs.shared-spidermonkey-prebuild.result }}
        run: test "$SM_PREBUILD_RESULT" = success
      - name: Reuse the production playground for shared profile checks
        if: needs.selection.outputs.shared-native == 'true'
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-guest-site
          path: ${{ runner.temp }}/shared-playground-site
      - name: Select the existing playground site for shared profile checks
        if: needs.selection.outputs.shared-native == 'true'
        run: echo "BUN_WASM_BROWSER_SITE=$RUNNER_TEMP/shared-playground-site" >> "$GITHUB_ENV"
      - name: Configure private shared sysroot paths
        run: |
          echo "WASM_TOOLS=$RUNNER_TEMP/wasm-tools" >> "$GITHUB_ENV"
          echo "BUN_WASM_SHARED_SYSROOT=$RUNNER_TEMP/bun-wasm-shared-sysroot" >> "$GITHUB_ENV"
          echo "BUN_WASM_SYSROOT=$RUNNER_TEMP/bun-wasm-shared-sysroot" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --ignore-scripts
      - name: Install sysroot build tools
        run: |
          if command -v cmake && command -v ninja; then exit 0; fi
          sudo bash .github/scripts/apt-main-archive.sh
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Install pinned shared build tools
        run: bun scripts/ci-build-tools.ts
      - uses: actions/cache/restore@v4
        id: shared-sdk
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: wasi-sdk-34.0-stock-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned WASI SDK
        if: steps.shared-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/wasi-sdk-34.tar.gz"
          trap 'rm -f -- "$archive"' EXIT
          bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz "$archive"
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  $archive" | sha256sum --check
          mkdir -p "$WASM_TOOLS/wasi-sdk"
          tar -xzf "$archive" --strip-components=1 -C "$WASM_TOOLS/wasi-sdk"
      - name: Save completed shared-sdk setup
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-sdk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/wasi-sdk
          key: ${{ steps.shared-sdk.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: shared-wasm-tools
        with:
          path: ${{ env.WASM_TOOLS }}/wasm-tools-1.262.0-x86_64-linux.tar.gz
          key: wasm-tools-1.262.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned wasm-tools
        run: |
          set -euo pipefail
          archive="$WASM_TOOLS/wasm-tools-1.262.0-x86_64-linux.tar.gz"
          stage=$(mktemp -d "$WASM_TOOLS/.wasm-tools-XXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          if [[ ! -f "$archive" ]]; then
            bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
              https://github.com/bytecodealliance/wasm-tools/releases/download/v1.262.0/wasm-tools-1.262.0-x86_64-linux.tar.gz "$archive"
          fi
          echo "655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65  $archive" | sha256sum --check
          tar -xzf "$archive" --strip-components=1 -C "$stage"
          test "$("$stage/wasm-tools" --version)" = "wasm-tools 1.262.0 (e22db44da 2026-10-13)"
          mkdir -p "$WASM_TOOLS/wasm-tools-bin"
          cp "$stage/wasm-tools" "$WASM_TOOLS/wasm-tools-bin/wasm-tools"
          echo "$WASM_TOOLS/wasm-tools-bin" >> "$GITHUB_PATH"
      - name: Save completed shared-wasm-tools setup
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-wasm-tools.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/wasm-tools-1.262.0-x86_64-linux.tar.gz
          key: ${{ steps.shared-wasm-tools.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: shared-wasmtime
        with:
          path: ${{ env.WASM_TOOLS }}/wasmtime-v49.0.3-x86_64-linux.tar.xz
          key: wasmtime-49.0.3-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Wasmtime
        run: |
          set -euo pipefail
          archive="$WASM_TOOLS/wasmtime-v49.0.3-x86_64-linux.tar.xz"
          stage=$(mktemp -d "$WASM_TOOLS/.wasmtime-XXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          if [[ ! -f "$archive" ]]; then
            bun "$GITHUB_WORKSPACE/scripts/ci-release-download.ts" \
              https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.3/wasmtime-v49.0.3-x86_64-linux.tar.xz "$archive"
          fi
          echo "4001225413f208345b980525f31c4080e1873808b38d0ddc7918497340667fbb  $archive" | sha256sum --check
          tar -xJf "$archive" --strip-components=1 -C "$stage"
          test "$("$stage/wasmtime" --version)" = "wasmtime 49.0.3 (f96eabaa1 2026-10-14)"
          mkdir -p "$WASM_TOOLS/wasmtime"
          cp "$stage/wasmtime" "$WASM_TOOLS/wasmtime/wasmtime"
          echo "$WASM_TOOLS/wasmtime" >> "$GITHUB_PATH"
      - name: Save completed shared-wasmtime setup
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.shared-wasmtime.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WASM_TOOLS }}/wasmtime-v49.0.3-x86_64-linux.tar.xz
          key: ${{ steps.shared-wasmtime.outputs.cache-primary-key }}
      - name: Identify shared profile inputs
        id: shared-inputs
        run: |
          source env.sh
          inputs=$(bun scripts/build-wasi-sysroot.ts --shared-pic --inputs)
          echo "hash=$inputs" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: needs.selection.outputs.shared-native == 'true'
        id: shared-binaryen
        with:
          path: ${{ env.WASM_TOOLS }}/binaryen-version_133-x86_64-linux.tar.gz
          key: binaryen-133-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-binaryen.ts') }}
      - name: Prepare shared-profile Binaryen
        if: needs.selection.outputs.shared-native == 'true'
        run: bun scripts/ci-binaryen.ts
      - name: Configure private shared JSC build path
        run: echo "JSC_BUILD_DIR=$RUNNER_TEMP/jsc/shared" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: shared-prebuild.tar
          path: ${{ runner.temp }}/shared-prebuild-transfer
      - name: Import the verified shared prebuild and sysroot
        env:
          SHARED_NATIVE: ${{ needs.selection.outputs.shared-native }}
          SHARED_PREBUILD_MANIFEST_SHA256: ${{ needs.shared-prebuild.outputs.manifest-sha256 }}
          JSC_PROFILE: shared-group
          JOBS: "2"
          CAGE: ""
        run: |
          source env.sh
          transfer="$RUNNER_TEMP/shared-prebuild-transfer/shared-prebuild.tar"
          manifest="$RUNNER_TEMP/shared-prebuild-manifest"
          members=(sysroot.tar.zst)
          if [[ "$SHARED_NATIVE" == true ]]; then members+=(prebuild.tar.zst); fi
          [[ "$SHARED_PREBUILD_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(tar --posix -tf "$transfer")" == "$(printf '%s\n' "${members[@]}" manifest)" ]]
          [[ ! -e "$manifest" ]]
          tar --posix -xOf "$transfer" manifest > "$manifest"
          echo "$SHARED_PREBUILD_MANIFEST_SHA256  $manifest" | sha256sum --check --strict
          expected=$(printf 'run=%s\nsha=%s\nshared-native=%s\nsysroot=%s\njsc-build-dir=%s' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SHARED_NATIVE" "$BUN_WASM_SYSROOT" "$JSC_BUILD_DIR")
          [[ "$(head -n 5 "$manifest")" == "$expected" ]]
          [[ "$(tail -n +6 "$manifest" | cut -d' ' -f3)" == "$(printf '%s\n' "${members[@]}")" ]]
          for member in "${members[@]}"; do
            digest=$(tail -n +6 "$manifest" | awk -v member="$member" '$2 == member { print $1 }')
            [[ "$(tar --posix -xOf "$transfer" "$member" | sha256sum | cut -d' ' -f1)" == "$digest" ]]
          done
          [[ ! -e "$BUN_WASM_SYSROOT" && ! -e "$JSC_BUILD_DIR" ]]
          mkdir -p "$(dirname "$BUN_WASM_SYSROOT")" "$(dirname "$JSC_BUILD_DIR")"
          tar --posix -xOf "$transfer" sysroot.tar.zst | zstd -dc | tar -C "$(dirname "$BUN_WASM_SYSROOT")" -xf -
          test -s "$BUN_WASM_SYSROOT/bun-wasm-sysroot.json"
          test -s "$BUN_WASM_SYSROOT/lib/wasm32-wasip1/libc.a"
          bun scripts/build-wasi-sysroot.ts --shared-pic
          if [[ "$SHARED_NATIVE" == true ]]; then
            tar --posix -xOf "$transfer" prebuild.tar.zst | zstd -dc | tar -C "$(dirname "$JSC_BUILD_DIR")" -xf -
            source jsc/common.sh
            check_jsc_inputs_stamp
          fi
          rm -r -- "$manifest" "$RUNNER_TEMP/shared-prebuild-transfer"
      - name: Run two-member real-libc proof
        run: |
          source env.sh
          bash scripts/test-shared-sysroot.sh "$RUNNER_TEMP/shared-sysroot-proof"

      - uses: actions/cache/restore@v4
        if: needs.selection.outputs.shared-native == 'true'
        id: shared-rustup-cache
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: rust-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: dtolnay/rust-toolchain@nightly
        if: needs.selection.outputs.shared-native == 'true'
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, rustfmt, clippy
          targets: wasm32-wasip1, wasm32-wasip1-threads, wasm32-unknown-unknown
      - uses: ./.github/actions/rust-build-cache
        id: rust-objects
        if: needs.selection.outputs.shared-native == 'true'
      - uses: actions/cache/restore@v4
        if: needs.selection.outputs.shared-native == 'true'
        id: shared-native-cache
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}/shared-native
          key: shared-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/ci-build-tools.ts', 'scripts/sync-*.sh', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake') }}-${{ steps.shared-inputs.outputs.hash }}-${{ hashFiles('Cargo.toml', '.cargo/**', 'crates/**', 'third_party/**', 'patches/**', 'scripts/build-native-profile.ts', 'scripts/producer-diagnostics.ts', 'scripts/build-bun-core.sh', 'scripts/build-engine-quickjs.sh', 'scripts/build-engine-spidermonkey-shared.sh', 'scripts/spidermonkey-side-core-receipt.ts', 'spidermonkey/**', 'scripts/guest-*.ts', 'scripts/src/program-profile.ts', 'scripts/src/engine-*.ts', 'scripts/src/engine-init.c', 'env.sh') }}
          restore-keys: |
            shared-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/ci-build-tools.ts', 'scripts/sync-*.sh', 'jsc/wasi-jsc.cmake', 'scripts/check-cmake-cache.cmake') }}-${{ steps.shared-inputs.outputs.hash }}-
      - name: Shared profile cache result
        if: needs.selection.outputs.shared-native == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/shared-spidermonkey-producer"
          echo "shared native exact cache hit=${{ steps.shared-native-cache.outputs.cache-hit }}; matched=${{ steps.shared-native-cache.outputs.cache-matched-key }}" | tee "$RUNNER_TEMP/shared-spidermonkey-producer/cache-result.log"
      - name: Prepare the shared native source dependencies
        if: needs.selection.outputs.shared-native == 'true'
        run: |
          source env.sh
          bash scripts/sync-bun.sh
          bash scripts/sync-crypto.sh
          cargo fetch --locked
          guest_environment=$(bun scripts/guest-build-receipt.ts environment)
          eval "$guest_environment"
          sysroot=$("$RUSTC" --print sysroot)
          "$GUEST_CARGO" fetch --locked --manifest-path "$sysroot/lib/rustlib/src/rust/library/Cargo.toml" --target wasm32-wasip1
      - name: Produce the shared native profile once
        id: shared-quickjs-producer
        if: needs.selection.outputs.shared-native == 'true'
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        run: |
          source env.sh
          bun scripts/build-native-profile.ts shared-group "$CARGO_TARGET_DIR/shared-native"
      - name: Retain the matched shared QuickJS program for qualification
        if: ${{ always() && steps.shared-quickjs-producer.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: shared-quickjs-program
          path: ${{ env.CARGO_TARGET_DIR }}/shared-native/program/
          if-no-files-found: error
          retention-days: 1
      - name: Produce the shared JSC profile once
        id: shared-jsc-producer
        if: needs.selection.outputs.shared-native == 'true'
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash scripts/with-build-cache.sh bash --noprofile --norc -e -o pipefail {0}
        env:
          JSC_PROFILE: shared-group
          JOBS: "2"
          CAGE: ""
        run: |
          source env.sh
          bun scripts/build-native-profile.ts shared-group "$CARGO_TARGET_DIR/shared-native" jsc
      - name: Retain the matched shared JSC program for qualification
        if: ${{ always() && steps.shared-jsc-producer.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: shared-jsc-program
          path: ${{ env.CARGO_TARGET_DIR }}/shared-native/program-jsc/
          if-no-files-found: error
          retention-days: 1
      - name: Configure the shared SpiderMonkey consumer inputs
        if: needs.selection.outputs.shared-native == 'true'
        run: |
          echo "SPIDERMONKEY_BUILD_DIR=$RUNNER_TEMP/spidermonkey/shared" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_NATIVE_DIR=$RUNNER_TEMP/spidermonkey/shared/native" >> "$GITHUB_ENV"
          echo "SPIDERMONKEY_LIBCXX_DIR=$JSC_BUILD_DIR/libcxx/lib" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        if: needs.selection.outputs.shared-native == 'true'
        with:
          name: shared-spidermonkey-prebuild
          path: ${{ runner.temp }}/spidermonkey/shared
      - name: Verify the shared SpiderMonkey producer transfer
        if: needs.selection.outputs.shared-native == 'true'
        env:
          SM_PREBUILD_MANIFEST_SHA256: ${{ needs.shared-spidermonkey-prebuild.outputs.manifest-sha256 }}
        run: |
          source env.sh
          bun scripts/ci-spidermonkey-prebuild.ts verify "$SPIDERMONKEY_BUILD_DIR" "$SM_PREBUILD_MANIFEST_SHA256"
      - name: Produce the shared SpiderMonkey profile once
        id: shared-spidermonkey-producer
        if: needs.selection.outputs.shared-native == 'true'
        run: |
          source env.sh
          bun scripts/producer-diagnostics.ts run "$RUNNER_TEMP/shared-spidermonkey-producer" "$SHARED_PRODUCER_DEADLINE_MS" \
            bash scripts/with-build-cache.sh bun scripts/build-native-profile.ts shared-group "$CARGO_TARGET_DIR/shared-native" spidermonkey
      - name: Retain shared SpiderMonkey producer diagnostics
        if: ${{ always() && steps.shared-spidermonkey-producer.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: shared-spidermonkey-producer-diagnostics
          path: ${{ runner.temp }}/shared-spidermonkey-producer/
          if-no-files-found: warn
          retention-days: 1
      - name: Retain the matched shared SpiderMonkey program for qualification
        if: ${{ always() && steps.shared-spidermonkey-producer.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: shared-spidermonkey-program
          path: |
            ${{ env.CARGO_TARGET_DIR }}/shared-native/program-spidermonkey/
            ${{ env.CARGO_TARGET_DIR }}/shared-native/spidermonkey/inputs.json
            ${{ env.CARGO_TARGET_DIR }}/shared-native/spidermonkey/engine-link.map
            ${{ env.SPIDERMONKEY_BUILD_DIR }}/receipt/
          if-no-files-found: error
          retention-days: 1
      - name: Save the completed shared native profile
        if: ${{ success() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.selection.outputs.shared-native == 'true' && steps.shared-native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}/shared-native
          key: ${{ steps.shared-native-cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/save-rust-build-cache
        if: needs.selection.outputs.shared-native == 'true'
        with:
          key: ${{ steps.rust-objects.outputs.cache-primary-key }}
      - uses: ./.github/actions/save-release-downloads

      - name: Prepare the same-source shared proof handoff
        if: needs.selection.outputs.shared-native == 'true'
        run: |
          source env.sh
          bun scripts/ci-shared-proof-inputs.ts prepare "$RUNNER_TEMP/shared-proof-inputs" "$CARGO_TARGET_DIR/shared-native" "$BUN_WASM_BROWSER_SITE"
      - name: Export ready shared proof inputs
        if: needs.selection.outputs.shared-native == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: shared-proof-inputs
          path: ${{ runner.temp }}/shared-proof-inputs/
          if-no-files-found: error
          retention-days: 1

  shared-native:
    name: Shared native (${{ matrix.engine }})
    needs: [selection, ordinary-web-guests, rust, shared-sysroot]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() && needs.selection.result == 'success' && needs.rust.result == 'success' && needs.ordinary-web-guests.result == 'success' && needs.shared-sysroot.result == 'success' && needs.selection.outputs.shared-native == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [quickjs, jsc, spidermonkey]
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Require the ready shared producer
        env:
          SHARED_PRODUCER_RESULT: ${{ needs.shared-sysroot.result }}
        run: test "$SHARED_PRODUCER_RESULT" = success
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: shared-proof-inputs
          path: ${{ runner.temp }}/shared-proof-inputs
      - name: Verify the ready shared inputs
        run: |
          source env.sh
          bun scripts/ci-shared-proof-inputs.ts verify "$RUNNER_TEMP/shared-proof-inputs"
          echo "BUN_WASM_PROFILE_PROGRAM=$RUNNER_TEMP/shared-proof-inputs/program-${{ matrix.engine }}/bun.wasm" >> "$GITHUB_ENV"
          echo "BUN_WASM_BROWSER_SITE=$RUNNER_TEMP/shared-proof-inputs/browser" >> "$GITHUB_ENV"
          echo "BUN_WASM_PREPARED_SHARED_SITE=1" >> "$GITHUB_ENV"
      - name: Require the native launcher producer
        env:
          PROFILE_LAUNCHER_RESULT: ${{ needs.rust.result }}
        run: test "$PROFILE_LAUNCHER_RESULT" = success
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: native-profile-launcher
          path: ${{ runner.temp }}/native-profile-launcher
      - name: Verify the native launcher source
        run: |
          test "$(cat "$RUNNER_TEMP/native-profile-launcher/source.txt")" = "$GITHUB_SHA"
          chmod +x "$RUNNER_TEMP/native-profile-launcher/bun-wasm"
      - name: Consume the discovered shared native checks sequentially
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          source env.sh
          export BUN_WASM_LAUNCHER="$RUNNER_TEMP/native-profile-launcher/bun-wasm"
          export BUN_WASM_TRACE=1
          bun scripts/test-checks.ts native --profile shared-group

  shared-browser:
    name: Shared Browser (${{ matrix.engine }})
    needs: [selection, shared-sysroot]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.shared-native == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [quickjs, jsc, spidermonkey]
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Require the ready shared producer
        env:
          SHARED_PRODUCER_RESULT: ${{ needs.shared-sysroot.result }}
        run: test "$SHARED_PRODUCER_RESULT" = success
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: shared-proof-inputs
          path: ${{ runner.temp }}/shared-proof-inputs
      - name: Verify the ready shared inputs
        run: |
          source env.sh
          bun scripts/ci-shared-proof-inputs.ts verify "$RUNNER_TEMP/shared-proof-inputs"
          echo "BUN_WASM_PROFILE_PROGRAM=$RUNNER_TEMP/shared-proof-inputs/program-${{ matrix.engine }}/bun.wasm" >> "$GITHUB_ENV"
          echo "BUN_WASM_BROWSER_SITE=$RUNNER_TEMP/shared-proof-inputs/browser" >> "$GITHUB_ENV"
          echo "BUN_WASM_PREPARED_SHARED_SITE=1" >> "$GITHUB_ENV"
      - name: Install Web browser test dependencies
        run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --cwd web --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/browser-deps
        with:
          browsers: chromium
      - name: Install Chromium
        working-directory: web
        run: bunx playwright install chromium
      - name: Consume the discovered shared Browser checks sequentially
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          source env.sh
          bun scripts/run-with-timeout.mts ${{ matrix.engine == 'spidermonkey' && 1320 || 420 }} bun scripts/test-checks.ts browser-guest --profile shared-group
      # Chromium's renderer has crashed here with only "Target crashed" in the log. The kernel
      # log tells a memory kill from a renderer fault.
      - name: Show kernel memory kills and faults after a failure
        if: failure()
        run: |
          free -m
          sudo dmesg --ctime | grep -iE 'out of memory|oom|killed process|segfault|traps:' | tail -n 50 || true

  shared-proof:
    name: Shared PIC sysroot proof
    needs: [selection, ordinary-web-guests, quality, rust, shared-prebuild, shared-spidermonkey-prebuild, shared-sysroot, shared-native, shared-browser]
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.selection.outputs.shared == 'true' || needs.selection.outputs.shared-native == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected shared producer and consumer
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARED_PREBUILD_RESULT: ${{ needs.shared-prebuild.result }}
          SHARED_PRODUCER_RESULT: ${{ needs.shared-sysroot.result }}
          SHARED_NATIVE: ${{ needs.selection.outputs.shared-native }}
          FULL_SELECTED: ${{ (needs.selection.outputs.rust == 'true' || (github.event_name != 'pull_request' && needs.selection.outputs.browser_guest == 'true')) }}
          ORDINARY_WEB_RESULT: ${{ needs.ordinary-web-guests.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SM_RESULT: ${{ needs.shared-spidermonkey-prebuild.result }}
          NATIVE_RESULT: ${{ needs.shared-native.result }}
          BROWSER_RESULT: ${{ needs.shared-browser.result }}
        run: |
          test "$SELECTION_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$SHARED_PREBUILD_RESULT" = success
          test "$SHARED_PRODUCER_RESULT" = success
          case "$FULL_SELECTED" in
            true) test "$RUST_RESULT" = success; test "$ORDINARY_WEB_RESULT" = success ;;
            false) test "$RUST_RESULT" = skipped; test "$ORDINARY_WEB_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
          case "$SHARED_NATIVE" in
            true) test "$RUST_RESULT" = success; expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$SM_RESULT" = "$expected"
          test "$NATIVE_RESULT" = "$expected"
          test "$BROWSER_RESULT" = "$expected"

  web:
    needs: [selection, web-unit, web-browser]
    if: ${{ always() && needs.selection.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Web host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Require all Web host unit and browser gates
        env:
          WEB_UNIT_RESULT: ${{ needs.web-unit.result }}
          WEB_BROWSER_RESULT: ${{ needs.web-browser.result }}
        run: test "$WEB_UNIT_RESULT" = success && test "$WEB_BROWSER_RESULT" = success
      - uses: ./.github/actions/release-downloads
        with:
          scope: web
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install Web host browser test dependencies
        run: bash ../scripts/test-web-host.sh --setup
      - uses: ./.github/actions/browser-deps
        with:
          browsers: chromium firefox webkit
      - name: Install Chromium, Firefox and WebKit
        run: bunx playwright install chromium firefox webkit
      - name: Web host browser gates
        env:
          EDITOR_SCRATCH_ROOT: ${{ runner.temp }}
        run: bash ../scripts/test-web-host.sh --smoke
      - uses: ./.github/actions/save-release-downloads

  web-unit:
    needs: selection
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Web host unit and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
        with:
          scope: web
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Configure Web compiler toolchain
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=nightly-2026-09-15" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: web-rustup-cache
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: rust-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, rustfmt, clippy
          targets: wasm32-wasip1, wasm32-wasip1-threads, wasm32-unknown-unknown
      - name: Save completed Web compiler setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.web-rustup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.RUSTUP_HOME }}
          key: ${{ steps.web-rustup-cache.outputs.cache-primary-key }}
      - name: Web host unit, CLI shim, type and bundle gates
        env:
          C1_WEBKIT_FAILURE_DIRECTORY: ${{ runner.temp }}/c1-webkit-failures
        run: bash ../scripts/test-web-host.sh --unit
      - name: Retain first C1 WebKit admission failure
        if: failure()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: c1-webkit-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c1-webkit-failures
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/save-release-downloads

  web-browser:
    needs: selection
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Web browser (${{ matrix.batch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.web-browser-shards) }}
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
        with:
          scope: web
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install Web host browser test dependencies
        run: bash ../scripts/test-web-host.sh --setup
      - uses: ./.github/actions/browser-deps
        with:
          browsers: chromium firefox webkit
      - name: Install Chromium, Firefox and WebKit
        run: bunx playwright install chromium firefox webkit
      - name: Run the discovered Web browser shard
        env:
          EDITOR_SCRATCH_ROOT: ${{ runner.temp }}
          WEB_BROWSER_BATCH: ${{ matrix.batch }}
          WEB_BROWSER_TIMEOUT_SECONDS: ${{ matrix.timeoutSeconds }}
        run: bun ../scripts/run-with-timeout.mts "$WEB_BROWSER_TIMEOUT_SECONDS" bun ../scripts/test-checks.ts web-browser --batch "$WEB_BROWSER_BATCH"
      - uses: ./.github/actions/save-release-downloads

  process-bundles:
    needs: selection
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Shared process browser bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
        with:
          scope: browser-guest
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --cwd web --frozen-lockfile --linker=isolated
      - name: Build each process fixture once for all browsers
        run: bun web/scripts/ci-process-bundles.ts "$RUNNER_TEMP/process-bundles"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: process-bundles
          path: ${{ runner.temp }}/process-bundles
          retention-days: 1
          if-no-files-found: error
      - uses: ./.github/actions/save-release-downloads

  browser-guest:
    needs: [selection, ordinary-web-guests, rust, browser-production]
    if: ${{ !cancelled() && needs.selection.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (((needs.selection.outputs.rust == 'true' || (github.event_name != 'pull_request' && needs.selection.outputs.rust == 'false' && needs.selection.outputs.browser_guest == 'true')) && needs.selection.outputs.browser_guest == 'true' && needs.rust.result == 'success' && needs.ordinary-web-guests.result == 'success' && needs.browser-production.result == 'skipped') || (github.event_name == 'pull_request' && needs.selection.outputs.rust == 'false' && needs.selection.outputs.browser_guest == 'true' && needs.rust.result == 'skipped' && needs.ordinary-web-guests.result == 'skipped' && needs.browser-production.result == 'success')) }}
    name: Browser guest (${{ matrix.browser }}, ${{ matrix.batch }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(matrix.batch, '2') && 60 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        batch: ${{ fromJSON(needs.selection.outputs.browser-guest-batches) }}
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --linker=isolated
      - uses: ./.github/actions/browser-deps
        with:
          browsers: ${{ matrix.browser == 'chromium' && 'chromium firefox' || matrix.browser }}
      - name: Install browser
        run: bunx playwright install ${{ matrix.browser == 'chromium' && 'chromium firefox' || matrix.browser }}
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-guest-site
          path: ${{ runner.temp }}/browser-guest-site
      - name: Browser-guest checks on the verified site
        env:
          BUN_WASM_BROWSER_COVERAGE_SELECTION: ${{ needs.selection.outputs.browser-coverage-selection }}
          BUN_WASM_BROWSER_COVERAGE_REPORTS: ${{ runner.temp }}/browser-guest-diagnostics
          BUN_WASM_BROWSER_SITE: ${{ runner.temp }}/browser-guest-site
          BUN_WASM_BROWSER_REPORT_DIR: ${{ runner.temp }}/browser-guest-diagnostics
          BUN_WASM_TEST_BROWSERS: ${{ matrix.browser }}
          BUN_WASM_JSC_PRODUCER: ${{ needs.selection.outputs.jsc == 'true' && 'selected' || 'unselected' }}
          TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p "$BUN_WASM_BROWSER_REPORT_DIR"
          bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --cwd .. --frozen-lockfile --ignore-scripts
          source ../env.sh
          bun ../scripts/run-with-timeout.mts ${{ startsWith(matrix.batch, '2') && 3240 || 900 }} bun ../scripts/test-checks.ts browser-guest --batch "${{ matrix.batch }}"
      - name: Retain Browser guest diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: browser-guest-diagnostics-${{ matrix.browser }}-${{ matrix.batch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-guest-diagnostics
          if-no-files-found: ignore
          retention-days: 1
      - uses: ./.github/actions/save-release-downloads

  browser-process:
    needs: [selection, ordinary-web-guests, rust, browser-production, process-bundles, browser-guest]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (always() && !cancelled() && needs.selection.result == 'success' && needs.process-bundles.result == 'success' && ((((needs.selection.outputs.rust == 'true' || (github.event_name != 'pull_request' && needs.selection.outputs.rust == 'false' && needs.selection.outputs.browser_guest == 'true')) && needs.selection.outputs.browser_guest == 'true' && needs.rust.result == 'success' && needs.ordinary-web-guests.result == 'success' && needs.browser-production.result == 'skipped') || (github.event_name == 'pull_request' && needs.selection.outputs.rust == 'false' && needs.selection.outputs.browser_guest == 'true' && needs.rust.result == 'skipped' && needs.ordinary-web-guests.result == 'skipped' && needs.browser-production.result == 'success')) || (needs.selection.outputs.rust == 'false' && needs.selection.outputs.browser_guest == 'false' && needs.rust.result == 'skipped' && needs.ordinary-web-guests.result == 'skipped' && needs.browser-production.result == 'skipped'))) }}
    name: Processes (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        shell: setpriv --inh-caps=-all --ambient-caps=-all bash --noprofile --norc -e -o pipefail {0}
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected Browser guest batch
        env:
          BROWSER_GUEST: ${{ needs.selection.outputs.browser_guest }}
          GUEST_RESULT: ${{ needs.browser-guest.result }}
        run: |
          case "$BROWSER_GUEST" in
            true) test "$GUEST_RESULT" = success ;;
            false) test "$GUEST_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
      - uses: actions/cache/restore@v4
        with:
          path: .ci-bun-cache
          key: bun-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: process-bundles
          path: ${{ runner.temp }}/process-bundles
      - run: bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --frozen-lockfile --linker=isolated
      - uses: ./.github/actions/browser-deps
        with:
          browsers: ${{ matrix.browser == 'chromium' && 'chromium firefox' || matrix.browser }}
      - name: Install browser
        run: bunx playwright install ${{ matrix.browser == 'chromium' && 'chromium firefox' || matrix.browser }}
      - name: Process supervisor, generic preview1 and interrupt gate (no Rust or dist artifacts)
        env:
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          PROCESS_SMOKE_PORT: "4186"
          TMPDIR: ${{ runner.temp }}
        run: bun ../scripts/run-with-timeout.mts 300 bun tests/browser-process.ts ${{ matrix.browser }}
      - name: Injected third-party interrupt checks (no Rust or dist artifacts)
        env:
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          INTERRUPT_SCRATCH_ROOT: ${{ runner.temp }}
        run: bun ../scripts/run-with-timeout.mts 300 bun tests/browser-interrupt.ts ${{ matrix.browser }}
      - name: Process pipes, CLI ABI and foreground stop (isolated install, no Rust or dist artifacts)
        env:
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          TMPDIR: ${{ runner.temp }}
          BUN_WASM_RUNTIME_PROC_BUNDLE: ${{ runner.temp }}/process-bundles/runtime-proc
        run: bun ../scripts/run-with-timeout.mts 300 bun tests/browser-runtime-proc.ts ${{ matrix.browser }}

      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        if: needs.selection.outputs.browser_guest == 'true'
        with:
          name: browser-program
          path: dist/browser-program
      - name: Real Bun source cache in one Waffle browser runtime
        if: needs.selection.outputs.browser_guest == 'true'
        env:
          BUN_WASM_RUNTIME_PROC_ARTIFACT: ${{ github.workspace }}/dist/browser-program/bun-browser.wasm
          BUN_WASM_RUNTIME_PROC_SCENARIO: source-cache
          BUN_WASM_PROCESS_BUNDLES: ${{ runner.temp }}/process-bundles
          BUN_WASM_RUNTIME_PROC_PORT: "4187"
          TMPDIR: ${{ runner.temp }}
        run: |
          source ../env.sh
          bun ../scripts/ci-browser-program.ts verify ../dist/browser-program
          bun ../scripts/run-with-timeout.mts 300 bun tests/bun-runtime-proc-browser.ts ${{ matrix.browser }}
      - name: Native Wasm module and shared-memory worker transfer
        if: needs.selection.outputs.browser_guest == 'true'
        env:
          BUN_WASM_TRANSFER_ARTIFACT: ${{ github.workspace }}/dist/browser-program/bun-browser.wasm
          TMPDIR: ${{ runner.temp }}
        run: |
          bun "$GITHUB_WORKSPACE/scripts/ci-install.ts" --cwd ../tests/fixtures/worker-wasm --frozen-lockfile --ignore-scripts
          bun ../scripts/run-with-timeout.mts 120 bun tests/browser-wasm-transfer.ts ${{ matrix.browser }}
      - uses: ./.github/actions/save-release-downloads

  ci-result:
    name: Code quality
    needs: [selection, ordinary-web-guests, quality, jsc-identity, jsc-prebuild, native-quality, rust, browser-production, package, shared-jsc-identity, shared-prebuild, shared-spidermonkey-prebuild, shared-sysroot, shared-native, shared-browser, shared-proof, web, web-unit, web-browser, process-bundles, browser-guest, browser-process]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: 1.4.4
          node-version: ${{ env.CI_NODE_VERSION }}
      - name: Require every selected CI job to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: bun scripts/ci-result.ts

  update-status:
    name: Report automated update statuses
    needs: [selection, ordinary-web-guests, quality, jsc-identity, jsc-prebuild, native-quality, rust, browser-production, package, shared-jsc-identity, shared-prebuild, shared-spidermonkey-prebuild, shared-sysroot, shared-native, shared-browser, shared-proof, web, web-unit, web-browser, process-bundles, browser-guest, browser-process, ci-result]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automation/owned-dependency-updates' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # Dispatch job checks do not satisfy PR requirements. Commit statuses do.
      - name: Report each required result on the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.sha }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          while IFS='|' read -r context job selection; do
            result=$(jq -er --arg job "$job" '.[$job].result' <<< "$RESULTS")
            state=failure
            if [[ "$result" == success ]]; then state=success; fi
            # A classifier-disabled job is an intentional skip, just as in PR CI.
            if [[ "$result" == skipped && -n "$selection" ]] &&
              jq -e --arg selection "$selection" '.selection.result == "success" and .selection.outputs[$selection] == "false" and ($selection != "rust" or .selection.outputs.browser_guest == "false")' <<< "$RESULTS" >/dev/null; then
              state=success
            fi
            gh api --method POST "repos/$GH_REPO/statuses/$HEAD" \
              -f context="$context" -f state="$state" -f target_url="$RUN_URL" \
              -f description="Dispatched CI: $result"
          done <<'STATUSES'
          Code quality|ci-result|
          JSC C/C++ prebuild|jsc-prebuild|rust
          Native quality checkpoint|native-quality|rust
          Rust workspace tests (QuickJS host)|rust|rust
          Browser adapter package|package|
          Shared PIC sysroot proof|shared-proof|shared
          Web host|web|
          Shared process browser bundles|process-bundles|
          Processes (chromium)|browser-process|
          Processes (firefox)|browser-process|
          Processes (webkit)|browser-process|
          STATUSES
