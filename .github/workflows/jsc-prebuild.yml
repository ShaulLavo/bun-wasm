name: JSC cache producer

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.ci-bun-cache

jobs:
  identity:
    name: Resolve effective JSC inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      key: ${{ steps.setup.outputs.key }}
      sysroot-sha256: ${{ steps.sysroot.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/jsc-setup
        id: setup
      - name: Package this run's prepared sysroot
        id: sysroot
        shell: bash
        run: |
          source env.sh
          transfer="$RUNNER_TEMP/jsc-identity-sysroot.tar.zst"
          tar --posix -C "$WASM_TOOLS" -cf - bun-wasm-sysroot-patched | zstd -T0 -q -o "$transfer"
          echo "sha256=$(sha256sum "$transfer" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/jsc-identity-sysroot.tar.zst
          if-no-files-found: error
          retention-days: 1
          archive: false
      - uses: ./.github/actions/save-release-downloads

  jsc-prebuild:
    name: Warm verified JSC cache
    needs: identity
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.identity.outputs.key }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 45
    outputs:
      manifest-sha256: ${{ steps.prebuild.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: jsc-identity-sysroot.tar.zst
          path: ${{ runner.temp }}
      - uses: ./.github/actions/jsc-setup
        id: setup
        with:
          sysroot: ${{ needs.identity.outputs.sysroot-sha256 }}
      - uses: ./.github/actions/jsc-prebuild
        id: prebuild
        with:
          key: ${{ steps.setup.outputs.key }}
          prefix: ${{ steps.setup.outputs.prefix }}
          expected-key: ${{ needs.identity.outputs.key }}
          transfer: 'false'
      - uses: ./.github/actions/save-release-downloads
